function buildQuoteDocumentParts(state){
  const items = state.items.filter(it => (it.name||'').trim());
  const totalQty = items.reduce((s,it)=> s + (Number(it.qty)||0), 0);
  const totalAmount = items.reduce((s,it)=> s + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  const isReceipt = state.docType === 'receipt';
  const title = isReceipt ? 'ໃບຮັບເງິນ' : 'ໃບສະເໜີລາຄາ';
  const titleEn = isReceipt ? '(Receipt)' : '(Quotation)';
  let dateLabel = state.date;
  try{
    const [y,m,d] = state.date.split('-');
    if(y && m && d) dateLabel = `${d}/${m}/${y}`;
  }catch(e){}

  const headerHtml = `
    <div style="text-align:center; font-size:12px; margin-bottom:10px; line-height:1.5;">
      <div>ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ</div>
      <div>ສັນຕິພາບ ເອກະລາດ ປະຊາທິປະໄຕ ເອກະພາບ ວັດທະນະຖາວອນ</div>
    </div>
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; border-bottom:2px solid #1C2B33; padding-bottom:10px; margin-bottom:14px;">
      <div style="display:flex; gap:10px; align-items:center;">
        ${state.logo ? `<img src="${state.logo}" style="width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0;">` : ''}
        <div>
          <div style="font-weight:800; font-size:15px;">${esc(state.shopName)}</div>
          ${state.shopAddress ? `<div style="font-size:11px; color:#555; margin-top:2px;">${esc(state.shopAddress)}</div>` : ''}
          ${(state.shopPhone || state.shopEmail) ? `<div style="font-size:11px; color:#555;">${state.shopPhone ? esc(state.shopPhone) : ''}${state.shopPhone && state.shopEmail ? ' &middot; ' : ''}${state.shopEmail ? esc(state.shopEmail) : ''}</div>` : ''}
        </div>
      </div>
      <div style="text-align:right; font-size:11px; color:#555; white-space:nowrap;">
        <div>ເລກທີ: ${esc(state.docNumber)}</div>
        <div>ວັນທີ: ${esc(dateLabel)}</div>
      </div>
    </div>
    <div style="text-align:center; margin-bottom:14px;">
      <div style="font-size:17px; font-weight:800;">${title}</div>
      <div style="font-size:12px; color:#777;">${titleEn}</div>
    </div>
  `;

  const rowsHtml = items.map((it,i) => `
    <tr>
      <td style="text-align:center;">${i+1}</td>
      <td>${esc(it.name)}</td>
      <td style="text-align:center;">${esc(it.size || '-')}</td>
      <td class="num">${(Number(it.qty)||0).toLocaleString()}</td>
      <td class="num">${(Number(it.price)||0).toLocaleString()}</td>
      <td class="num">${((Number(it.qty)||0)*(Number(it.price)||0)).toLocaleString()}</td>
    </tr>
  `).join('') || `<tr><td colspan="6" style="text-align:center; color:#888;">ຍັງບໍ່ມີລາຍການສິນຄ້າ</td></tr>`;

  const bodyHtml = `
    <table class="print-table" style="margin-bottom:4px;">
      <thead><tr>
        <th style="width:44px; text-align:center;">ລ/ດ</th>
        <th>ຊື່ສິນຄ້າ</th>
        <th style="width:70px; text-align:center;">ຂະໜາດ</th>
        <th class="num" style="width:60px;">ຈຳນວນ</th>
        <th class="num" style="width:90px;">ລາຄາ/ໜ່ວຍ</th>
        <th class="num" style="width:110px;">ມູນຄ່າ (ກີບ)</th>
      </tr></thead>
      <tbody>${rowsHtml}
        <tr style="font-weight:700;">
          <td colspan="3" style="text-align:right;">ລວມທັງໝົດ</td>
          <td class="num">${totalQty.toLocaleString()}</td>
          <td></td>
          <td class="num">${totalAmount.toLocaleString()}</td>
        </tr>
      </tbody>
    </table>
    <div style="margin:14px 0 40px; font-size:12px; text-align:center;">ຈຳນວນເງິນເປັນຕົວໜັງສື: <b>${esc(numberToLaoWords(totalAmount))}ກີບ</b></div>
    <div style="display:flex; justify-content:flex-end;">
      <div style="text-align:center; font-size:12px;">
        <div style="margin-bottom:50px;">${isReceipt ? 'ຜູ້ຮັບເງິນ' : 'ຫົວໜ້າສາຂາ'}</div>
        <div style="border-top:1px solid #999; padding-top:4px; min-width:150px;">${esc(state.signer || '')}</div>
      </div>
    </div>
  `;

  return { title: `${title} ${titleEn}`, headerHtml, bodyHtml, hasItems: items.length > 0 };
}

function saveQuoteRecord(){
  const state = quoteFormState;
  if(!state) return;
  const { hasItems } = buildQuoteDocumentParts(state);
  if(!hasItems){ showToast('ກະລຸນາໃສ່ລາຍການສິນຄ້າຢ່າງໜ້ອຍ 1 ລາຍການ'); return; }

  saveQuoteShopInfo({
    shopName: state.shopName, shopAddress: state.shopAddress,
    shopPhone: state.shopPhone, shopEmail: state.shopEmail, signer: state.signer, logo: state.logo
  });

  const cleanItems = state.items
    .filter(it => (it.name||'').trim())
    .map(it => ({ name:it.name, size:it.size||'', qty:Number(it.qty)||0, price:Number(it.price)||0 }));
  const now = new Date().toISOString();
  let savedId = state.id;

  if(state.id){
    const idx = savedQuotes.findIndex(q => q.id === state.id);
    const updated = {
      id: state.id, docType: state.docType, docNumber: state.docNumber, date: state.date,
      shopName: state.shopName, shopAddress: state.shopAddress, shopPhone: state.shopPhone, shopEmail: state.shopEmail,
      logo: state.logo, signer: state.signer, items: cleanItems,
      createdAt: (idx >= 0 && savedQuotes[idx].createdAt) ? savedQuotes[idx].createdAt : now,
      updatedAt: now
    };
    if(idx >= 0) savedQuotes[idx] = updated; else savedQuotes.push(updated);
  } else {
    const nextNum = parseInt(state.docNumber, 10);
    if(!isNaN(nextNum)) localStorage.setItem(QUOTE_NUMBER_KEY, String(nextNum + 1));
    savedId = uid();
    savedQuotes.push({
      id: savedId, docType: state.docType, docNumber: state.docNumber, date: state.date,
      shopName: state.shopName, shopAddress: state.shopAddress, shopPhone: state.shopPhone, shopEmail: state.shopEmail,
      logo: state.logo, signer: state.signer, items: cleanItems,
      createdAt: now, updatedAt: now
    });
  }
  persistSavedQuotes();
  scheduleAutoSync();

  // ຫຼັງບັນທຶກ, ເອກະສານຍັງຄົງປົດລ໋ອກໄວ້ອີກ 5 ນາທີ (ເຜື່ອຕ້ອງແກ້ໄຂຕໍ່) ແລ້ວຈິ່ງລ໋ອກຄືນອັດຕະໂນມັດ.
  quoteUnlockedIds[savedId] = true;
  scheduleQuoteAutoLock(savedId);

  closeQuoteModal();
  showToast('ບັນທຶກແລ້ວ');
  openQuoteListModal(savedId);
}

function openQuotePdfFromRecord(record){
  const { title, headerHtml, bodyHtml } = buildQuoteDocumentParts(record);
  showPdfPreview(title, bodyHtml, headerHtml);
}

/* ປຸ່ມ PDF ດ່ວນ ຢູ່ແຕ່ລະລາຍການໃນໜ້າ "ເບິ່ງໃບສະເໜີລາຄາ": ບັນທຶກເປັນ PDF ລົງເຄື່ອງທັນທີ ບໍ່ຕ້ອງເປີດ preview ກ່ອນ. */
async function downloadQuotePdfDirect(record, btn){
  if(btn) btn.disabled = true;
  showToast('ກຳລັງສ້າງໄຟລ໌ PDF...');
  try{
    const ok = await ensurePdfLibs();
    if(!ok){ showToast('ບໍ່ສາມາດສ້າງໄຟລ໌ PDF ໄດ້, ກະລຸນາເຊື່ອມຕໍ່ອິນເຕີເນັດແລ້ວລອງໃໝ່'); return; }
    const { title, headerHtml, bodyHtml } = buildQuoteDocumentParts(record);
    const pdf = await buildPdfDocFromHtml(headerHtml, bodyHtml);
    if(!pdf){ showToast('ສ້າງໄຟລ໌ PDF ບໍ່ສຳເລັດ'); return; }
    const base = (title || 'ເອກະສານ').replace(/[\\/:*?"<>|]/g, '').trim() || 'ເອກະສານ';
    const numPart = record.docNumber ? ('-' + record.docNumber) : '';
    pdf.save(base + numPart + '.pdf');
    showToast('ບັນທຶກໄຟລ໌ PDF ລົງເຄື່ອງສຳເລັດ');
  }catch(e){
    showToast('ສ້າງໄຟລ໌ PDF ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  } finally {
    if(btn) btn.disabled = false;
  }
}

/* ---------- ເບິ່ງໃບສະເໜີລາຄາ (list of saved quotes/receipts, arc-btn-2) ---------- */
function openQuoteListModal(focusId){
  renderQuoteListModal(focusId || null);
}
function closeQuoteListModal(){ const root = document.getElementById('quote-list-root'); if(root) root.innerHTML = ''; }

function deleteQuoteRecord(id){
  if(!confirm('ຢືນຢັນລຶບເອກະສານນີ້?')) return;
  savedQuotes = savedQuotes.filter(q => q.id !== id);
  persistSavedQuotes();
  scheduleAutoSync();
  showToast('ລຶບແລ້ວ');
  renderQuoteListModal();
}

function quoteRecordRowHtml(q){
  const total = (q.items||[]).reduce((s,it)=> s + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  const typeLabel = q.docType === 'receipt' ? 'ໃບຮັບເງິນ' : 'ໃບສະເໜີລາຄາ';
  const dateLabel = q.date ? new Date(q.date).toLocaleDateString('lo-LA') : '';
  const unlocked = isQuoteUnlocked(q.id);
  const lockTitle = unlocked ? 'ປົດລ໋ອກຢູ່ (ແກ້ໄຂໄດ້) — ແຕະ 2 ຄັ້ງເພື່ອລ໋ອກຄືນ' : 'ລ໋ອກຢູ່ (ແກ້ໄຂບໍ່ໄດ້) — ແຕະ 2 ຄັ້ງເພື່ອປົດລ໋ອກ';
  return `
    <div class="quote-record-row" data-id="${q.id}" style="background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:10px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
        <div style="min-width:0;">
          <div style="font-weight:700; font-size:14px;">ເລກທີ ${esc(q.docNumber)}</div>
          <div style="font-size:12px; color:var(--dark-50);">${typeLabel} • ${esc(dateLabel)}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <div style="font-weight:700; font-size:14px; white-space:nowrap;">${total.toLocaleString()} ກີບ</div>
          <button type="button" class="q-record-lock" data-id="${q.id}" title="${lockTitle}" style="width:28px; height:28px; border:none; background:${unlocked ? 'rgba(76,122,94,.12)' : 'var(--dark-5)'}; border-radius:8px; padding:0; display:flex; align-items:center; justify-content:center; color:${unlocked ? 'var(--success, #4C7A5E)' : 'var(--danger)'}; cursor:pointer;">${unlocked ? ICONS.lockOpen : ICONS.lockClosed}</button>
        </div>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:nowrap; align-items:center;">
        <button type="button" class="img-btn q-record-edit" data-id="${q.id}" style="flex:1; min-width:0; padding-left:4px; padding-right:4px; white-space:nowrap;">${ICONS.edit || ''} ແກ້ໄຂ</button>
        <button type="button" class="img-btn q-record-view" data-id="${q.id}" style="flex:1; min-width:0; padding-left:4px; padding-right:4px; white-space:nowrap;">${ICONS.file || ''} ເບິ່ງ</button>
        <button type="button" class="q-record-pdf" data-id="${q.id}" title="ບັນທຶກເປັນ PDF ລົງເຄື່ອງ" style="flex-shrink:0; width:34px; height:34px; border:none; background:var(--dark-5); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;"><img src="${PDF_ICON}" alt="PDF" style="width:20px; height:20px; object-fit:contain;"></button>
        <button type="button" class="q-record-delete" data-id="${q.id}" title="ລຶບ" style="flex-shrink:0; width:34px; height:34px; border:none; background:var(--dark-5); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--danger); cursor:pointer; padding:0;">${ICONS.x}</button>
      </div>
    </div>
  `;
}

function renderQuoteListModal(focusId){
  const root = document.getElementById('quote-list-root');
  if(!root) return;
  const sorted = [...savedQuotes].sort((a,b)=> new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt));

  root.innerHTML = `
    <div class="overlay center" id="quote-list-overlay" style="padding:0 10px;">
      <div class="modal" id="quote-list-modal" style="max-width:560px; border-radius:20px; padding-bottom:20px;">
        <div class="modal-head">
          <h2>ເບິ່ງໃບສະເໜີລາຄາ</h2>
          <button class="icon-x" id="quote-list-close">${ICONS.x}</button>
        </div>
        <div id="quote-list-rows">
          ${sorted.length ? sorted.map(quoteRecordRowHtml).join('') : `<div style="text-align:center; color:var(--dark-40); padding:24px 0;">ຍັງບໍ່ມີເອກະສານທີ່ບັນທຶກໄວ້</div>`}
        </div>
      </div>
    </div>
  `;
  document.getElementById('quote-list-overlay').addEventListener('click', e=>{ if(e.target.id==='quote-list-overlay') closeQuoteListModal(); });
  document.getElementById('quote-list-close').addEventListener('click', closeQuoteListModal);
  document.querySelectorAll('.q-record-view').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = savedQuotes.find(q => q.id === btn.dataset.id);
      if(rec) openQuotePdfFromRecord(rec);
    });
  });
  document.querySelectorAll('.q-record-edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = savedQuotes.find(q => q.id === btn.dataset.id);
      if(!rec) return;
      if(!isQuoteUnlocked(rec.id)){
        showToast('ເອກະສານນີ້ຖືກລ໋ອກຢູ່ — ແຕະໜ່ວຍກຸນແຈ 2 ຄັ້ງເພື່ອປົດລ໋ອກກ່ອນຈິ່ງແກ້ໄຂໄດ້');
        return;
      }
      closeQuoteListModal();
      openQuoteModal(rec);
    });
  });
  document.querySelectorAll('.q-record-lock').forEach(btn=>{
    btn.addEventListener('click', ()=> handleQuoteLockTap(btn.dataset.id));
  });
  document.querySelectorAll('.q-record-delete').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteQuoteRecord(btn.dataset.id));
  });
  document.querySelectorAll('.q-record-pdf').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = savedQuotes.find(q => q.id === btn.dataset.id);
      if(rec) downloadQuotePdfDirect(rec, btn);
    });
  });

  if(focusId){
    const rowEl = root.querySelector(`.quote-record-row[data-id="${focusId}"]`);
    if(rowEl) rowEl.scrollIntoView({ block:'center', behavior:'smooth' });
  }
}

/* ---------- PDF EXPORT (print) ---------- */
function printReport(kind){
  const list = products.map(withTotals);
  const now = new Date().toLocaleString('lo-LA');
  let title = '';
  let bodyHtml = '';

  if(kind === 'value'){
    title = 'ລາຍງານມູນຄ່າສະຕັອກລວມ';
    const totalSKU = products.length;
    const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
    const totalValue = list.reduce((s,p)=>s+p.totalQty*p.price,0);
    const rows = [...list].sort((a,b)=>a.name.localeCompare(b.name)).map((p,i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td class="num">${p.totalQty}</td>
        <td class="num">${p.price.toLocaleString()}</td>
        <td class="num">${(p.totalQty*p.price).toLocaleString()}</td>
      </tr>
    `).join('') || `<tr><td colspan="6" style="text-align:center; color:#888;">ຍັງບໍ່ມີຂໍ້ມູນສິນຄ້າ</td></tr>`;
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການ</span><b>${totalSKU}</b></div>
        <div><span>ຈຳນວນລວມ</span><b>${totalQty} ລາຍການ</b></div>
        <div><span>ມູນຄ່າລວມ</span><b>${totalValue.toLocaleString()} ກີບ</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th class="num">ຈຳນວນ</th><th class="num">ລາຄາ/ໜ່ວຍ</th><th class="num">ມູນຄ່າລວມ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } else if(kind === 'lowstock'){
    title = 'ລາຍງານສິນຄ້າໃກ້ໝົດ';
    const lowRows = [];
    list.forEach(p => { p.lowVariants.forEach(v => { lowRows.push({p,v}); }); });
    const rows = lowRows.map(({p,v}, i) => {
      const order = findPendingOrder((p.code||'').trim(), v.size);
      return `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td>${esc(v.size)}</td>
        <td class="num" style="color:#B94A3D; font-weight:700;">${v.qty}</td>
        <td class="num">${p.minQty}</td>
        <td>${order ? ('&#128722; ສັ່ງຊື້ແລ້ວ ('+sumPendingOrderQty((p.code||'').trim(), v.size)+')') : '-'}</td>
      </tr>
    `;
    }).join('') || `<tr><td colspan="7" style="text-align:center; color:#888;">ບໍ່ມີສິນຄ້າໃກ້ໝົດ</td></tr>`;
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການໃກ້ໝົດ</span><b>${lowRows.length}</b></div>
      </div>
      <table class="print-table">
        <thead><tr><th>#</th><th>ຊື່ສິນຄ້າ</th><th>ລະຫັດ</th><th>ຂະໜາດ</th><th class="num">ຄົງເຫຼືອ</th><th class="num">ຂັ້ນຕ່ຳ</th><th>ສະຖານະສັ່ງຊື້</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } else if(kind === 'fullstock'){
    title = 'ລາຍງານຈຳນວນສິນຄ້າຄົງຄັງ';
    const rows = [];
    [...list].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      p.variants.forEach(v => { if(v.qty > 0) rows.push({p,v}); });
    });
    const trs = rows.map(({p,v}, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.code||'-')}</td>
        <td>${esc(v.size)}</td>
        <td class="num">${v.qty}</td>
        <td>${esc(p.unit)}</td>

    const skuCount = new Set(rows.map(r=>r.p.id)).size;
    const totalQty = rows.reduce((s,r)=>s+r.v.qty, 0);
    bodyHtml = `
      <div class="print-summary">
        <div><span>ຈຳນວນລາຍການ</span><b>${skuCount}</b></div>
        <div><span>ຈຳນວນລວມ</span><b>${totalQty} ລາຍການ</b></div>

/* ---------- ແຊຣ໌ຂໍ້ມູນສິນຄ້າອອກເປັນຮູບພາບ (ປຸ່ມ Messenger) ---------- */
function loadImageAsync(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* CODE128 (Set B) barcode: patterns table verified against reportlab's code128 module
   (values 0-102 = characters, 103/104/105 = START A/B/C, 106 = STOP) */
const CODE128_PATTERNS = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
const CODE128_START_B = 104, CODE128_STOP = 106;
function encodeCode128B(text){
  const values = [];
  for(let i=0;i<text.length;i++){
    const code = text.charCodeAt(i) - 32;
    if(code < 0 || code > 94) return null; /* character outside printable-ASCII Set B range */
    values.push(code);
  }
  let checksum = CODE128_START_B;
  for(let i=0;i<values.length;i++) checksum += values[i] * (i+1);
  checksum = checksum % 103;
  return [CODE128_START_B, ...values, checksum, CODE128_STOP];
}
/* draws the barcode bars centered in [x, x+maxWidth) at y, returns the actual rendered width (or 0 if it couldn't be encoded) */
function drawCode128(ctx, text, x, y, height, maxWidth){
  const symbolValues = encodeCode128B(text);
  if(!symbolValues) return 0;
  let totalModules = 0;
  symbolValues.forEach(v => { for(const ch of CODE128_PATTERNS[v]) totalModules += Number(ch); });
  const moduleWidth = Math.max(1, Math.min(4, Math.floor(maxWidth / totalModules)));
  const totalWidth = totalModules * moduleWidth;
  let cursor = x + (maxWidth - totalWidth) / 2;
  ctx.fillStyle = '#000';
  symbolValues.forEach(val => {
    const pattern = CODE128_PATTERNS[val];
    for(let i=0;i<pattern.length;i++){
      const w = Number(pattern[i]) * moduleWidth;
      if(i % 2 === 0){ ctx.fillRect(cursor, y, w, height); }
      cursor += w;
    }
  });
  return totalWidth;
}

async function generateProductShareImage(p){
  const W = 900, PAD = 40;
  const imgSize = W - PAD*2;
  const HEADER_H = 130;
  const GAP1 = 30, TITLE_H = 50;
  const hasBarcode = !!(p.code && p.code.trim());
  const BARCODE_H = hasBarcode ? 150 : 0;
  const tagRows = Math.max(1, Math.ceil(p.variants.length / 3));
  const TAGS_H = tagRows * 60 + 20;
  const FOOTER_H = 80;
  const H = HEADER_H + imgSize + GAP1 + TITLE_H + BARCODE_H + TAGS_H + FOOTER_H + PAD;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#F6F4EF';
  ctx.fillRect(0, 0, W, H);

  /* ໂລໂກ້ຮ້ານ - ປະທັບໄວ້ນຳທຸກຄັ້ງ ເພື່ອຢືນຢັນຄວາມເປັນເຈົ້າຂອງສິນຄ້າ */
  ctx.fillStyle = '#12213A';
  ctx.fillRect(0, 0, W, HEADER_H);
  try{
    const logoImg = await loadImageAsync(effectiveStoreLogo());
    ctx.save();
    roundRectPath(ctx, 30, 25, 80, 80, 40);
    ctx.clip();
    ctx.drawImage(logoImg, 30, 25, 80, 80);
    ctx.restore();
  }catch(e){}
  ctx.fillStyle = '#fff';
  ctx.font = '700 30px "Noto Sans Lao", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('MEN SHOP', 130, 62);
  ctx.font = '400 16px "Noto Sans Lao", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('Est. 2016 · Official Store', 130, 90);

  let y = HEADER_H + GAP1;
  ctx.save();
  roundRectPath(ctx, PAD, y, imgSize, imgSize, 24);
  ctx.clip();
  ctx.fillStyle = '#EAE6DC';
  ctx.fillRect(PAD, y, imgSize, imgSize);
  if(p.image){
    try{
      const pImg = await loadImageAsync(p.image);
      const scale = Math.max(imgSize/pImg.width, imgSize/pImg.height);
      const dw = pImg.width*scale, dh = pImg.height*scale;
      ctx.drawImage(pImg, PAD+(imgSize-dw)/2, y+(imgSize-dh)/2, dw, dh);
    }catch(e){}
  }
  ctx.restore();

  /* ຊື່ສິນຄ້າ - ໂຕເຂັ້ມສີດຳ ຂະໜາດໃຫຍ່ */
  y += imgSize + TITLE_H;
  ctx.fillStyle = '#000';
  ctx.font = '800 42px "Noto Sans Lao", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(p.name, W/2, y);
  ctx.textAlign = 'left';

  /* Barcode ທີ່ສະແກນໄດ້ຈິງ (CODE128) + ເລກລະຫັດສິນຄ້າ */
  if(hasBarcode){
    y += 40;
    const barH = 80;
    drawCode128(ctx, p.code.trim(), PAD, y, barH, imgSize);
    y += barH + 34;
    ctx.fillStyle = '#1C2B33';
    ctx.font = '700 26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.code.trim(), W/2, y);
    ctx.textAlign = 'left';
    y += 30;
  } else {
    y += 20;
  }

  /* ຂະໜາດ + ຈຳນວນຄົງຄັງ - ໂຕໜັງສືສີດຳເຂັ້ມ ໂຕໜາ ພື້ນຫຼັງສີຂຽວ #9AC93B */
  let tx = PAD, ty = y;
  const tagH = 52;
  ctx.font = '800 30px "Noto Sans Lao", sans-serif';
  p.variants.forEach(v=>{
    const label = v.size + ' = ' + v.qty;
    const tw = ctx.measureText(label).width + 40;
    if(tx + tw > W - PAD){ tx = PAD; ty += tagH + 12; }
    ctx.fillStyle = '#9AC93B';
    roundRectPath(ctx, tx, ty, tw, tagH, 14);
    ctx.fill();
    ctx.fillStyle = '#12213A';
    ctx.fillText(label, tx+20, ty+37);
    tx += tw + 14;
  });
  ty += tagH + 30;

  ctx.strokeStyle = '#E0DACD';
  ctx.beginPath(); ctx.moveTo(PAD, ty); ctx.lineTo(W-PAD, ty); ctx.stroke();
  ctx.fillStyle = '#8A8477';
  ctx.font = '400 18px "Noto Sans Lao", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ສົນໃຈສັ່ງຊື້ ທັກແຊັດມາຫາພວກເຮົາ', W/2, ty+40);
  ctx.textAlign = 'left';

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
}

async function doShareImage(){
  if(!shareImageState) return;

  const p = products.find(x=>x.id===id);
  const fileName = ((p && p.code) || (p && p.name) || 'product').replace(/[^a-zA-Z0-9ກ-໙_-]/g, '_') + '.png';

/* ---------- ແຊຣ໌ບິນອໍເດີ້ (ໜ້າ "ອໍເດີ້ມື້ນີ້") ອອກ social network ---------- */
/* ຮູບທີ່ແຊຣ໌ອອກໄປ: ສ້າງຈາກ card HTML ຕົວຈິງອັນດຽວກັນກັບທີ່ສະແດງຢູ່ໃນລາຍການ (buildOrderCardHtml)
   ແລ້ວຖ່າຍເປັນຮູບດ້ວຍ html2canvas — ແທນການແຕ້ມ canvas ດ້ວຍມືເປັນ "ໃບບິນ" ແບບແຍກຕ່າງຫາກ (ແບບເກົ່າ)
   ເພື່ອໃຫ້ຮູບທີ່ແຊຣ໌ອອກໄປ "ໜ້າຕາຄືກັນເປະ" ກັບສິ່ງທີ່ເຫັນຢູ່ໃນແອັບຕາມທີ່ລູກຄ້າ (ຮ້ານ) ຮ້ອງຂໍ. */
async function generateOrderShareImage(o){
  const ok = await ensurePdfLibs();
  if(!ok || !window.html2canvas) return null;
  const stage = document.createElement('div');
  stage.style.cssText = 'position:fixed; left:-9999px; top:0; width:420px;';
  stage.innerHTML = buildOrderCardHtml(o, { forExport:true });
  document.body.appendChild(stage);
  try{
    // 2 ຮອບ requestAnimationFrame ລໍໃຫ້ browser layout ແລະໂຫຼດຮູບ carrier-logo/font ສຳເລັດກ່ອນຖ່າຍ
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const canvas = await window.html2canvas(stage, { scale:3, backgroundColor:null, useCORS:true });
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
  } finally {
    stage.remove();
  }
}

function renderVariants(){
  const container = document.getElementById('variants-container');
  container.innerHTML = formState.variants.map(v => {
    const known = SIZE_OPTIONS.includes(v.size);
    const extraOpt = (v.size && !known) ? `<option value="${esc(v.size)}" selected>${esc(v.size)}</option>` : '';
    const opts = `<option value="">-- ຂະໜາດ --</option>` + extraOpt + SIZE_OPTIONS.map(s => `<option value="${esc(s)}" ${v.size===s?'selected':''}>${esc(s)}</option>`).join('');
    return `
    <div class="vrow" data-vid="${v.id}">
      <select data-vfield="size">${opts}</select>
      <input type="number" inputmode="numeric" value="${esc(v.qty)}" data-vfield="qty" placeholder="ຈຳນວນ">
      <button type="button" data-remove-variant="${v.id}" ${formState.variants.length<=1?'disabled':''}>${ICONS.trash}</button>
    </div>
  `;
  }).join('');

  container.querySelectorAll('.vrow').forEach(row=>{
    const vid = row.dataset.vid;
    row.querySelector('[data-vfield="size"]').addEventListener('change', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.size = e.target.value;
    });
    row.querySelector('[data-vfield="qty"]').addEventListener('input', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.qty = e.target.value;
    });
  });
  container.querySelectorAll('[data-remove-variant]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(formState.variants.length<=1) return;
      formState.variants = formState.variants.filter(v=>v.id!==btn.dataset.removeVariant);
      renderVariants();
    });
  });
}

function addSizeRow(size){
  if(size && formState.variants.some(v=>v.size.toLowerCase()===size.toLowerCase())) return;
  formState.variants.push({ id:uid(), size, qty:'' });
  renderVariants();
}

function handleImagePick(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  resizeImage(file).then(dataUrl=>{
    formState.image = dataUrl;
    renderModal();
  }).catch(()=>{ showToast('ເລືອກຮູບບໍ່ສຳເລັດ'); });
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleSubmit(e){
  e.preventDefault();
  const f = formState;
  const errorEl = document.getElementById('form-error');
  if(errorEl){ errorEl.style.display = 'none'; errorEl.textContent = ''; }
  if(!f.name.trim()) return;
  const price = Math.max(0, parseFloat(f.price) || 0);
  const minQty = Math.max(0, parseInt(f.minQty,10) || 0);
  const variants = f.variants
    .filter(v => v.size.trim() !== '' || f.variants.length === 1)
    .map(v => ({ id:v.id, size: v.size.trim() || 'ບໍລິການອື່ນ', qty: Math.max(0, parseInt(v.qty,10) || 0) }));

  const codeTrim = f.code.trim();
  if(codeTrim){
    const codeClash = products.some(p => p.id !== f.id && (p.code||'').trim().toLowerCase() === codeTrim.toLowerCase());
    if(codeClash){
      if(errorEl){ errorEl.textContent = 'ລະຫັດສິນຄ້າ "' + codeTrim + '" ມີຢູ່ແລ້ວ, ກະລຸນາປ່ຽນ ຫຼື ປ່ອຍຫວ່າງ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const nameTrim = f.name.trim().toLowerCase();
  const relatedProducts = products.filter(p => p.id !== f.id && p.name.trim().toLowerCase() === nameTrim);
  for(const v of variants){
    const sizeTrim = v.size.trim().toLowerCase();
    const clashProduct = relatedProducts.find(p => p.variants.some(rv => rv.size.trim().toLowerCase() === sizeTrim));
    if(clashProduct){
      if(errorEl){ errorEl.textContent = 'ຂະໜາດ "' + v.size + '" ຊ້ຳກັບສິນຄ້າ "' + clashProduct.name + '" ແລ້ວ (ຊື່ດຽວກັນ), ກະລຸນາປ່ຽນເປັນຂະໜາດອື່ນ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const payload = { name:f.name.trim(), code:codeTrim, unit:f.unit||'ລາຍການ', price, minQty, category:f.category||'', image:f.image, variants };

  if(f.id){
    products = products.map(p => p.id===f.id ? { ...p, ...payload } : p);
    showToast('ແກ້ໄຂສິນຄ້າແລ້ວ');
  } else {
    products = [{ id: Date.now().toString(), ...payload }, ...products];
    showToast('ເພີ່ມສິນຄ້າແລ້ວ');
  }
  save();
  closeModal();
  renderAll();
}

/* ---------- DELETE CONFIRM ---------- */
function confirmDelete(id){ confirmDeleteId = id; renderConfirm(); }
function cancelDelete(){ confirmDeleteId = null; renderConfirm(); }
function doDelete(){
  products = products.filter(p=>p.id!==confirmDeleteId);
  save();
  if(detailId === confirmDeleteId) closeDetail();
  confirmDeleteId = null;
  renderConfirm();
  showToast('ລຶບສິນຄ້າແລ້ວ');
  renderAll();
}
function renderConfirm(){
  const root = document.getElementById('confirm-root');
  if(!confirmDeleteId){ root.innerHTML=''; return; }
  const p = products.find(x=>x.id===confirmDeleteId);
  if(!p){ root.innerHTML=''; return; }
  root.innerHTML = `
    <div class="overlay center" id="confirm-overlay">
      <div class="confirm-box">
        <div class="modal-head" style="margin-bottom:10px;">
          <p class="title" style="margin:0;">ທ່ານຕ້ອງການລຶບຂໍ້ມູນນີ້ແທ້ບໍ?</p>

        <div class="confirm-actions">
          <button class="btn-confirm" id="do-del-btn">ຕົກລົງ</button>
        </div>
      </div>

  `;
  document.getElementById('confirm-overlay').addEventListener('click', e=>{ if(e.target.id==='confirm-overlay') cancelDelete(); });

function handleBrandImagePick(e, kind){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const opts = kind === 'logo' ? [320, 0.85] : [1000, 0.72];
  resizeImage(file, opts[0], opts[1]).then(dataUrl=>{
    try{
      if(kind === 'logo'){ logoImg = dataUrl; localStorage.setItem(LOGO_KEY, dataUrl); }
      else { coverImg = dataUrl; localStorage.setItem(COVER_KEY, dataUrl); }
      applyHeaderBrand();
      renderBrandModal();
      scheduleAutoSync();
    }catch(err){
      showToast('ຮູບໃຫຍ່ເກີນໄປ, ລອງເລືອກຮູບອື່ນ');
    }
  }).catch(()=>{ showToast('ເລືອກຮູບບໍ່ສຳເລັດ'); });
}

const ORDER_HEADER_COLOR_KEY = 'khang-sinkha-order-header-color';
const ORDER_BODY_COLOR_KEY = 'khang-sinkha-order-body-color';

function applyCustomColors(){
  const rootStyle = document.documentElement.style;
  const theme = localStorage.getItem(THEME_COLOR_KEY);
  const btn = localStorage.getItem(BTN_COLOR_KEY);
  const topbar = localStorage.getItem(TOPBAR_COLOR_KEY);
  const bottombar = localStorage.getItem(BOTTOMBAR_COLOR_KEY);
  const orderHeader = localStorage.getItem(ORDER_HEADER_COLOR_KEY);
  const orderBody = localStorage.getItem(ORDER_BODY_COLOR_KEY);
  if(theme){ rootStyle.setProperty('--accent', theme); } else { rootStyle.removeProperty('--accent'); }
  if(btn){ rootStyle.setProperty('--btn-color', btn); } else { rootStyle.removeProperty('--btn-color'); }
  if(topbar){ rootStyle.setProperty('--topbar-color', topbar); } else { rootStyle.removeProperty('--topbar-color'); }
  if(bottombar){ rootStyle.setProperty('--bottombar-color', bottombar); } else { rootStyle.removeProperty('--bottombar-color'); }
  if(orderHeader){ rootStyle.setProperty('--order-header-color', orderHeader); } else { rootStyle.removeProperty('--order-header-color'); }
  if(orderBody){ rootStyle.setProperty('--order-body-color', orderBody); } else { rootStyle.removeProperty('--order-body-color'); }
}

/* ---- ໜ້າຕ່າງເລືອກສີແບບກຳນົດເອງ (gradient picker, ໃຊ້ຮ່ວມກັນທຸກຄຳສັ່ງປ່ຽນສີ) ---- */
function hexToRgb(hex){
  hex = (hex||'').replace('#','').trim();
  if(hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex, 16);
  if(isNaN(num) || hex.length !== 6) return {r:0,g:0,b:0};
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h = 60*(((g-b)/d)%6);
    else if(max===g) h = 60*((b-r)/d+2);
    else h = 60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0 ? 0 : d/max;
  const v = max;
  return { h, s:s*100, v:v*100 };
}
function hsvToRgb(h,s,v){
  s/=100; v/=100;
  const c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c;
  let r,g,b;
  if(h<60){ r=c; g=x; b=0; } else if(h<120){ r=x; g=c; b=0; } else if(h<180){ r=0; g=c; b=x; }
  else if(h<240){ r=0; g=x; b=c; } else if(h<300){ r=x; g=0; b=c; } else { r=c; g=0; b=x; }
  return { r:(r+m)*255, g:(g+m)*255, b:(b+m)*255 };
}

let colorPickerState = null; /* {h,s,v} of the color currently being picked */

function openColorPickerModal(storageKey, title, defaultColor){
  const root = document.getElementById('settings-root');
  const current = localStorage.getItem(storageKey) || defaultColor;
  const rgb = hexToRgb(current);
  colorPickerState = rgbToHsv(rgb.r, rgb.g, rgb.b);
  root.innerHTML = `
    <div class="overlay" id="colorpick-overlay">
      <div class="modal" id="colorpick-modal">
        <div class="modal-head">
          <h2>ເລືອກສີ</h2>
          <button class="icon-x" id="colorpick-close">${ICONS.x}</button>
        </div>
        <div class="report-card" style="margin-top:4px;">
          <p style="font-weight:600; font-size:14px; margin:0 0 10px;">${title}</p>
          <canvas id="colorpick-sv" width="280" height="170" class="colorpick-sv"></canvas>
          <canvas id="colorpick-hue" width="280" height="22" class="colorpick-hue"></canvas>
          <div class="colorpick-result-row">
            <div class="colorpick-swatch" id="colorpick-swatch"></div>
            <div style="flex:1; min-width:0;">
              <p class="muted" style="margin:0 0 4px;">ສີທີ່ເລືອກໄວ້</p>
              <input type="text" id="colorpick-hex-input" class="colorpick-hex-input" maxlength="7" value="${current.toUpperCase()}">
            </div>
          </div>
          <div style="display:flex; gap:8px; margin-top:16px;">
            <button type="button" class="img-btn" id="colorpick-reset-btn" style="flex:1; color:var(--danger);">ໃຊ້ຄ່າເລີ່ມຕົ້ນ</button>
            <button type="button" class="img-btn" id="colorpick-cancel-btn" style="flex:1;">ຍົກເລີກ</button>
            <button type="button" class="submit-btn" id="colorpick-save-btn" style="flex:1; margin-top:0;">ຕົກລົງ</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const svCanvas = document.getElementById('colorpick-sv');
  const hueCanvas = document.getElementById('colorpick-hue');
  const svCtx = svCanvas.getContext('2d');
  const hueCtx = hueCanvas.getContext('2d');
  const hexInput = document.getElementById('colorpick-hex-input');
  const swatchEl = document.getElementById('colorpick-swatch');

  function drawHueBar(){
    const w = hueCanvas.width, h = hueCanvas.height;
    const grad = hueCtx.createLinearGradient(0,0,w,0);
    for(let i=0;i<=360;i+=30) grad.addColorStop(i/360, `hsl(${i},100%,50%)`);
    hueCtx.fillStyle = grad;
    hueCtx.fillRect(0,0,w,h);
    const x = colorPickerState.h/360*w;
    hueCtx.save();
    hueCtx.strokeStyle = '#fff'; hueCtx.lineWidth = 3;
    hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,h); hueCtx.stroke();
    hueCtx.strokeStyle = 'rgba(0,0,0,.35)'; hueCtx.lineWidth = 1;
    hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,h); hueCtx.stroke();
    hueCtx.restore();
  }
  function drawSvSquare(){
    const w = svCanvas.width, h = svCanvas.height;
    svCtx.fillStyle = `hsl(${colorPickerState.h},100%,50%)`;
    svCtx.fillRect(0,0,w,h);
    const whiteGrad = svCtx.createLinearGradient(0,0,w,0);
    whiteGrad.addColorStop(0,'#fff'); whiteGrad.addColorStop(1,'rgba(255,255,255,0)');
    svCtx.fillStyle = whiteGrad; svCtx.fillRect(0,0,w,h);
    const blackGrad = svCtx.createLinearGradient(0,0,0,h);
    blackGrad.addColorStop(0,'rgba(0,0,0,0)'); blackGrad.addColorStop(1,'#000');
    svCtx.fillStyle = blackGrad; svCtx.fillRect(0,0,w,h);
    const cx = colorPickerState.s/100*w, cy = (1-colorPickerState.v/100)*h;
    svCtx.save();
    svCtx.beginPath(); svCtx.arc(cx,cy,7,0,Math.PI*2);
    svCtx.strokeStyle = '#fff'; svCtx.lineWidth = 2.5; svCtx.stroke();
    svCtx.beginPath(); svCtx.arc(cx,cy,7,0,Math.PI*2);
    svCtx.strokeStyle = 'rgba(0,0,0,.4)'; svCtx.lineWidth = 1; svCtx.stroke();
    svCtx.restore();
  }
  function currentHex(){
    const rgb = hsvToRgb(colorPickerState.h, colorPickerState.s, colorPickerState.v);
    return rgbToHex(rgb.r, rgb.g, rgb.b);
  }
  function updatePreview(){
    const hex = currentHex();
    swatchEl.style.background = hex;
    hexInput.value = hex;
  }
  function redrawAll(){ drawSvSquare(); drawHueBar(); updatePreview(); }

  function pointFromEvent(canvas, e){
    const rect = canvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
    const y = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
    return { x: x/rect.width, y: y/rect.height };
  }
  function bindDrag(canvas, onMove){
    let dragging = false;
    const handle = (e)=>{ onMove(pointFromEvent(canvas, e)); redrawAll(); };
    canvas.addEventListener('pointerdown', e=>{ dragging = true; canvas.setPointerCapture(e.pointerId); handle(e); });
    canvas.addEventListener('pointermove', e=>{ if(dragging) handle(e); });
    canvas.addEventListener('pointerup', ()=>{ dragging = false; });
    canvas.addEventListener('pointercancel', ()=>{ dragging = false; });
  }
  bindDrag(svCanvas, pt=>{ colorPickerState.s = pt.x*100; colorPickerState.v = (1-pt.y)*100; });
  bindDrag(hueCanvas, pt=>{ colorPickerState.h = pt.x*360; });

  hexInput.addEventListener('input', ()=>{
    const v = hexInput.value.trim();
    if(/^#?[0-9a-fA-F]{6}$/.test(v)){
      const rgb = hexToRgb(v);
      colorPickerState = rgbToHsv(rgb.r, rgb.g, rgb.b);
      drawSvSquare(); drawHueBar();
      swatchEl.style.background = currentHex();
    }
  });

  redrawAll();

  document.getElementById('colorpick-overlay').addEventListener('click', e=>{ if(e.target.id==='colorpick-overlay') closeColorPickerModal(); });
  document.getElementById('colorpick-close').addEventListener('click', closeColorPickerModal);
  document.getElementById('colorpick-cancel-btn').addEventListener('click', closeColorPickerModal);
  document.getElementById('colorpick-reset-btn').addEventListener('click', ()=>{
    localStorage.removeItem(storageKey);
    applyCustomColors();
    closeColorPickerModal();
    scheduleAutoSync();
  });
  document.getElementById('colorpick-save-btn').addEventListener('click', ()=>{
    localStorage.setItem(storageKey, currentHex());
    applyCustomColors();
    closeColorPickerModal();
    scheduleAutoSync();
  });
}
function closeColorPickerModal(){ document.getElementById('settings-root').innerHTML=''; colorPickerState = null; }

/* ---------- GOOGLE DRIVE SYNC ---------- */
const GDRIVE_CLIENT_ID_KEY = 'khang-sinkha-gdrive-client-id';
const GDRIVE_FILE_ID_KEY = 'khang-sinkha-gdrive-file-id';
const GDRIVE_CONNECTED_KEY = 'khang-sinkha-gdrive-connected';
const GDRIVE_LAST_SYNC_KEY = 'khang-sinkha-gdrive-last-sync';
const DRIVE_FILE_NAME = 'khang-sinkha-backup.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const SHEET_ID_KEY = 'khang-sinkha-sheet-id';
const SHEET_LAST_SYNC_KEY = 'khang-sinkha-sheet-last-sync';
const SHEET_TITLE = 'khang-sinkha-barcode-log';

let tokenClient = null;
let gdriveToken = null;
let syncDebounceTimer = null;

function getClientId(){ return localStorage.getItem(GDRIVE_CLIENT_ID_KEY) || ''; }

function loadGsiScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('gsi load failed'));
    document.head.appendChild(s);
  });
}

function connectDrive(promptMode){
  const clientId = getClientId();
  if(!clientId){ showToast('ກະລຸນາໃສ່ Google Client ID ກ່ອນ'); return Promise.resolve(false); }
  return loadGsiScript().then(()=> new Promise((resolve)=>{
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if(resp && resp.access_token){
            gdriveToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in*1000 - 60000) };
            localStorage.setItem(GDRIVE_CONNECTED_KEY, '1');
            resolve(true);
          } else resolve(false);
        },
        error_callback: () => resolve(false)
      });
      tokenClient.requestAccessToken({ prompt: promptMode === undefined ? '' : promptMode });
    }catch(e){ resolve(false); }
  })).catch(()=>{ showToast('ໂຫຼດ Google SDK ບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດ'); return false; });
}

function isDriveConnected(){ return !!(gdriveToken && gdriveToken.expires_at > Date.now()); }

async function ensureToken(){
  if(isDriveConnected()) return true;
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return false;
  return await connectDrive('none');
}

async function driveRequest(url, options){
  const ok = await ensureToken();
  if(!ok) throw new Error('no-auth');
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + gdriveToken.access_token });
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text(); throw new Error('drive-error: '+res.status+' '+t); }
  return res;
}

async function findDriveFileId(){
  // Always re-query Drive by name instead of trusting a locally-cached id forever.
  // Reason: if more than one device ever created its own backup file with the same
  // name (e.g. an old bug, or two devices both connecting before any backup existed),
  // each device could get permanently pinned to a DIFFERENT file id, so pushes from
  // one device would silently never reach the file the other device reads from.
  // Always picking the most-recently-modified matching file lets every device
  // self-heal onto the same, current file the next time it syncs.
  try{
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc`);
    const data = await res.json();
    if(data.files && data.files.length){
      const fileId = data.files[0].id;
      localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
      return fileId;
    }
    localStorage.removeItem(GDRIVE_FILE_ID_KEY);
    return null;
  } catch(e){
    // Network hiccup etc: fall back to whatever id we cached before, rather than
    // failing the whole sync outright.
    return localStorage.getItem(GDRIVE_FILE_ID_KEY) || null;
  }
}

async function fetchDriveDiagnostics(){
  // Shows exactly which Google account this device is connected as, and every
  // Drive file matching our backup filename with its last-modified time — the
  // fastest way to see (from the UI itself, no dev tools needed) whether two
  // devices are actually pointed at the same Google account / same file, which
  // is the #1 cause of "sync says success but the other device never sees it".
  try{
    const ok = await ensureToken();
    if(!ok) return null;
    const aboutRes = await driveRequest('https://www.googleapis.com/drive/v3/about?fields=user(displayName,emailAddress)');
    const about = await aboutRes.json();
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const listRes = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc`);
    const listData = await listRes.json();
    return {
      email: about.user ? about.user.emailAddress : null,
      files: (listData.files || []).map(f => ({ id:f.id, modifiedTime:f.modifiedTime }))
    };
  } catch(e){ return null; }
}

async function findOrCreateSheet(){
  let sheetId = localStorage.getItem(SHEET_ID_KEY);
  if(sheetId) return sheetId;
  const q = encodeURIComponent(`name='${SHEET_TITLE}' and trashed=false and mimeType='application/vnd.google-apps.spreadsheet'`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length){
    sheetId = data.files[0].id;
    localStorage.setItem(SHEET_ID_KEY, sheetId);
    return sheetId;
  }
  const createRes = await driveRequest('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ properties:{ title: SHEET_TITLE }, sheets:[{ properties:{ title:'Log' } }] })
  });
  const createData = await createRes.json();
  sheetId = createData.spreadsheetId;
  localStorage.setItem(SHEET_ID_KEY, sheetId);
  await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A1:B1?valueInputOption=RAW`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ values:[['ລະຫັດ Barcode','ວັນທີ-ເວລາ ຮັບເຂົ້າ']] })
  });
  return sheetId;
}

async function syncScanLogToSheet(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){
      ok = await connectDrive('');
    }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google'); return; }
    const sheetId = await findOrCreateSheet();
    const unsynced = scanLog.filter(r=>!r.syncedToSheet);
    if(unsynced.length === 0){ if(!silent) showToast('ບໍ່ມີລາຍການໃໝ່ໃຫ້ sync'); return; }
    const rows = unsynced.map(r => [r.code, new Date(r.scannedAt).toLocaleString('lo-LA')]);
    await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A:B:append?valueInputOption=RAW`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ values: rows })
    });
    const unsyncedIds = new Set(unsynced.map(r=>r.id));
    scanLog = scanLog.map(r => unsyncedIds.has(r.id) ? { ...r, syncedToSheet:true } : r);
    saveScanLog();
    localStorage.setItem(SHEET_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('ສົ່ງອອກ Log ໄປ Google Sheet ສຳເລັດ (' + unsynced.length + ' ລາຍການ)');
    if(tab === 'barcode') renderBarcodeTab();
  }catch(e){
    if(!silent) showToast('ສົ່ງອອກບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncToDrive(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){ ok = await connectDrive(''); }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive, ກະລຸນາລອງໃໝ່'); return; }
    let fileId = await findDriveFileId();
    const payload = JSON.stringify({ app:'khang-sinkha', version:2, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog, quotes:savedQuotes });
    if(!fileId){
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = '-------khangsinkha' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      const data = await res.json();
      fileId = data.id;
      localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    } else {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method:'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
    }
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('Sync ຂຶ້ນ Google Drive ສຳເລັດ');
    if(document.getElementById('backup-overlay')) renderBackupModal();
  } catch(e){
    if(!silent) showToast('Sync ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncFromDrive(){
  try{

    if(!ok){ ok = await connectDrive(''); }

function scheduleAutoSync(){

    clearTimeout(syncDebounceTimer);

    firebaseSyncDebounceTimer = setTimeout(()=>{ pushToFirebase(); }, 700);
  }

/* ---------- REAL-TIME SYNC (Firebase Firestore, optional) ----------
   Google Drive above is manual/backup-style (push then pull on demand).
   This section is a SEPARATE, OPTIONAL live layer: once a Firebase project's
   config is pasted in on every device, all devices see each other's changes
   within about a second, no button presses needed. Requires the shop owner
   to create their own free Firebase project (see the "ຕັ້ງຄ່າ Realtime Sync"
   card in the backup modal for the paste-in UI) — this app never ships with
   a shared Firebase project of its own. */
const FIREBASE_CONFIG_KEY = 'khang-sinkha-firebase-config';
const FIREBASE_ENABLED_KEY = 'khang-sinkha-firebase-enabled';
const FIREBASE_COLLECTION = 'khang-sinkha-shops';
const FIREBASE_DOC_ID = 'main';
let firebaseApp = null;
let firestoreDb = null;
let firebaseUnsub = null;
let firebaseListenerStarting = false;
let firebaseSyncDebounceTimer = null;

function getFirebaseConfig(){
  try{ return JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY) || 'null'); }catch(e){ return null; }
}

// People usually copy the raw snippet straight off the Firebase console
// ("const firebaseConfig = { apiKey: '...', ... };"), which is valid JS but NOT
// valid JSON (unquoted keys, single quotes, a trailing `;`, sometimes a leading
// `const ... =`). Strict JSON.parse rejects that and shows a confusing error, so
// try it as-is first, then fall back to tolerantly reshaping it into real JSON.
function parseFirebaseConfigText(raw){
  const text = (raw || '').trim();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){}
  try{
    let t = text
      .replace(/^(?:export\s+)?(?:const|let|var)\s+\w+\s*=\s*/, '') // leading "const firebaseConfig ="
      .replace(/;\s*$/, '')                                          // trailing semicolon
      .replace(/\/\/[^\n]*/g, '')                                    // // comments
      .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')        // unquoted keys -> quoted
      .replace(/'((?:[^'\\]|\\.)*)'/g, (m, inner) => '"' + inner.replace(/"/g, '\\"') + '"') // single -> double quotes
      .replace(/,(\s*[}\]])/g, '$1');                                // trailing commas
    return JSON.parse(t);
  }catch(e){ return null; }
}

function isFirebaseEnabled(){ return !!localStorage.getItem(FIREBASE_ENABLED_KEY); }

function loadExternalScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load-failed'));
    document.head.appendChild(s);
  });
}

async function ensureFirebaseLibs(){
  if(window.firebase && window.firebase.firestore) return true;
  try{
    await loadExternalScriptOnce('https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js');
    await loadExternalScriptOnce('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js');
    return !!(window.firebase && window.firebase.firestore);
  }catch(e){ return false; }
}

function firebaseDocRef(){
  return firestoreDb.collection(FIREBASE_COLLECTION).doc(FIREBASE_DOC_ID);
}

async function initFirebaseIfEnabled(){
  if(!isFirebaseEnabled()) return false;
  const config = getFirebaseConfig();
  if(!config) return false;
  const ok = await ensureFirebaseLibs();
  if(!ok) return false;
  try{
    if(!firebaseApp){
      firebaseApp = (firebase.apps && firebase.apps.length) ? firebase.app() : firebase.initializeApp(config);
      firestoreDb = firebase.firestore();
    }
    startFirebaseListener();
    return true;
  } catch(e){ return false; }
}

function startFirebaseListener(){
  if(firebaseUnsub || firebaseListenerStarting || !firestoreDb) return;
  firebaseListenerStarting = true;
  try{
    firebaseUnsub = firebaseDocRef().onSnapshot(
      snap => {
        firebaseListenerStarting = false;
        if(!snap.exists) return;
        // A write we just made ourselves echoes back through this same listener;
        // hasPendingWrites is true for that local echo (still unconfirmed by the
        // server), so skipping it here is what stops an infinite push/apply loop.
        if(snap.metadata.hasPendingWrites) return;
        applyRemoteFirebaseData(snap.data());
      },
      () => { firebaseListenerStarting = false; /* offline/permission error: stay silent, will retry via reconnect */ }
    );
  } catch(e){ firebaseListenerStarting = false; }
}

function stopFirebaseListener(){
  if(firebaseUnsub){ firebaseUnsub(); firebaseUnsub = null; }
}

function applyRemoteFirebaseData(data){
  if(!data) return;
  if(Array.isArray(data.products)){
    // Realtime Sync payloads never carry product photos (see buildFirebasePayload),
    // so merge incoming products onto whatever photo THIS device already has for
    // that product id, instead of wiping it out.
    const localImageById = {};
    products.forEach(p => { if(p && p.image) localImageById[p.id] = p.image; });
    products = data.products.map(p => ({ ...p, image: p.image || localImageById[p.id] || null }));
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }catch(e){}
  }
  if(Array.isArray(data.categories)){ CATEGORIES = data.categories; try{ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }catch(e){} }
  if(Array.isArray(data.customerOrders)){ customerOrders = data.customerOrders; try{ localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }catch(e){} }
  if(Array.isArray(data.purchaseOrders)){ purchaseOrders = data.purchaseOrders; try{ localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }catch(e){} }
  if(Array.isArray(data.scanLog)){ scanLog = data.scanLog; try{ localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }catch(e){} }
  if(data.logo){ logoImg = data.logo; try{ localStorage.setItem(LOGO_KEY, logoImg); }catch(e){} }
  if(data.cover){ coverImg = data.cover; try{ localStorage.setItem(COVER_KEY, coverImg); }catch(e){} }
  renderAll();
  showRealtimeSyncPulse();
}

function showRealtimeSyncPulse(){
  // A tiny, unobtrusive flash so the person knows something updated live from
  // another device, without a disruptive toast every single time.
  let el = document.getElementById('realtime-sync-pulse');
  if(!el){
    el = document.createElement('div');
    el.id = 'realtime-sync-pulse';
    el.style.cssText = 'position:fixed; top:calc(env(safe-area-inset-top) + 6px); left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; font-size:11px; font-weight:600; padding:5px 12px; border-radius:999px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; display:flex; align-items:center; gap:6px;';
    el.innerHTML = `<span style="width:6px; height:6px; border-radius:50%; background:#4ADE80; display:inline-block;"></span> ອັບເດດຂໍ້ມູນໃໝ່`;
    document.body.appendChild(el);
  }
  el.style.opacity = '1';
  clearTimeout(showRealtimeSyncPulse._t);
  showRealtimeSyncPulse._t = setTimeout(()=>{ el.style.opacity = '0'; }, 1800);
}

function buildFirebasePayload(){
  // Firestore caps a single document at ~1 MiB. Product photos (base64 images)
  // are exactly the kind of data that blows past that on a real shop's catalog,
  // so Realtime Sync deliberately leaves photos and store branding (logo/cover)
  // out of the live payload — those still travel via Google Drive backup/restore
  // (or an app update) since they change rarely. Everything that actually needs
  // to be instant (stock counts, orders, categories, scan log) has no images.
  const lightProducts = products.map(p => {
    const { image, ...rest } = p;
    return rest;
  });
  return {
    products: lightProducts, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
}

async function pushToFirebase(){
  try{
    const ok = await initFirebaseIfEnabled();
    if(!ok || !firestoreDb) return { ok:false, reason:'not-configured' };
    const payload = buildFirebasePayload();
    const approxBytes = JSON.stringify(payload).length;
    if(approxBytes > 900000){
      return { ok:false, reason:'too-large' };
    }
    await firebaseDocRef().set(payload, { merge:false });
    return { ok:true };
  } catch(e){
    // offline or misconfigured (e.g. Firestore Database not created yet, or
    // security rules deny writes) — surface WHY so enableFirebaseSync can show
    // a real error instead of a false "success" message.
    return { ok:false, reason: (e && e.code) || 'unknown', message: e && e.message };
  }
}

async function pullFirebaseNow(){
  const ok = await initFirebaseIfEnabled();
  if(!ok || !firestoreDb) { showToast('ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ Realtime Sync'); return; }
  try{
    const snap = await firebaseDocRef().get();
    if(snap.exists){ applyRemoteFirebaseData(snap.data()); showToast('ດຶງຂໍ້ມູນຫຼ້າສຸດແລ້ວ'); }
    else{ showToast('ຍັງບໍ່ມີຂໍ້ມູນຢູ່ Realtime Sync — ອຸປະກອນນີ້ອາດຍັງບໍ່ໄດ້ sync ຂຶ້ນສຳເລັດ, ລອງປິດ-ເປີດ Realtime Sync ຄືນເບິ່ງ'); }
  }catch(e){
    if(e && e.code === 'permission-denied') showToast('ບໍ່ມີສິດອ່ານຂໍ້ມູນ — ກວດ Firestore rules/ໂໝດ test mode');
    else showToast('ດຶງຂໍ້ມູນບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດ/ຄ່າຕັ້ງ');
  }
}

async function enableFirebaseSync(configText){
  const config = parseFirebaseConfigText(configText);
  if(!config){ showToast('ອ່ານ Firebase config ບໍ່ອອກ, ລອງກ໊ອບປີ້ໂຄດ firebaseConfig ຈາກ Firebase console ວາງໃສ່ໃໝ່ອີກຄັ້ງ'); return false; }
  if(!config.apiKey || !config.projectId){ showToast('Firebase config ຂາດຂໍ້ມູນສຳຄັນ (apiKey/projectId)'); return false; }
  localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(config));
  localStorage.setItem(FIREBASE_ENABLED_KEY, '1'); // tentative — rolled back below if the write check fails
  firebaseApp = null; firestoreDb = null;
  stopFirebaseListener();
  const connected = await initFirebaseIfEnabled();
  if(!connected){
    localStorage.removeItem(FIREBASE_ENABLED_KEY);
    showToast('ເຊື່ອມຕໍ່ Firebase ບໍ່ສຳເລັດ, ກວດ config ອີກຄັ້ງ (ຫຼືອິນເຕີເນັດ)');
    return false;
  }
  // Actually verify a write succeeds before calling this "enabled" — this is the
  // check that was missing before: without it, the UI could show "connected"
  // (green dot) even when Firestore rejected every write (e.g. the Firestore
  // Database was never created in the console, or rules deny access), and the
  // person would sit there forever with two devices that both LOOK connected
  // but neither ever actually reaches the other.
  const result = await pushToFirebase();
  if(!result.ok){
    localStorage.removeItem(FIREBASE_ENABLED_KEY);
    stopFirebaseListener();
    firebaseApp = null; firestoreDb = null;
    if(result.reason === 'permission-denied'){
      showToast('ບໍ່ມີສິດຂຽນຂໍ້ມູນ — ກວດວ່າໄດ້ສ້າງ Firestore Database ໃນ Firebase Console ແລ້ວ ແລະ ຢູ່ໂໝດ test mode');
    } else if(result.reason === 'not-configured'){
      showToast('ໂຫຼດ Firebase SDK ບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດແລ້ວລອງໃໝ່');
    } else if(result.reason === 'too-large' || result.reason === 'invalid-argument'){
      showToast('ຂໍ້ມູນສິນຄ້າຫຼາຍ/ໃຫຍ່ເກີນຂີດຈຳກັດຂອງ Firestore (1MB ຕໍ່ເອກະສານ), ຂ້ອຍໄດ້ຕັດຮູບພາບອອກຈາກ Realtime Sync ແລ້ວແຕ່ຍັງໃຫຍ່ເກີນໄປ, ຕິດຕໍ່ຂ້ອຍໃຫ້ຊ່ວຍປັບໂຄງສ້າງເພີ່ມ');
    } else {
      showToast('Sync ຂຶ້ນ Firebase ບໍ່ສຳເລັດ (' + esc(result.reason || result.message || '') + ')');
    }
    return false;
  }
  showToast('ເປີດໃຊ້ Realtime Sync ສຳເລັດ');
  return true;
}

function disableFirebaseSync(){
  stopFirebaseListener();
  firebaseApp = null; firestoreDb = null;
  localStorage.removeItem(FIREBASE_ENABLED_KEY);
  showToast('ປິດ Realtime Sync ແລ້ວ');
}

if(isFirebaseEnabled()){ initFirebaseIfEnabled(); }

function exportData(){
  const payload = { app:'khang-sinkha', version:2, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog, quotes:savedQuotes };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'khang-sinkha-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
  renderBackupModal();
  showToast('ດາວໂຫຼດໄຟລ໌ສຳຮອງແລ້ວ');
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : parsed.products;
      if(!Array.isArray(list)) throw new Error('bad format');
      const valid = list.every(p => p && typeof p.name === 'string');
      if(!valid) throw new Error('bad format');
      pendingImportData = {
        products:list,
        logo: Array.isArray(parsed) ? null : (parsed.logo || null),
        cover: Array.isArray(parsed) ? null : (parsed.cover || null),
        categories: Array.isArray(parsed) ? null : (Array.isArray(parsed.categories) ? parsed.categories : null),
        customerOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.customerOrders) ? parsed.customerOrders : null),
        purchaseOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.purchaseOrders) ? parsed.purchaseOrders : null),
        scanLog: Array.isArray(parsed) ? null : (Array.isArray(parsed.scanLog) ? parsed.scanLog : null),
        quotes: Array.isArray(parsed) ? null : (Array.isArray(parsed.quotes) ? parsed.quotes : null)
      };
      renderImportConfirm();
    }catch(err){
      showToast('ໄຟລ໌ບໍ່ຖືກຕ້ອງ, ບໍ່ສາມາດນຳເຂົ້າໄດ້');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function renderImportConfirm(){
  const root = document.getElementById('confirm-root');
  const brandNote = (pendingImportData.logo || pendingImportData.cover) ? ' ພ້ອມທັງ Logo/Cover' : '';
  const extraParts = [];
  if(Array.isArray(pendingImportData.categories)) extraParts.push('ໝວດໝູ່');
  if(Array.isArray(pendingImportData.customerOrders)) extraParts.push('ບິນສັ່ງຊື້ລູກຄ້າ ' + pendingImportData.customerOrders.length + ' ລາຍການ');
  if(Array.isArray(pendingImportData.purchaseOrders)) extraParts.push('ລາຍການຈັດຊື້ ' + pendingImportData.purchaseOrders.length + ' ລາຍການ');
  if(Array.isArray(pendingImportData.scanLog)) extraParts.push('ປະຫວັດສະແກນ ' + pendingImportData.scanLog.length + ' ລາຍການ');
  if(Array.isArray(pendingImportData.quotes)) extraParts.push('ໃບສະເໜີລາຄາ/ໃບຮັບເງິນ ' + pendingImportData.quotes.length + ' ລາຍການ');
  const extraNote = extraParts.length ? (', ' + extraParts.join(', ')) : '';
  root.innerHTML = `
    <div class="overlay center" id="import-overlay">
      <div class="confirm-box">
        <p class="title">ນຳເຂົ້າຂໍ້ມູນ?</p>
        <p class="desc">ພົບ ${pendingImportData.products.length} ລາຍການສິນຄ້າໃນໄຟລ໌ສຳຮອງ${brandNote}${extraNote}. ການນຳເຂົ້າຈະທັບຂໍ້ມູນປັດຈຸບັນທັງໝົດ ແລະ ບໍ່ສາມາດກູ້ຄືນໄດ້.</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="import-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="import-ok-btn">ນຳເຂົ້າ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('import-overlay').addEventListener('click', e=>{ if(e.target.id==='import-overlay'){ pendingImportData=null; root.innerHTML=''; }});
  document.getElementById('import-cancel-btn').addEventListener('click', ()=>{ pendingImportData=null; root.innerHTML=''; });
  document.getElementById('import-ok-btn').addEventListener('click', ()=>{
    products = pendingImportData.products.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ບໍລິການອື່ນ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ບໍລິການອື່ນ', qty:0 }]
    }));
    if(pendingImportData.logo){ logoImg = pendingImportData.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(pendingImportData.cover){ coverImg = pendingImportData.cover; localStorage.setItem(COVER_KEY, coverImg); }
    if(Array.isArray(pendingImportData.categories)){ CATEGORIES = pendingImportData.categories; localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }
    if(Array.isArray(pendingImportData.customerOrders)){ customerOrders = pendingImportData.customerOrders; localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }
    if(Array.isArray(pendingImportData.purchaseOrders)){ purchaseOrders = pendingImportData.purchaseOrders; localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }
    if(Array.isArray(pendingImportData.scanLog)){ scanLog = pendingImportData.scanLog; localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }
    if(Array.isArray(pendingImportData.quotes)){ savedQuotes = pendingImportData.quotes; persistSavedQuotes(); }
    save();
    pendingImportData = null;
    root.innerHTML = '';
    closeBackupModal();
    renderAll();
    showToast('ນຳເຂົ້າຂໍ້ມູນສຳເລັດ');
  });
}

function copyProductCode(id){
  const p = products.find(x => x.id === id);
  if(!p || !p.code) return;
  const code = p.code;
  const done = ()=> showToast('ກ໋ອບປີ້ລະຫັດ ' + code + ' ແລ້ວ');
  const fail = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('ກ໋ອບປີ້ບໍ່ສຳເລັດ'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(fail);
  } else {
    fail();
  }
}

document.addEventListener('click', e=>{

  if(!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  if(action === 'toggle-expand'){
    expanded[id] = !expanded[id];
    delete detailDeleteUnlocked[id]; /* ລ໋ອກປຸ່ມ "ລຶບ" ຄືນທຸກຄັ້ງທີ່ເປີດ/ປິດແຖວນີ້ */
    if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
    else { renderListItems(); }
  } else if(action === 'toggle-product-lock'){
    e.stopPropagation();
    handleDetailLockTap(id);
    if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
    else { renderListItems(); }
  } else if(action === 'open-category'){
    openCategoryDetail(t.dataset.cat);
  } else if(action === 'open-detail'){
    openDetail(id);
  } else if(action === 'duplicate-product'){
    openDuplicate(id);
  } else if(action === 'copy-code'){
    e.stopPropagation();
    copyProductCode(id);
  } else if(action === 'open-cart'){
    e.stopPropagation();
    if(revealedCartId !== id){
      /* ຄັ້ງທຳອິດ: ພຽງແຕ່ກາງປຸ່ມກະຕ່າອອກມາ, ຍັງບໍ່ເປີດ popup */
      revealedCartId = id;
      if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
      else { renderListItems(); }
    } else {
      openCartModal(id);
    }
  } else if(action === 'open-addcart'){
    e.stopPropagation();
    if(revealedCartId === id) openAddCartModal(id);
  } else if(action === 'edit-order'){
    openEditOrderModal(id);
  } else if(action === 'accept-order'){
    acceptOrder(id);
  } else if(action === 'delete-order'){
    confirmDeleteOrder(id);
  } else if(action === 'share-order'){
    e.stopPropagation();
    openOrderSharePreview(id);
  } else if(action === 'open-sell'){
    openSellModal(id);
  } else if(action === 'open-buy'){
    openBuyModal(id);
  } else if(action === 'open-edit'){
    openEdit(id);
  } else if(action === 'confirm-delete'){
    if(!isDetailDeleteUnlocked(id)){
      showToast('ລ໋ອກຢູ່ — ແຕະຮູບໜ່ວຍກຸນແຈ 2 ຄັ້ງຕິດກັນເພື່ອປົດລ໋ອກກ່ອນລຶບ');
    } else {
      confirmDelete(id);
    }
  } else if(action === 'adjust-variant'){
    const vid = t.dataset.vid;
    const delta = parseInt(t.dataset.delta, 10);
    products = products.map(p => p.id===id ? { ...p, variants: p.variants.map(v => v.id===vid ? {...v, qty: Math.max(0, v.qty+delta)} : v) } : p);
    save();
    renderAll();
    if(detailId === id) renderDetailSheet();
  } else if(action === 'messenger-placeholder'){
    e.stopPropagation();
    t.classList.add('tapped');
    t.addEventListener('animationend', ()=> t.classList.remove('tapped'), { once:true });
    openShareImagePreview(id);
  } else if(action === 'delete-scan'){
    const scanId = t.dataset.scanId;
    scanLog = scanLog.filter(r=>r.id!==scanId);
    saveScanLog();
    renderBarcodeList();
  }
});

function openDailyTotalModal(){
  const root = document.getElementById('daily-total-root');
  if(!root) return;
  const total = getTodayTotalSales();
  const targetDate = ordersFilterDate || localDateStr();
  const isToday = targetDate === localDateStr();
  const dateObj = new Date(targetDate + 'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('lo-LA', { day:'2-digit', month:'2-digit', year:'numeric' });
  const caption = isToday ? 'ຍອດຂາຍລວມມື້ນີ້' : `ຍອດຂາຍລວມວັນທີ ${dateLabel}`;
  const sparkCount = 12;
  const radius = 118;
  const sparks = Array.from({length:sparkCount}).map((_,i) => {
    const angle = (360 / sparkCount) * i;
    const size = 14 + (i % 3) * 6;
    const delay = (i * 0.12).toFixed(2);
    return `<div class="daily-total-spark-wrap" style="transform:rotate(${angle}deg) translate(${radius}px) rotate(${-angle}deg);"><span class="daily-total-spark" style="font-size:${size}px; animation-delay:${delay}s;">✦</span></div>`;
  }).join('');
  root.innerHTML = `
    <div class="daily-total-overlay" id="daily-total-overlay">
      <div class="daily-total-burst">
        <div class="daily-total-ring">${sparks}</div>
        <div class="daily-total-text">
          <span class="caption">${caption}</span>
          <span class="amount">${total.toLocaleString()}</span>
          <span class="unit">ກີບ</span>
        </div>

  `;

async function autoPullOnLoad(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY) || location.protocol === 'file:') return;
    const ok = await ensureToken();
    if(!ok) return;
    const fileId = await findDriveFileId();
    if(!fileId) return;
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const remoteTime = parsed.exportedAt ? new Date(parsed.exportedAt).getTime() : 0;
    const lastSyncStr = localStorage.getItem(GDRIVE_LAST_SYNC_KEY);
    const localSyncTime = lastSyncStr ? new Date(lastSyncStr).getTime() : 0;
    if(!remoteTime || remoteTime <= localSyncTime) return;

    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) return;

    products = list.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ບໍລິການອື່ນ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ບໍລິການອື່ນ', qty:0 }]
    }));
    if(parsed.logo){ logoImg = parsed.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(parsed.cover){ coverImg = parsed.cover; localStorage.setItem(COVER_KEY, coverImg); }
    if(Array.isArray(parsed.categories)){ CATEGORIES = parsed.categories; localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }
    if(Array.isArray(parsed.customerOrders)){ customerOrders = parsed.customerOrders; localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }
    if(Array.isArray(parsed.purchaseOrders)){ purchaseOrders = parsed.purchaseOrders; localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }
    if(Array.isArray(parsed.scanLog)){ scanLog = parsed.scanLog; localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, parsed.exportedAt);
    renderAll();
    showToast('ດຶງຂໍ້ມູນລ່າສຸດຈາກ Drive ອັດຕະໂນມັດແລ້ວ');
  }catch(e){ /* best-effort background refresh, ignore failures */ }
}

/* ---------- UNIVERSAL CLEAR (×) BUTTON FOR TEXT/NUMBER INPUT FIELDS ---------- */
/* ອັດຕະໂນມັດເພີ່ມປຸ່ມ × (ວົງມົນສີແດງ) ໃສ່ຊ່ອງພິມທີ່ແກ້ໄຂໄດ້ທົ່ວແອັບ ເພື່ອລຶບຂໍ້ມູນທັງໝົດໃນຊ່ອງນັ້ນທັນທີ */
/* ຍົກເວັ້ນ: ຊ່ອງຈຳນວນແບບ stepper (ຄັບແຄບ, ພິມສັ້ນ), ຊ່ອງວັນທີ, ຊ່ອງໄຟລ໌, ແລະ ຊ່ອງທີ່ຈັດການເອງແລ້ວ (search-input) */
const CLEARABLE_INPUT_TYPES = ['text', 'tel', 'number', 'email', 'search', ''];
const NO_CLEAR_IDS = ['quick-scan-qty', 'po-qty', 'orders-date-input'];
function shouldSkipClearableInput(inp){
  if(inp.dataset.noClear) return true;
  if(NO_CLEAR_IDS.indexOf(inp.id) !== -1) return true;
  if(inp.className && inp.className.indexOf('qty-input') !== -1) return true;
  if(inp.closest('.vrow')) return true;
  const type = (inp.getAttribute('type') || 'text').toLowerCase();
  return CLEARABLE_INPUT_TYPES.indexOf(type) === -1;
}
function initClearableInputs(root){
  const scope = root || document;
  if(!scope.querySelectorAll) return;
  scope.querySelectorAll('input').forEach(inp=>{
    if(inp.dataset.clearInit) return;
    inp.dataset.clearInit = '1';
    if(shouldSkipClearableInput(inp)) return;
    const parent = inp.parentNode;
    if(!parent) return;
    const wrap = document.createElement('span');
    wrap.className = 'clear-input-wrap';
    const parentDisplay = getComputedStyle(parent).display;
    if(parentDisplay.indexOf('flex') !== -1){
      const inpFlex = getComputedStyle(inp).flex;
      wrap.style.display = 'flex';
      wrap.style.alignItems = 'center';
      wrap.style.flex = (inpFlex && inpFlex !== '0 1 auto') ? inpFlex : '1 1 auto';
      wrap.style.minWidth = '0';
    } else {
      wrap.style.display = 'block';
    }
    parent.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'clear-input-btn';
    btn.textContent = '✕';
    btn.setAttribute('aria-label', 'ລຶບຂໍ້ມູນ');
    wrap.appendChild(btn);
    const toggle = () => { btn.style.display = inp.value ? 'flex' : 'none'; };
    toggle();
    inp.addEventListener('input', toggle);
    btn.addEventListener('mousedown', e=>{ e.preventDefault(); });
    btn.addEventListener('click', ()=>{
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles:true }));
      inp.dispatchEvent(new Event('change', { bubbles:true }));
      inp.focus();
      toggle();
    });
  });
}
let clearableInputsScanQueued = false;
function queueClearableInputsScan(){
  if(clearableInputsScanQueued) return;
  clearableInputsScanQueued = true;
  requestAnimationFrame(()=>{ clearableInputsScanQueued = false; initClearableInputs(document); });
}
initClearableInputs(document);
new MutationObserver(queueClearableInputsScan).observe(document.body, { childList:true, subtree:true });
</script>
</body>
