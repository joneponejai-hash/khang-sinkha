        <div class="confirm-box" style="max-width:340px; text-align:left;">
          <p class="title" style="margin-bottom:2px;">${esc(p.name)}</p>
          <p class="desc" style="margin-bottom:16px;">${p.code?('#'+esc(p.code)+' &middot; '):''}ພົບສິນຄ້າກົງກັນ 100%, ເລືອກການດຳເນີນການ</p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" id="quick-scan-sell-btn" style="background:var(--success); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;"><span style="width:20px; height:20px;">${ICONS.sell}</span> ຂາຍອອກ</button>
            <button type="button" id="quick-scan-buy-btn" style="background:var(--accent); color:var(--dark); border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;"><span style="width:20px; height:20px;">${ICONS.buy}</span> ຊື້ເຂົ້າ</button>
          </div>
          <div class="confirm-actions" style="margin-top:16px;">
            <button class="btn-cancel" id="quick-scan-cancel-btn" style="width:100%;">ຍົກເລີກ</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('quick-scan-overlay').addEventListener('click', e=>{ if(e.target.id==='quick-scan-overlay') closeQuickScanModal(); });
    document.getElementById('quick-scan-cancel-btn').addEventListener('click', closeQuickScanModal);
    document.getElementById('quick-scan-sell-btn').addEventListener('click', ()=>{ s.action='sell'; renderQuickScanModal(); });
    document.getElementById('quick-scan-buy-btn').addEventListener('click', ()=>{ s.action='buy'; renderQuickScanModal(); });
    return;
  }

  const isSell = s.action === 'sell';
  const variant = p.variants.find(v=>v.id===s.variantId) || p.variants[0];
  const sizePickerHtml = p.variants.length > 1 ? `
    <div class="field">
      <label>ຂະໜາດ *</label>
      <select id="quick-scan-size-select">
        ${p.variants.map(v=>`<option value="${v.id}" ${v.id===variant.id?'selected':''}>${esc(v.size)} (ຄົງເຫຼືອ ${v.qty})</option>`).join('')}
      </select>
    </div>
  ` : `<p class="muted" style="margin:0 0 12px;">ຂະໜາດ: ${esc(variant ? variant.size : '-')} &middot; ຄົງເຫຼືອ: ${variant ? variant.qty : 0}</p>`;

  root.innerHTML = `
    <div class="overlay center" id="quick-scan-overlay">
      <div class="confirm-box" style="max-width:340px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">${isSell?'ຂາຍອອກ':'ຊື້ເຂົ້າ'}: ${esc(p.name)}</p>
        <p class="desc" style="margin-bottom:12px;">${p.code?('#'+esc(p.code)):''}</p>
        ${sizePickerHtml}
        <div class="field" style="margin-bottom:0;">
          <label>ຈຳນວນ *</label>
          <input id="quick-scan-qty" type="number" inputmode="numeric" min="1" value="${esc(s.qty)}" placeholder="0" autofocus>
        </div>
        <p id="quick-scan-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="quick-scan-back-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="quick-scan-confirm-btn" style="background:${isSell?'var(--success)':'var(--accent)'}; color:${isSell?'#fff':'var(--dark)'};">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('quick-scan-overlay').addEventListener('click', e=>{ if(e.target.id==='quick-scan-overlay') closeQuickScanModal(); });
  document.getElementById('quick-scan-back-btn').addEventListener('click', closeQuickScanModal);
  const sizeSelect = document.getElementById('quick-scan-size-select');
  if(sizeSelect){
    sizeSelect.addEventListener('change', e=>{ s.variantId = e.target.value; renderQuickScanModal(); });
  }
  document.getElementById('quick-scan-qty').addEventListener('input', e=>{ s.qty = e.target.value; });
  document.getElementById('quick-scan-confirm-btn').addEventListener('click', confirmQuickScanAction);
}

function confirmQuickScanAction(){
  const s = quickScanState;
  if(!s) return;
  const p = products.find(x=>x.id===s.productId);
  const errorEl = document.getElementById('quick-scan-error');
  if(!p){ closeQuickScanModal(); return; }
  const variant = p.variants.find(v=>v.id===s.variantId) || p.variants[0];
  if(!variant){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດສິນຄ້າ'; errorEl.style.display = 'block'; return; }
  const n = parseInt(s.qty, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນເປັນຕົວເລກ'; errorEl.style.display = 'block'; return; }

  if(s.action === 'sell'){
    if(variant.qty <= 0){ errorEl.textContent = 'ສິນຄ້າໝົດ'; errorEl.style.display = 'block'; return; }
    if(n > variant.qty){ errorEl.textContent = 'ເຄື່ອງມີບໍ່ພໍຂາຍ'; errorEl.style.display = 'block'; return; }
    products = products.map(pr => pr.id === p.id
      ? { ...pr, variants: pr.variants.map(v => v.id===variant.id ? { ...v, qty: Math.max(0, v.qty - n) } : v) }
      : pr
    );
    save();
    closeQuickScanModal();
    renderAll();
    if(detailId === p.id) renderDetailSheet();
    showToast(`ຂາຍອອກສຳເລັດ: ${n} (${variant.size}), ອັບເດດສະຕັອກແລ້ວ`);
  } else {
    products = products.map(pr => pr.id === p.id
      ? { ...pr, variants: pr.variants.map(v => v.id===variant.id ? { ...v, qty: v.qty + n } : v) }
      : pr
    );
    save();
    closeQuickScanModal();
    renderAll();
    if(detailId === p.id) renderDetailSheet();
    showToast(`ຊື້ເຂົ້າສຳເລັດ: ${n} (${variant.size}), ອັບເດດສະຕັອກແລ້ວ`);
  }
}

/* ---------- PURCHASE ORDER (arc-btn-4: ສັ່ງຊື້ສິນຄ້າ) ---------- */
let poState = null;

function openPurchaseOrderModal(){
  poState = { code:'', product:null, size:'', qty:'', orderNumber:'' };
  renderPurchaseOrderModal();
}
function closePurchaseOrderModal(){ poState = null; document.getElementById('po-root').innerHTML = ''; }

// Product name is stored as "Base name (color)" e.g. "ຊຸດເຊບຕີ້ (ສີກົມ)" — extract color for display.
function splitNameColor(name){
  const m = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(name || '');
  if(m) return { base: m[1].trim(), color: m[2].trim() };
  return { base: (name||'').trim(), color: '-' };
}

function poLookupCode(raw){
  const code = raw.trim();
  poState.code = raw;
  if(!code){ poState.product = null; poState.size = ''; renderPurchaseOrderModal(); return; }
  const match = products.find(p => (p.code||'').trim().toLowerCase() === code.toLowerCase() && (p.code||'').trim() !== '');
  poState.product = match || null;
  poState.size = match && match.variants.length ? match.variants[0].size : '';
  renderPurchaseOrderModal();
}

function renderPurchaseOrderModal(){
  const root = document.getElementById('po-root');
  if(!poState){ root.innerHTML = ''; return; }
  const s = poState;
  const codeTyped = s.code.trim() !== '';
  const matched = !!s.product;

  let statusHtml = '';
  if(codeTyped && !matched){
    statusHtml = `<div class="po-lookup-status err">${ICONS.alert}<span>ບໍ່ພົບລະຫັດສິນຄ້ານີ້ໃນຖານຂໍ້ມູນ, ກະລຸນາກວດສອບລະຫັດອີກຄັ້ງ</span></div>`;
  } else if(matched){
    statusHtml = `<div class="po-lookup-status ok">${ICONS.chevronRight}<span>ພົບລະຫັດສິນຄ້າ, ຂໍ້ມູນກົງກັນ 100%</span></div>`;
  }

  let matchCardHtml = '';
  if(matched){
    const { base, color } = splitNameColor(s.product.name);
    const sizeOptions = s.product.variants.map(v => `<option value="${esc(v.size)}" ${v.size===s.size?'selected':''}>${esc(v.size)} (ຄົງເຫຼືອ ${v.qty})</option>`).join('');
    matchCardHtml = `
      <div class="po-match-card">
        <div class="po-match-name">${esc(base)}</div>
        <div class="grid2">
          <div class="po-readonly-field">
            <label>ຂະໜາດ (ດຶງຈາກລະບົບ)</label>
            <select id="po-size-select">${sizeOptions}</select>
          </div>
          <div class="po-readonly-field">
            <label>ສີ (ດຶງຈາກລະບົບ)</label>
            <div class="po-static">${esc(color)}</div>
          </div>
        </div>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="overlay" id="po-overlay">
      <div class="modal" id="po-modal">
        <div class="modal-head">
          <h2>ສ້າງລາຍການຈັດຊື້ສິນຄ້າເຂົ້າສາງ</h2>
          <button class="icon-x" id="po-close">${ICONS.x}</button>
        </div>
        <p class="muted" style="margin:-8px 0 14px; font-size:12px;">ບັນທຶກລາຍການທີ່ຕ້ອງສັ່ງຊື້ເພີ່ມ, ຈະບໍ່ບວກເຂົ້າສະຕັອກທັນທີ</p>
        <div class="field">
          <label>ລະຫັດສິນຄ້າ *</label>
          <input id="po-code" value="${esc(s.code)}" placeholder="ພິມ ຫຼື ວາງລະຫັດສິນຄ້າ" autofocus>
        </div>
        ${statusHtml}
        ${matchCardHtml}
        <div class="field" style="margin-top:12px;">
          <label>ຈຳນວນທີ່ຕ້ອງການສັ່ງຊື້ *</label>
          <input id="po-qty" type="number" inputmode="numeric" min="1" value="${esc(s.qty)}" placeholder="0" ${matched?'':'disabled'}>
        </div>
        <div class="field" style="margin-top:12px;">
          <label>ໝາຍເລກຄຳສັ່ງຊື້ (ບໍ່ບັງຄັບ)</label>
          <input id="po-order-number" type="text" value="${esc(s.orderNumber||'')}" placeholder="ເຊັ່ນ: PO-2026-001">
        </div>
        <p id="po-error" style="color:var(--danger); font-size:12px; margin:4px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button type="button" class="btn-cancel" id="po-cancel-btn">ຍົກເລີກ</button>
          <button type="button" class="btn-confirm" id="po-save-btn" style="background:var(--success); color:#fff;" ${matched?'':'disabled'}>ບັນທຶກຄຳສັ່ງຊື້</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('po-overlay').addEventListener('click', e=>{ if(e.target.id==='po-overlay') closePurchaseOrderModal(); });
  document.getElementById('po-close').addEventListener('click', closePurchaseOrderModal);
  document.getElementById('po-cancel-btn').addEventListener('click', closePurchaseOrderModal);
  document.getElementById('po-code').addEventListener('input', e=>{ poLookupCode(e.target.value); });
  const sizeSel = document.getElementById('po-size-select');
  if(sizeSel) sizeSel.addEventListener('change', e=>{ poState.size = e.target.value; });
  document.getElementById('po-qty').addEventListener('input', e=>{ poState.qty = e.target.value; });
  document.getElementById('po-order-number').addEventListener('input', e=>{ poState.orderNumber = e.target.value; });
  document.getElementById('po-save-btn').addEventListener('click', confirmPurchaseOrder);
}

function confirmPurchaseOrder(){
  const errorEl = document.getElementById('po-error');
  const s = poState;
  if(!s.product){ errorEl.textContent = 'ກະລຸນາໃສ່ລະຫັດສິນຄ້າທີ່ຖືກຕ້ອງ ແລະ ມີໃນຖານຂໍ້ມູນ'; errorEl.style.display='block'; return; }
  if(!s.size){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດຂອງສິນຄ້ານີ້'; errorEl.style.display='block'; return; }
  const n = parseInt(s.qty, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນສັ່ງຊື້ໃຫ້ຖືກຕ້ອງ (ຫຼາຍກວ່າ 0)'; errorEl.style.display='block'; return; }

  const code = (s.product.code||'').trim();
  const { base, color } = splitNameColor(s.product.name);
  /* ແຕ່ລະຄຳສັ່ງຊື້ ແມ່ນລາຍການແຍກຕ່າງຫາກສະເໝີ (ບໍ່ລວມກັບລາຍການເກົ່າ ເຖິງຈະເປັນລະຫັດ+ຂະໜາດດຽວກັນ)
     ເພື່ອໃຫ້ເຫັນວັນ-ເວລາ ແລະ ຈຳນວນຂອງແຕ່ລະຄັ້ງແຍກກັນ */
  purchaseOrders = [...purchaseOrders, {
    id: uid(), code, productId: s.product.id, productName: base, color, size: s.size,
    qty: n, orderNumber: (s.orderNumber||'').trim(), createdAt: new Date().toISOString()
  }];
  savePurchaseOrders();
  closePurchaseOrderModal();
  showToast(`ບັນທຶກຄຳສັ່ງຊື້ສຳເລັດ: ${esc(base)} (${esc(s.size)}) x${n}`);
  if(tab === 'report') renderReport();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
}

function removePendingOrder(code, size){
  purchaseOrders = purchaseOrders.filter(o => !(o.code === code && o.size === size));
  savePurchaseOrders();
  renderReport();
  showToast('ຍົກເລີກຄຳສັ່ງຊື້ແລ້ວ');
}

/* ---------- PURCHASE ORDER LIST (arc-btn-3: ລາຍການຈັດຊື້) ---------- */
/* ສະແດງລາຍການທັງໝົດທີ່ຖືກສ້າງຈາກ "ສ້າງລາຍການຈັດຊື້" (arc-btn-4) */
function openPurchaseOrderListModal(){
  renderPurchaseOrderListModal();
}
function closePurchaseOrderListModal(){ poEditingOrderNumId = null; document.getElementById('po-list-root').innerHTML = ''; }

/* ຫາໝວດໝູ່ຂອງລາຍການຈັດຊື້ນຶ່ງ ໂດຍອີງໃສ່ສິນຄ້າທີ່ມັນອ້າງອີງເຖິງ (ຜ່ານ productId ກ່ອນ, ຖ້າບໍ່ພົບໃຫ້ລອງທຽບລະຫັດ) */
function getPurchaseOrderCategory(o){
  const p = products.find(pr => pr.id === o.productId) || products.find(pr => (pr.code||'').trim() === (o.code||'').trim());
  if(!p) return null;
  return (p.category && p.category.trim()) ? p.category.trim() : null;
}

function renderPurchaseOrderListModal(){
  const root = document.getElementById('po-list-root');
  const categoryOptions = `
    <option value="" ${poListCategoryFilter===''?'selected':''}>ທຸກໝວດໝູ່</option>
    ${CATEGORIES.map(c => `<option value="${esc(c)}" ${poListCategoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}
    <option value="__none__" ${poListCategoryFilter==='__none__'?'selected':''}>ບໍ່ໄດ້ກຳນົດ</option>
  `;
  root.innerHTML = `
    <div class="overlay" id="po-list-overlay">
      <div class="modal" id="po-list-modal">
        <div class="modal-head">
          <h2>ລາຍການຈັດຊື້</h2>
          <button class="icon-x" id="po-list-close">${ICONS.x}</button>
        </div>
        <div class="search-row" style="margin-bottom:10px;">
          <div class="search-wrap" style="margin-bottom:0;">${ICONS.search}<input id="po-list-search" type="text" placeholder="ຄົ້ນຫາຊື່, ລະຫັດ, ຂະໜາດ..." value="${esc(poListSearch)}"></div>
          <select id="po-list-category-filter" style="flex-shrink:0; width:118px; height:40px; background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:0 6px; font-size:12px; font-family:inherit;">${categoryOptions}</select>
        </div>
        <div id="po-list-rows"></div>
      </div>
    </div>
  `;
  document.getElementById('po-list-overlay').addEventListener('click', e=>{ if(e.target.id==='po-list-overlay') closePurchaseOrderListModal(); });
  document.getElementById('po-list-close').addEventListener('click', closePurchaseOrderListModal);
  document.getElementById('po-list-search').addEventListener('input', e=>{ poListSearch = e.target.value; renderPurchaseOrderRows(); });
  document.getElementById('po-list-category-filter').addEventListener('change', e=>{ poListCategoryFilter = e.target.value; renderPurchaseOrderRows(); });
  renderPurchaseOrderRows();
}

/* ໝາຍເລກຄຳສັ່ງຊື້ (PO number) — ຫ້ອງຂໍ້ມູນເສີມ ບໍ່ບັງຄັບ, ແກ້ໄຂ/ບັນທຶກໄດ້ທຸກເວລາຈາກລາຍການໃນ list ນີ້ */
function purchaseOrderNumHtml(o){
  if(poEditingOrderNumId === o.id){
    return `
      <div class="po-ordernum-edit-row" style="margin-top:6px;">
        <input type="text" class="po-ordernum-input" id="po-ordernum-input-${esc(o.id)}" value="${esc(o.orderNumber||'')}" placeholder="ໝາຍເລກຄຳສັ່ງຊື້ (ບໍ່ບັງຄັບ)">
        <button type="button" class="po-ordernum-save-btn" data-po-ordernum-save="${esc(o.id)}" title="ບັນທຶກ">${ICONS.check}</button>
        <button type="button" class="po-ordernum-cancel-btn" data-po-ordernum-cancel="${esc(o.id)}" title="ຍົກເລີກ">${ICONS.x}</button>
      </div>
    `;
  }
  if(o.orderNumber){
    return `<button type="button" class="po-ordernum-chip" data-po-ordernum-edit="${esc(o.id)}" title="ແກ້ໄຂໝາຍເລກຄຳສັ່ງຊື້">ໝາຍເລກຄຳສັ່ງຊື້: <b>${esc(o.orderNumber)}</b> ${ICONS.pencil}</button>`;
  }
  return `<button type="button" class="po-ordernum-chip add" data-po-ordernum-edit="${esc(o.id)}">+ ໃສ່ໝາຍເລກຄຳສັ່ງຊື້</button>`;
}

function editPurchaseOrderNumber(id){
  poEditingOrderNumId = id;
  renderPurchaseOrderRows();
  const inp = document.getElementById('po-ordernum-input-'+id);
  if(inp){ inp.focus(); inp.select(); }
}

function savePurchaseOrderNumber(id){
  const inp = document.getElementById('po-ordernum-input-'+id);
  const val = inp ? inp.value.trim() : '';
  purchaseOrders = purchaseOrders.map(o => o.id === id ? { ...o, orderNumber: val } : o);
  savePurchaseOrders();
  poEditingOrderNumId = null;
  renderPurchaseOrderRows();
  showToast(val ? 'ບັນທຶກໝາຍເລກຄຳສັ່ງຊື້ແລ້ວ' : 'ລຶບໝາຍເລກຄຳສັ່ງຊື້ແລ້ວ');
}

function cancelEditPurchaseOrderNumber(){
  poEditingOrderNumId = null;
  renderPurchaseOrderRows();
}

function renderPurchaseOrderRows(){
  const rowsRoot = document.getElementById('po-list-rows');
  if(!rowsRoot) return;
  const q = poListSearch.trim().toLowerCase();

  let filtered = [...purchaseOrders];
  if(poListCategoryFilter){
    filtered = filtered.filter(o => {
      const cat = getPurchaseOrderCategory(o);
      return poListCategoryFilter === '__none__' ? !cat : cat === poListCategoryFilter;
    });
  }
  if(q){
    filtered = filtered.filter(o =>
      (o.productName||'').toLowerCase().includes(q) ||
      (o.color||'').toLowerCase().includes(q) ||
      (o.code||'').toLowerCase().includes(q) ||
      (o.size||'').toLowerCase().includes(q)
    );
  }
  const sorted = filtered.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const totalItems = sorted.reduce((s,o)=>s+o.qty,0);
  const isFiltering = !!(q || poListCategoryFilter);

  let rowsHtml;
  if(purchaseOrders.length === 0){
    rowsHtml = `<div class="empty">${ICONS.receiptCheck}<p>ຍັງບໍ່ມີລາຍການຈັດຊື້</p></div>`;
  } else if(sorted.length === 0){
    rowsHtml = `<div class="empty">${ICONS.search}<p>ບໍ່ພົບລາຍການທີ່ຄົ້ນຫາ</p></div>`;
  } else {
    rowsHtml = sorted.map(o => `
      <div class="report-card" style="margin-bottom:10px; background:rgba(154,201,59,.15);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
          <div style="min-width:0;">
            <p style="margin:0;"><span style="display:inline-block; background:#2F6FED; color:#fff; font-weight:700; font-size:15px; padding:3px 9px; border-radius:8px;">${esc(o.productName)}${o.color && o.color !== '-' ? ' ('+esc(o.color)+')' : ''}</span></p>
            <p class="muted" style="margin:6px 0 0;">${o.code?('#'+esc(o.code)+' &middot; '):''}ຂະໜາດ ${esc(o.size)}</p>
            <p class="muted" style="margin:2px 0 0;">${esc(new Date(o.createdAt).toLocaleString('lo-LA'))}</p>
            ${purchaseOrderNumHtml(o)}
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:10px;">
              <button type="button" class="order-icon-btn" style="color:var(--accent);" data-po-partial-id="${esc(o.id)}" title="ຮັບເຂົ້າບາງສ່ວນ">${ICONS.boxIn}</button>
              <button type="button" class="order-icon-btn" style="color:var(--success);" data-po-receive-id="${esc(o.id)}" title="ນຳເຂົ້າສາງ">${ICONS.check}</button>
              <button type="button" class="order-icon-btn" style="color:var(--danger);" data-po-cancel-id="${esc(o.id)}" title="ຍົກເລີກ">${ICONS.x}</button>
            </div>
            <span style="font-size:17px; font-weight:800; color:var(--dark); white-space:nowrap; font-family:monospace;">x${o.qty}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  rowsRoot.innerHTML = `
    <p class="muted" style="margin:-4px 0 12px; font-size:12px;">${isFiltering ? `ພົບ ${sorted.length} ລາຍການ, ລວມ ${totalItems} ໂຕ` : `ລາຍການທັງໝົດ ${sorted.length} ລາຍການ, ລວມ ${totalItems} ໂຕ`} — ສ້າງຈາກ "ສ້າງລາຍການຈັດຊື້"</p>
    ${rowsHtml}
  `;
  document.querySelectorAll('[data-po-receive-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ confirmReceiveIntoWarehouse(btn.dataset.poReceiveId); });
  });
  document.querySelectorAll('[data-po-cancel-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ confirmCancelOrder(btn.dataset.poCancelId); });
  });
  document.querySelectorAll('[data-po-partial-id]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ openPartialReceiveModal(btn.dataset.poPartialId); });
  });
  document.querySelectorAll('[data-po-ordernum-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ editPurchaseOrderNumber(btn.dataset.poOrdernumEdit); });
  });
  document.querySelectorAll('[data-po-ordernum-save]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ savePurchaseOrderNumber(btn.dataset.poOrdernumSave); });
  });
  document.querySelectorAll('[data-po-ordernum-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ cancelEditPurchaseOrderNumber(); });
  });
  document.querySelectorAll('.po-ordernum-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); savePurchaseOrderNumber(inp.id.replace('po-ordernum-input-','')); }
      else if(e.key === 'Escape'){ e.preventDefault(); cancelEditPurchaseOrderNumber(); }
    });
  });
  fitOrderNumChips();
}

/* ຫົດຂະໜາດຕົວໜັງສືຂອງປ້າຍ "ໝາຍເລກຄຳສັ່ງຊື້" ອັດຕະໂນມັດ ເມື່ອຂໍ້ມູນຍາວເກີນພື້ນທີ່ທີ່ມີ, ແທນການຕັດຄຳ/ຂຶ້ນແຖວໃໝ່ —
   ວັດແທ້ຄວາມກວ້າງຈິງຫຼັງ render ແລ້ວ ຫຼຸດ font-size ເທື່ອລະໜ່ວຍຈົນກວ່າຂໍ້ຄວາມຈະພໍດີໃນແຖວດຽວ (ຢ່າງໜ້ອຍ 7px) */
function fitOrderNumChips(){
  document.querySelectorAll('.po-ordernum-chip:not(.add)').forEach(chip=>{
    let size = 11;
    chip.style.fontSize = size + 'px';
    while(chip.scrollWidth > chip.clientWidth && size > 7){
      size -= 1;
      chip.style.fontSize = size + 'px';
    }
  });
}

/* ---------- ORDER ACTIONS (cancel / receive into warehouse) — act on ONE specific purchase-order entry by id,
   since duplicate code+size entries are now kept separate (never merged) and must not be confused with each other ---------- */
function closeOrderActionModal(){ const el = document.getElementById('order-action-root'); if(el) el.innerHTML = ''; }

function confirmCancelOrder(id){
  purchaseOrders = purchaseOrders.filter(o => o.id !== id);
  savePurchaseOrders();
  closeOrderActionModal();
  if(tab === 'report') renderReport();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast('ຍົກເລີກການຈັດຊື້ສຳເລັດ');
}

function confirmReceiveIntoWarehouse(id){
  const order = purchaseOrders.find(o => o.id === id);
  if(!order) { closeOrderActionModal(); return; }
  const p = products.find(pr => (pr.code||'').trim() === order.code);
  if(!p){ closeOrderActionModal(); showToast('ບໍ່ພົບສິນຄ້າຕາມລະຫັດນີ້'); return; }
  const variant = p.variants.find(v => v.size === order.size);
  if(!variant){ closeOrderActionModal(); showToast('ບໍ່ພົບຂະໜາດສິນຄ້ານີ້'); return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => v.id === variant.id ? { ...v, qty: v.qty + order.qty } : v) }
    : pr
  );
  save();

  purchaseOrders = purchaseOrders.filter(o => o.id !== id);
  savePurchaseOrders();

  closeOrderActionModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast('ເພີ່ມສິນຄ້າເຂົ້າສາງຮຽບຮ້ອຍແລ້ວ');
}

/* ---------- PARTIAL RECEIVE (receive only part of a purchase-order entry's quantity) ----------
   ໃຊ້ໃນກໍລະນີເຄື່ອງມາບໍ່ພ້ອມ/ບໍ່ຄົບຕາມທີ່ສັ່ງ: ຮັບເຂົ້າສາງເທົ່າທີ່ມາຈິງ, ຫຼຸດຍອດທີ່ຍັງເຫຼືອສັ່ງຊື້ລົງ,
   ແລະ ຖ້າຮັບຄົບໝົດແລ້ວ (ຍອດເຫຼືອ <= 0) ໃຫ້ລຶບລາຍການນັ້ນອອກຄືກັບການຮັບເຂົ້າແບບເຕັມ */
let partialReceiveId = null;

function openPartialReceiveModal(id){
  partialReceiveId = id;
  renderPartialReceiveModal();
}
function closePartialReceiveModal(){
  partialReceiveId = null;
  const el = document.getElementById('partial-receive-root');
  if(el) el.innerHTML = '';
}
function renderPartialReceiveModal(){
  const root = document.getElementById('partial-receive-root');
  if(!partialReceiveId){ root.innerHTML=''; return; }
  const order = purchaseOrders.find(o => o.id === partialReceiveId);
  if(!order){ closePartialReceiveModal(); return; }
  root.innerHTML = `
    <div class="overlay center" id="partial-receive-overlay">
      <div class="confirm-box" style="max-width:340px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຮັບເຂົ້າສາງບາງສ່ວນ</p>
        <p class="desc" style="margin-bottom:12px;">${esc(order.productName)}${order.color && order.color !== '-' ? ' ('+esc(order.color)+')' : ''} · ຂະໜາດ ${esc(order.size)}${order.code?(' · #'+esc(order.code)):''} — ຍັງເຫຼືອສັ່ງຊື້ <b>${order.qty}</b> ໂຕ</p>
        <div class="field" style="margin-bottom:0;">
          <label>ຈຳນວນທີ່ຮັບເຂົ້າຄັ້ງນີ້ *</label>
          <input id="partial-receive-qty" type="number" inputmode="numeric" min="1" max="${order.qty}" placeholder="ໃສ່ຈຳນວນທີ່ໄດ້ຮັບຈິງ">
        </div>
        <p id="partial-receive-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="partial-receive-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="partial-receive-confirm-btn" style="background:var(--accent); color:var(--dark);">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('partial-receive-overlay').addEventListener('click', e=>{ if(e.target.id==='partial-receive-overlay') closePartialReceiveModal(); });
  document.getElementById('partial-receive-cancel-btn').addEventListener('click', closePartialReceiveModal);
  document.getElementById('partial-receive-confirm-btn').addEventListener('click', confirmPartialReceive);
}

function confirmPartialReceive(){
  const order = purchaseOrders.find(o => o.id === partialReceiveId);
  const errorEl = document.getElementById('partial-receive-error');
  if(!order){ closePartialReceiveModal(); return; }

  const raw = document.getElementById('partial-receive-qty').value;
  const n = parseInt(raw, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນທີ່ຖືກຕ້ອງ (ຫຼາຍກວ່າ 0)'; errorEl.style.display = 'block'; return; }
  if(n > order.qty){ errorEl.textContent = `ຈຳນວນທີ່ຮັບເຂົ້າຕ້ອງບໍ່ເກີນຍອດທີ່ຍັງເຫຼືອສັ່ງຊື້ (${order.qty})`; errorEl.style.display = 'block'; return; }

  const p = products.find(pr => (pr.code||'').trim() === order.code);
  if(!p){ errorEl.textContent = 'ບໍ່ພົບສິນຄ້າຕາມລະຫັດນີ້'; errorEl.style.display = 'block'; return; }
  const variant = p.variants.find(v => v.size === order.size);
  if(!variant){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດສິນຄ້ານີ້'; errorEl.style.display = 'block'; return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => v.id === variant.id ? { ...v, qty: v.qty + n } : v) }
    : pr
  );
  save();

  const remaining = order.qty - n;
  if(remaining <= 0){
    purchaseOrders = purchaseOrders.filter(o => o.id !== order.id);
  } else {
    purchaseOrders = purchaseOrders.map(o => o.id === order.id ? { ...o, qty: remaining } : o);
  }
  savePurchaseOrders();

  closePartialReceiveModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderRows();
  showToast(remaining <= 0
    ? `ຮັບເຂົ້າສາງ x${n} ຄົບຖ້ວນຕາມທີ່ສັ່ງແລ້ວ`
    : `ຮັບເຂົ້າສາງ x${n} ແລ້ວ, ຍັງເຫຼືອສັ່ງຊື້ x${remaining}`);
}

/* ---------- PRODUCT DETAIL SHEET (grid view tap) ---------- */
/* ລ໋ອກປຸ່ມ "ລຶບ" ສິນຄ້າ ເພື່ອປ້ອງກັນການລຶບຂໍ້ມູນໂດຍບັງເອີນ — ໃຊ້ຮ່ວມກັນທັງໜ້າລາຍລະອຽດສິນຄ້າ (detail sheet, ຮູບກຸນແຈຢູ່ກາງຮູບສິນຄ້າ)
   ແລະ ແຖວລາຍການໃນ list view (ຮູບກຸນແຈເປັນປຸ່ມ pill ຢູ່ໃນ expand panel) — ລ໋ອກໄວ້ໂດຍຄ່າເລີ່ມຕົ້ນທຸກຄັ້ງທີ່ເປີດ,
   ຕ້ອງແຕະຮູບໜ່ວຍກຸນແຈ 2 ຄັ້ງຕິດກັນເພື່ອປົດລ໋ອກ (ຄວາມຈຳຊົ່ວຄາວ ບໍ່ໄດ້ບັນທຶກລົງ localStorage). */
let detailDeleteUnlocked = {}; // id -> true ໃນຂະນະທີ່ປົດລ໋ອກຢູ່
let detailLockLastTapAt = {};  // id -> timestamp ຂອງການແຕະຄັ້ງກ່ອນ (ສຳລັບກວດ double-tap)
function isDetailDeleteUnlocked(id){ return !!detailDeleteUnlocked[id]; }
function handleDetailLockTap(id){
  const now = Date.now();
  const last = detailLockLastTapAt[id] || 0;
  if(now - last < 400){
    detailLockLastTapAt[id] = 0;
    if(isDetailDeleteUnlocked(id)){ delete detailDeleteUnlocked[id]; }
    else { detailDeleteUnlocked[id] = true; showToast('ປົດລ໋ອກແລ້ວ, ສາມາດລຶບຂໍ້ມູນໄດ້'); }
    if(detailId === id) renderDetailSheet();
  } else {
    detailLockLastTapAt[id] = now;
  }
}

function openDetail(id){ detailId = id; delete detailDeleteUnlocked[id]; renderDetailSheet(); }
function closeDetail(){ if(detailId) delete detailDeleteUnlocked[detailId]; detailId = null; document.getElementById('detail-root').innerHTML=''; }
function renderDetailSheet(){
  const root = document.getElementById('detail-root');
  if(!detailId){ root.innerHTML=''; return; }
  const raw = products.find(x=>x.id===detailId);
  if(!raw){ detailId=null; root.innerHTML=''; return; }
  const p = withTotals(raw);
  const unlocked = isDetailDeleteUnlocked(p.id);
  root.innerHTML = `
    <div class="overlay" id="detail-overlay">
      <div class="modal" id="detail-modal">
        <div class="modal-head">
          <h2>${esc(p.name)}</h2>
          <button class="icon-x" id="detail-close">${ICONS.x}</button>
        </div>
        <div class="detail-img">
          ${p.image ? '<img src="'+p.image+'" alt="">' : ICONS.image}
          <button type="button" class="detail-lock-btn ${unlocked?'unlocked':''}" id="detail-lock-btn" title="${unlocked?'ປົດລ໋ອກຢູ່ (ແຕະ 2 ຄັ້ງເພື່ອລ໋ອກຄືນ)':'ລ໋ອກຢູ່ (ແຕະ 2 ຄັ້ງເພື່ອປົດລ໋ອກ)'}">${unlocked?ICONS.lockOpen:ICONS.lockClosed}</button>
        </div>
        <p class="muted" style="margin:0 0 12px; font-size:12px;">${p.code?('#'+esc(p.code)+' &middot; '):''}${p.price>0?(Number(p.price).toLocaleString()+' ກີບ'):''}</p>
        <div>${variantRowsHtml(p)}</div>
        <div class="row-actions" style="margin-top:14px;">
          <button type="button" class="sell-btn" data-action="open-sell" data-id="${p.id}" style="flex:1; justify-content:center; padding:10px;">${ICONS.sell} ຂາຍອອກ</button>
          <button type="button" class="buy-btn" data-action="open-buy" data-id="${p.id}" style="flex:1; justify-content:center; padding:10px;">${ICONS.buy} ຊື້ເຂົ້າ</button>
        </div>
        <div class="row-actions" style="margin-top:8px;">
          <button class="btn-edit" data-action="open-edit" data-id="${p.id}">${ICONS.pencil} ແກ້ໄຂ</button>
          <button class="btn-del ${unlocked?'':'locked'}" data-action="confirm-delete" data-id="${p.id}">${ICONS.trash} ລຶບ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('detail-overlay').addEventListener('click', e=>{ if(e.target.id==='detail-overlay') closeDetail(); });
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-lock-btn').addEventListener('click', ()=> handleDetailLockTap(p.id));
}

function renderBarcodeTab(){
  const content = document.getElementById('content');
  const lastSheetSync = localStorage.getItem(SHEET_LAST_SYNC_KEY);
  const lastSheetSyncText = lastSheetSync ? new Date(lastSheetSync).toLocaleString('lo-LA') : 'ຍັງບໍ່ເຄີຍ';
  const unsyncedCount = scanLog.filter(r=>!r.syncedToSheet).length;
  content.innerHTML = `
    <button type="button" class="submit-btn" id="open-scanner-btn" style="margin-top:0; margin-bottom:12px;">${ICONS.barcode} ສະແກນຮັບພັດສະດຸ</button>
    <div class="search-wrap"><span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dark-40); display:flex;">${ICONS.search}</span><input id="barcode-search-input" placeholder="ຄົ້ນຫາຕາມລະຫັດ Barcode..." value="${esc(barcodeSearch)}"></div>

        <p class="muted" style="margin:2px 0 0;">Sync ລ່າສຸດ: ${esc(lastSheetSyncText)}${unsyncedCount>0 ? ' &middot; '+unsyncedCount+' ລາຍການໃໝ່' : ''}</p>
      </div>
      <button type="button" id="sync-sheet-btn" style="background:var(--dark-5); color:var(--dark); border:none; padding:8px 14px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; display:flex; align-items:center; gap:5px;">${ICONS.upload} Sync</button>
    </div>
    <div id="barcode-list" style="margin-top:12px;"></div>

  document.getElementById('open-scanner-btn').addEventListener('click', ()=>openScanner('receive'));

function renderBarcodeList(){
  const container = document.getElementById('barcode-list');
  if(!container) return;

  if(filtered.length === 0){

/* ---------- BARCODE CAMERA SCANNER ---------- */
let scannerStream = null;
let scannerActive = false;
let scannerRAF = null;
let scannerCooldown = false;
let scannerMode = 'receive';
let scannerNewCount = 0;

/* ສຽງເຕືອນສຳລັບທຸກບ່ອນທີ່ໃຊ້ function ສະແກນ barcode (ທັງກ້ອງອັດຕະໂນມັດ ແລະ ພິມລະຫັດເອງ) —
   ສ້າງສຽງ beep ຈາກ Web Audio API ໂດຍກົງ (ບໍ່ຕ້ອງໃຊ້ໄຟລ໌ສຽງພາຍນອກ, ໃຊ້ໄດ້ແບບ offline). */
let scanAudioCtx = null;
function ensureScanAudioCtx(){
  try{
    if(!scanAudioCtx) scanAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(scanAudioCtx.state === 'suspended') scanAudioCtx.resume();
  }catch(e){}
  return scanAudioCtx;
}
function playScanBeep(freq, durationMs, waveType){
  const ctx = ensureScanAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = waveType || 'sine';
    osc.frequency.value = freq;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.28, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs/1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + durationMs/1000 + 0.02);
  }catch(e){}
}
function playScanSuccessSound(){ playScanBeep(1500, 110, 'sine'); }
function playScanErrorSound(){
  playScanBeep(300, 130, 'square');
  setTimeout(()=>playScanBeep(300, 130, 'square'), 160);
}

function openScanner(mode){
  scannerMode = mode || 'receive';
  ensureScanAudioCtx(); // ປົດລ໋ອກສຽງໄວ້ແຕ່ຕອນນີ້ (ຖືກເປີດຈາກການແຕະປຸ່ມ, ນັບເປັນ user gesture)
  scannerNewCount = 0;
  renderScannerModal();
  startScanner();
  if(scannerMode === 'receive') refreshKnownBarcodesFromSheet();
}
function closeScanner(){ stopScanner(); document.getElementById('scanner-root').innerHTML=''; }

function renderScannerModal(){

  root.innerHTML = `

      <div style="width:100%; max-width:480px; margin:0 auto; background:#0a0a0a; position:relative; display:flex; flex-direction:column;">

        <div id="scanner-hint" style="color:rgba(255,255,255,.7); font-size:13px; text-align:center; padding:12px 16px; min-height:20px; font-weight:600;">${isOneShot ? 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ຈະສະແກນອັດຕະໂນມັດ' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ'}</div>

        </div>

  function submitManualCode(){

    if(!val) return;

  }
  document.getElementById('manual-code-btn').addEventListener('click', submitManualCode);
  document.getElementById('manual-code-input').addEventListener('keydown', e=>{
    if(e.key === 'Enter') submitManualCode();

async function startScanner(){
  if(!('BarcodeDetector' in window)) return;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
  }catch(e1){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:true });
    }catch(e2){
      handleCameraError(e2);
      return;
    }
  }
  scannerStream = stream;
  try{
    const video = document.getElementById('scanner-video');
    if(!video){ stopScanner(); return; }
    video.srcObject = scannerStream;
    await video.play();
    const detector = new BarcodeDetector();
    scannerActive = true;
    scannerCooldown = false;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const loop = async () => {
      if(!scannerActive) return;
      if(!scannerCooldown && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        try{
          const codes = await detector.detect(canvas);
          if(codes && codes.length){ handleScanResult(codes[0].rawValue); }
        }catch(e){}
      }
      scannerRAF = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    handleCameraError(e);
  }
}

function handleCameraError(e){
  const name = e && e.name;
  let msg = 'ເປີດກ້ອງບໍ່ສຳເລັດ, ກວດການອະນຸຍາດກ້ອງ';
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    msg = 'ບໍ່ໄດ້ຮັບອະນຸຍາດໃຊ້ກ້ອງ — ໄປອະນຸຍາດກ້ອງໃຫ້ browser ນີ້ໃນການຕັ້ງຄ່າ ແລ້ວກັບມາລອງໃໝ່';
  } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    msg = 'ບໍ່ພົບກ້ອງໃນອຸປະກອນນີ້';
  } else if(name === 'NotReadableError' || name === 'TrackStartError'){
    msg = 'ກ້ອງກຳລັງຖືກໃຊ້ໂດຍແອັບອື່ນຢູ່ — ປິດແອັບກ້ອງ/ວິດີໂອອື່ນແລ້ວລອງໃໝ່';
  } else if(name === 'SecurityError'){
    msg = 'ໜ້ານີ້ຕ້ອງເປີດຜ່ານ https ຈຶ່ງຈະໃຊ້ກ້ອງໄດ້';
  }
  showToast(msg);
  const hint = document.getElementById('scanner-hint');
  if(hint){
    hint.innerHTML = `${esc(msg)}<br><button type="button" id="camera-retry-btn" style="margin-top:8px; background:var(--accent); color:var(--dark); border:none; border-radius:999px; padding:6px 16px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ລອງໃໝ່</button>`;
    hint.style.color = '#E8926B';
    const retryBtn = document.getElementById('camera-retry-btn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{
      hint.textContent = scannerMode === 'search' ? 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ຈະສະແກນອັດຕະໂນມັດ' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ';
      hint.style.color = 'rgba(255,255,255,.7)';
      startScanner();
    });
  }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild) frame.firstElementChild.style.borderColor = '#B94A3D';
}

function stopScanner(){
  scannerActive = false;
  scannerCooldown = false;
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function isKnownBarcode(codeNorm){ return knownBarcodeSet.has(codeNorm); }

async function refreshKnownBarcodesFromSheet(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
    const ok = await ensureToken();
    if(!ok) return;
    const sheetId = await findOrCreateSheet();
    const res = await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A2:A100000`);
    const data = await res.json();
    (data.values || []).forEach(row => {
      if(row[0]) knownBarcodeSet.add(String(row[0]).trim().toLowerCase());
    });
  }catch(e){ /* best-effort, ignore */ }
}

function setScannerHint(text, colorHex){
  const hint = document.getElementById('scanner-hint');
  if(hint){ hint.textContent = text; hint.style.color = colorHex || 'rgba(255,255,255,.7)'; }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild){ frame.firstElementChild.style.borderColor = colorHex || 'var(--accent)'; }
}

function scheduleBarcodeSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(barcodeSyncTimer);
  barcodeSyncTimer = setTimeout(()=>{ syncScanLogToSheet(true); }, 1200);
}

function handleScanResult(rawCode){
  const code = (rawCode || '').trim();
  if(!code) return;

  if(scannerMode === 'search'){
    stopScanner();
    if(navigator.vibrate) navigator.vibrate(120);
    playScanSuccessSound();
    closeScanner();
    search = code;
    const si = document.getElementById('search-input');
    if(si) si.value = code;
    renderListItems();
    showToast('ຄົ້ນຫາ: ' + code);
    return;
  }

  if(scannerMode === 'quick'){
    stopScanner();
    closeScanner();
    const norm = code.toLowerCase();
    const product = products.find(p => (p.code||'').trim().toLowerCase() === norm && (p.code||'').trim() !== '');
    if(!product){
      if(navigator.vibrate) navigator.vibrate([80,60,80]);
      playScanErrorSound();
      showToast('ບໍ່ມີສິນຄ້ານີ້ໃນລະບົບ');
      return;
    }
    if(navigator.vibrate) navigator.vibrate(120);
    playScanSuccessSound();
    openQuickScanActionModal(product);
    return;
  }

  // receive mode: duplicate check + log-to-sheet only — camera stays open for continuous scanning
  const norm = code.toLowerCase();
  const isDup = isKnownBarcode(norm);

  if(navigator.vibrate) navigator.vibrate(isDup ? [80,60,80] : 120);
  if(isDup) playScanErrorSound(); else playScanSuccessSound();

  if(isDup){
    showToast('ພັດສະດຸໄດ້ຮັບແລ້ວ');
    setScannerHint('⚠ ພັດສະດຸໄດ້ຮັບແລ້ວ: ' + code, '#E8A33D');
  } else {
    knownBarcodeSet.add(norm);
    const entry = { id:uid(), code, scannedAt:new Date().toISOString(), isDuplicate:false, syncedToSheet:false };
    scanLog = [entry, ...scanLog];
    saveScanLog();
    scannerNewCount++;
    showToast('ບັນທຶກແລ້ວ: ' + code);
    setScannerHint('✓ ບັນທຶກແລ້ວ: ' + code, '#4C7A5E');
    scheduleBarcodeSync();
  }

  if(tab === 'barcode') renderBarcodeList();

  scannerCooldown = true;
  setTimeout(()=>{
    scannerCooldown = false;
    setScannerHint(scannerNewCount>0 ? 'ສະແກນແລ້ວ ' + scannerNewCount + ' ພັດສະດຸໃໝ່' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ', 'var(--accent)');
  }, 1400);
}

    });
  });
  document.querySelectorAll('.manage-cat-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const item = manageCategoriesState.find(c => c.id === e.target.dataset.cid);
      if(item) item.current = e.target.value;
    });
  });
}

function saveManagedCategories(){
  const kept = manageCategoriesState.filter(c => !c.deleted);
  const names = kept.map(c => c.current.trim()).filter(n => n);
  const dedupCheck = new Set(names.map(n=>n.toLowerCase()));
  if(dedupCheck.size !== names.length){
    showToast('ມີຊື່ໝວດໝູ່ຊ້ຳກັນ, ກະລຸນາແກ້ໄຂ');
    return;
  }
  const removedNames = manageCategoriesState.filter(c => c.deleted).map(c => c.original);
  const renameMap = {};
  kept.forEach(c => { if(c.current.trim() !== c.original) renameMap[c.original] = c.current.trim(); });

  CATEGORIES = names;
  saveCategories();

  if(Object.keys(renameMap).length || removedNames.length){
    products = products.map(p => {
      if(p.category && renameMap[p.category]) return { ...p, category: renameMap[p.category] };
      if(p.category && removedNames.includes(p.category)) return { ...p, category: '' };
      return p;
    });
    save();
  }
  if(removedNames.includes(reportCategoryFilter) || (renameMap[reportCategoryFilter])){
    reportCategoryFilter = renameMap[reportCategoryFilter] || '';
  }

  closeManageCategoriesModal();
  showToast('ບັນທຶກການປ່ຽນແປງໝວດໝູ່ແລ້ວ');
  renderReport();
}

function renderReport(){
  const content = document.getElementById('content');
  const list = products.map(withTotals);
  const totalSKU = products.length;
  const totalQty = list.reduce((s,p)=>s+p.totalQty,0);
  const totalValue = list.reduce((s,p)=>s+p.totalQty*p.price,0);
  const lowProducts = list.filter(p=>p.lowVariants.length>0);
  const lowCount = list.reduce((s,p)=>s+p.lowVariants.length,0);

  let lowHtml = '<p class="muted">ບໍ່ມີສິນຄ້າໃກ້ໝົດ, ສະຕັອກປົກກະຕິ</p>';
  if(lowProducts.length>0){
    lowHtml = lowProducts.map(p => p.lowVariants.map(v => {
      const order = findPendingOrder((p.code||'').trim(), v.size);
      const badge = order
        ? `<span class="low-cart-badge" title="ສັ່ງຊື້ແລ້ວ ${sumPendingOrderQty((p.code||'').trim(), v.size)} ລາຍການ">${ICONS.cart}</span>`
        : '';
      return `
      <div class="low-item">
        <span>${esc(p.name)} <span class="muted" style="font-weight:700; color:var(--dark);">(${esc(v.size)})</span>${badge}</span>
        <span style="color:var(--danger); font-family:monospace; font-weight:600;">${v.qty} / ${p.minQty}</span>
      </div>
    `;
    }).join('')).join('');

  let stockHtml = '<p class="muted">ຍັງບໍ່ມີຂໍ້ມູນສິນຄ້າ</p>';
  let stockRowCount = 0;
  if(list.length>0){
    const rows = [];
    [...list].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      p.variants.forEach(v => {
        if(v.qty === 0) return;
        rows.push(`
          <div class="stock-item">
            <span>${esc(p.name)} <span class="muted" style="font-weight:700; color:var(--dark);">(${esc(v.size)})</span></span>

  function matchesCategory(p){

  let categorySKU = 0, categoryQty = 0;
  if(categoryList.length>0){
    const rows = [];
    [...categoryList].sort((a,b)=>a.name.localeCompare(b.name)).forEach(p => {
      categorySKU++;
      p.variants.forEach(v => {
        categoryQty += v.qty;

            <span style="font-family:monospace;">${v.qty} ລາຍການ</span>

    categoryHtml = rows.join('') || '<p class="muted">ບໍ່ມີສິນຄ້າໃນໝວດໝູ່ນີ້</p>';
  }
  const categoryOptions = `
    <option value="" ${reportCategoryFilter===''?'selected':''}>ທັງໝົດ</option>
    ${CATEGORIES.map(c => `<option value="${esc(c)}" ${reportCategoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}
    <option value="__none__" ${reportCategoryFilter==='__none__'?'selected':''}>ບໍ່ໄດ້ກຳນົດ</option>
  `;

  content.innerHTML = `
    <div class="report-grid">
      <div class="report-card">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
          <div>
            <p class="report-label">ມູນຄ່າສະຕັອກລວມ</p>
            <p class="report-value">${totalValue.toLocaleString()} <small>ກີບ</small></p>
            <div class="report-sub"><span>${totalSKU} ລາຍການ</span><span>${totalQty} ລາຍການລວມ</span></div>
          </div>
          <button type="button" class="pdf-btn" data-pdf="value">${ICONS.pdf} ສົ່ງອອກ</button>

      <div class="report-card">

        <div style="max-height:280px; overflow-y:auto;">${lowHtml}</div>

      <div class="report-card">

          <p>ຈຳນວນຄົງເຫຼືອທັງໝົດ (${stockRowCount})</p>
          <button type="button" class="pdf-btn" data-pdf="fullstock">${ICONS.pdf} ສົ່ງອອກ</button>
        </div>
        <div style="max-height:280px; overflow-y:auto;">${stockHtml}</div>
      </div>
      <div class="report-card">
        <div class="report-card-header">
          <div class="report-card-header-row">

        <div style="max-height:280px; overflow-y:auto;">${categoryHtml}</div>
      </div>

  document.querySelectorAll('.pdf-btn').forEach(btn => {
    btn.addEventListener('click', () => printReport(btn.dataset.pdf));

/* ---------- PDF PREVIEW POPUP (ຫຼາຍໜ້າ A4 ອັດຕະໂນມັດ) ---------- */
let pdfPreviewResizeHandler = null;

function mmToPx(mm){
  const div = document.createElement('div');
  div.style.cssText = `position:fixed; left:-99999px; top:0; visibility:hidden; height:${mm}mm; width:0; margin:0; padding:0; border:0;`;
  document.body.appendChild(div);
  const px = div.offsetHeight;
  document.body.removeChild(div);
  return px || (mm * 3.7795);
}

/* ແບ່ງ header/summary/table ອອກເປັນຫຼາຍໜ້າ A4 ຖ້າຕາຕະລາງຍາວເກີນໄປ (ຫົວຕາຕະລາງຈະຖືກຊ້ຳຢູ່ທຸກໜ້າ) */
function buildPaginatedPdfPages(headerHtml, bodyHtml){
  const wrap = document.createElement('div');
  wrap.innerHTML = bodyHtml;
  const summaryEl = wrap.querySelector('.print-summary');
  const tableEl = wrap.querySelector('.print-table');
  if(!tableEl){
    return [ headerHtml + bodyHtml ];
  }
  const theadEl = tableEl.querySelector('thead');
  const tbodyEl = tableEl.querySelector('tbody');
  const rows = tbodyEl ? Array.from(tbodyEl.children) : [];
  const theadHtml = theadEl ? theadEl.outerHTML : '';
  const summaryHtmlStr = summaryEl ? summaryEl.outerHTML : '';

  /* ເນື້ອຫາທີ່ຢູ່ຫຼັງຕາຕະລາງ (ເຊັ່ນ: ຈຳນວນເງິນເປັນຕົວໜັງສື, ບ່ອນເຊັນ) ຕ້ອງບໍ່ຖືກຖິ້ມ —
     ໃຫ້ໄປຕໍ່ທ້າຍໜ້າສຸດທ້າຍ ຫຼັງຈາກສ່ວນຕາຕະລາງຂອງໜ້ານັ້ນ */
  let afterTableHtml = '';
  let sib = tableEl.nextSibling;
  while(sib){
    if(sib.outerHTML !== undefined) afterTableHtml += sib.outerHTML;
    else if(sib.nodeType === 3) afterTableHtml += sib.textContent;
    sib = sib.nextSibling;
  }

  if(rows.length <= 1){
    return [ headerHtml + summaryHtmlStr + `<table class="print-table">${theadHtml}<tbody>${rows.map(r=>r.outerHTML).join('')}</tbody></table>` + afterTableHtml ];
  }

  const stage = document.createElement('div');
  stage.className = 'pdf-page pdf-measure-stage';
  document.body.appendChild(stage);

  const usableHeightPx = mmToPx(297) - mmToPx(14) * 2;

  stage.innerHTML = headerHtml;
  const headerHeightPx = stage.offsetHeight;

  stage.innerHTML = summaryHtmlStr;
  const summaryHeightPx = summaryEl ? stage.offsetHeight : 0;

  stage.innerHTML = `<table class="print-table">${theadHtml}<tbody>${rows.map(r=>r.outerHTML).join('')}</tbody></table>`;
  const theadHeightPx = stage.querySelector('thead') ? stage.querySelector('thead').offsetHeight : 0;
  const rowHeights = Array.from(stage.querySelectorAll('tbody tr')).map(tr => tr.offsetHeight);

  document.body.removeChild(stage);

  const firstPageBudget = Math.max(usableHeightPx - headerHeightPx - summaryHeightPx - theadHeightPx, 60);
  const contPageBudget = Math.max(usableHeightPx - theadHeightPx, 60);

  const pageChunks = [];
  let idx = 0;
  let isFirst = true;
  while(idx < rows.length){
    const budget = isFirst ? firstPageBudget : contPageBudget;
    const startIdx = idx;
    let used = 0;
    while(idx < rows.length){
      const h = rowHeights[idx] || 0;
      if(used > 0 && used + h > budget) break;
      used += h;
      idx++;
      if(used > budget) break; /* ແຖວດຽວໃຫຍ່ກວ່າໜ້າ ກໍ່ໃຫ້ຢູ່ໜ້ານັ້ນຄົນດຽວ */
    }
    if(idx === startIdx) idx++; /* ກັນຄ້າງ loop */
    pageChunks.push({ start:startIdx, end:idx });
    isFirst = false;
  }
  if(pageChunks.length === 0) pageChunks.push({ start:0, end:rows.length });

  const totalPages = pageChunks.length;
  return pageChunks.map(({start,end}, i) => {
    const rowsHtml = rows.slice(start,end).map(r=>r.outerHTML).join('');
    const tableHtml = `<table class="print-table">${theadHtml}<tbody>${rowsHtml}</tbody></table>`;
    const topBlock = i === 0 ? (headerHtml + summaryHtmlStr) : '';
    const isLast = i === totalPages - 1;
    const footer = totalPages > 1 ? `<div class="pdf-page-footer">ໜ້າ ${i+1}/${totalPages}</div>` : '';
    return `${topBlock}${tableHtml}${isLast ? afterTableHtml : ''}${footer}`;
  });
}

let currentPdfPreviewTitle = '';
function showPdfPreview(title, bodyHtml, customHeaderHtml){
  const root = document.getElementById('pdf-preview-root');
  if(!root) return;
  currentPdfPreviewTitle = title;
  const now = new Date().toLocaleString('lo-LA');
  const headerHtml = customHeaderHtml !== undefined ? customHeaderHtml : `
    <div class="print-header">
      ${logoImg ? `<img src="${logoImg}" class="print-logo">` : ''}
      <div>
        <h1>ຄັງເສື້ອຜ້າ</h1>
        <p>${esc(title)}</p>
        <p class="print-date">ສ້າງເມື່ອ: ${esc(now)}</p>
      </div>
    </div>
  `;
  const pagesHtml = buildPaginatedPdfPages(headerHtml, bodyHtml)
    .map(pageInner => `<div class="pdf-page">${pageInner}</div>`)
    .join('');
  root.innerHTML = `
    <div class="pdf-preview-overlay" id="pdf-preview-overlay">
      <div class="pdf-preview-topbar">
        <h3>${esc(title)}</h3>
        <button type="button" class="pdf-preview-close-btn" id="pdf-preview-close">${ICONS.x}</button>
      </div>
      <div class="pdf-preview-scroll" id="pdf-preview-scroll">
        <div class="pdf-preview-sizer" id="pdf-preview-sizer">
          <div class="pdf-pages-stack" id="pdf-pages-stack">
            ${pagesHtml}
          </div>
        </div>
      </div>
      <div class="pdf-preview-bottom-bar" id="pdf-preview-bottom-bar">
        <button type="button" class="pdf-preview-icon-btn pdf-preview-download-btn" id="pdf-preview-download-btn" title="ບັນທຶກເປັນ PDF ລົງເຄື່ອງ"><img src="${PDF_ICON}" alt="PDF"></button>
      </div>
    </div>
  `;
  document.getElementById('pdf-preview-close').addEventListener('click', closePdfPreview);
  document.getElementById('pdf-preview-overlay').addEventListener('click', e=>{ if(e.target.id === 'pdf-preview-overlay') closePdfPreview(); });
  document.getElementById('pdf-preview-download-btn').addEventListener('click', downloadPdfPreview);
  fitPdfPreviewScale();
  pdfPreviewResizeHandler = fitPdfPreviewScale;
  window.addEventListener('resize', pdfPreviewResizeHandler);
  prepareBackgroundPdf();
}

function fitPdfPreviewScale(){
  const scroll = document.getElementById('pdf-preview-scroll');
  const sizer = document.getElementById('pdf-preview-sizer');
  const stack = document.getElementById('pdf-pages-stack');
  if(!scroll || !sizer || !stack) return;
  stack.style.transform = 'translateX(-50%) scale(1)';
  const naturalWidth = stack.offsetWidth;
  const naturalHeight = stack.offsetHeight;
  const availWidth = scroll.clientWidth;
  const scale = Math.min(1, availWidth / naturalWidth);
  stack.style.transform = `translateX(-50%) scale(${scale})`;
  sizer.style.width = (naturalWidth * scale) + 'px';
  sizer.style.height = (naturalHeight * scale) + 'px';
}

function closePdfPreview(){
  const root = document.getElementById('pdf-preview-root');
  if(root) root.innerHTML = '';
  if(pdfPreviewResizeHandler){ window.removeEventListener('resize', pdfPreviewResizeHandler); pdfPreviewResizeHandler = null; }
  pdfPreviewDocPromise = null;
}

/* ---------- ບັນທຶກ / ແຊຣ໌ PDF ຈິງ (ໃຊ້ html2canvas + jsPDF) ----------
   ໄຟລ໌ PDF ຈະຖືກສ້າງລ່ວງໜ້າຢູ່ເບື້ອງຫຼັງທັນທີທີ່ pop up ເປີດຂຶ້ນ (prepareBackgroundPdf),
   ເພື່ອໃຫ້ການກົດປຸ່ມບັນທຶກ/ແຊຣ໌ພ້ອມທັນທີ ບໍ່ຕ້ອງລໍສ້າງໄຟລ໌ຊ້ຳຄືນໃໝ່ຕອນກົດ. */
let pdfPreviewDocPromise = null;

function loadExternalScript(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load-failed'));
    document.head.appendChild(s);
  });
}

async function ensurePdfLibs(){
  if(window.jspdf && window.html2canvas) return true;
  try{
    await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    return !!(window.jspdf && window.html2canvas);
  }catch(e){ return false; }
}

function pdfPreviewFileName(){
  const base = (currentPdfPreviewTitle || 'ລາຍງານ').replace(/[\\/:*?"<>|]/g, '').trim() || 'ລາຍງານ';
  return base + '.pdf';
}

async function buildPdfDocument(){
  const liveStack = document.getElementById('pdf-pages-stack');
  if(!liveStack) return null;
  // Render from an off-screen CLONE, never touching the live, on-screen stack.
  // This used to reset the VISIBLE stack's transform to 'none' to capture
  // true-to-scale canvases, which made the open popup visibly flash to full,
  // unscaled, off-center A4 size for the whole rasterization duration — very
  // noticeable now that this runs automatically in the background the instant
  // the popup opens (prepareBackgroundPdf). Cloning keeps the visible page
  // untouched throughout, however long html2canvas takes.
  const clone = liveStack.cloneNode(true);
  clone.id = 'pdf-pages-stack-clone';
  clone.style.position = 'fixed';
  clone.style.left = '-99999px';
  clone.style.top = '0';
  clone.style.transform = 'none';
  document.body.appendChild(clone);
  try{
    const pages = Array.from(clone.querySelectorAll('.pdf-page'));
    if(!pages.length) return null;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    for(let i=0;i<pages.length;i++){
      const canvas = await window.html2canvas(pages[i], { scale:2, backgroundColor:'#ffffff', useCORS:true });
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if(i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    }
    return pdf;
  } finally {
    document.body.removeChild(clone);
  }
}

function setPdfPreviewButtonsBusy(busy){
  const dl = document.getElementById('pdf-preview-download-btn');
  if(dl) dl.disabled = busy;
}

/* ເລີ່ມສ້າງໄຟລ໌ PDF ໄວ້ລ່ວງໜ້າທັນທີທີ່ popup ເປີດ (ບໍ່ລໍຖ້າຜູ້ໃຊ້ກົດປຸ່ມ) */
function prepareBackgroundPdf(){
  setPdfPreviewButtonsBusy(true);
  pdfPreviewDocPromise = (async () => {
    const ok = await ensurePdfLibs();
    if(!ok) throw new Error('libs-failed');
    const pdf = await buildPdfDocument();
    if(!pdf) throw new Error('build-failed');
    return pdf;
  })();
  pdfPreviewDocPromise
    .catch(()=>{ /* ຄວາມຜິດພາດຈະຖືກຈັດການຕອນຜູ້ໃຊ້ກົດປຸ່ມ (ລອງສ້າງຄືນໃໝ່) */ })
    .finally(()=>{ setPdfPreviewButtonsBusy(false); });
}

/* ໃຫ້ໄຟລ໌ທີ່ພ້ອມແລ້ວ (ຈາກ background) ຫຼືລອງສ້າງຄືນໃໝ່ຖ້າຄັ້ງກ່ອນລົ້ມເຫຼວ (ເຊັ່ນຕອນນັ້ນອອບໄລນ໌) */
async function getReadyPdfDoc(){
  if(pdfPreviewDocPromise){
    try{ return await pdfPreviewDocPromise; }
    catch(e){ /* ລົ້ມເຫຼວ, ລອງສ້າງໃໝ່ລຸ່ມນີ້ */ }
  }
  const ok = await ensurePdfLibs();
  if(!ok) return null;
  return await buildPdfDocument();
}

async function downloadPdfPreview(){
  const btn = document.getElementById('pdf-preview-download-btn');
  if(btn) btn.disabled = true;
  try{
    const pdf = await getReadyPdfDoc();
    if(!pdf){ showToast('ບໍ່ສາມາດສ້າງໄຟລ໌ PDF ໄດ້, ກະລຸນາເຊື່ອມຕໍ່ອິນເຕີເນັດແລ້ວລອງໃໝ່'); return; }
    pdf.save(pdfPreviewFileName());
    showToast('ບັນທຶກໄຟລ໌ PDF ລົງເຄື່ອງສຳເລັດ');
  }catch(e){
    showToast('ສ້າງໄຟລ໌ PDF ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  } finally {
    if(btn) btn.disabled = false;

}

/* ສ້າງ jsPDF ໂດຍກົງຈາກ header/body HTML ໃດໆ ໂດຍບໍ່ຕ້ອງເປີດ preview popup ກ່ອນ —
   ໃຊ້ສຳລັບປຸ່ມ PDF ດ່ວນ (ເຊັ່ນ ຢູ່ແຕ່ລະລາຍການໃນ "ເບິ່ງໃບສະເໜີລາຄາ") ທີ່ຕ້ອງການບັນທຶກລົງເຄື່ອງທັນທີ. */
async function buildPdfDocFromHtml(headerHtml, bodyHtml){
  const pagesHtml = buildPaginatedPdfPages(headerHtml, bodyHtml);
  const stack = document.createElement('div');
  stack.className = 'pdf-pages-stack';
  stack.style.position = 'fixed';
  stack.style.left = '-99999px';
  stack.style.top = '0';
  stack.style.transform = 'none';
  stack.innerHTML = pagesHtml.map(pageInner => `<div class="pdf-page">${pageInner}</div>`).join('');
  document.body.appendChild(stack);
  try{
    const pages = Array.from(stack.querySelectorAll('.pdf-page'));
    if(!pages.length) return null;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    for(let i=0;i<pages.length;i++){
      const canvas = await window.html2canvas(pages[i], { scale:2, backgroundColor:'#ffffff', useCORS:true });
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if(i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    }
    return pdf;
  } finally {
    document.body.removeChild(stack);
  }
}

/* ---------- ລ໋ອກ/ປົດລ໋ອກເອກະສານ (ປ້ອງກັນການແກ້ໄຂໂດຍບັງເອີນ ຫຼື ຈາກຄົນທີ່ບໍ່ໄດ້ຮັບອະນຸຍາດ) ----------
   ສະຖານະນີ້ຢູ່ໃນຄວາມຈຳຊົ່ວຄາວ (ບໍ່ໄດ້ບັນທຶກລົງ localStorage) ເພາະມັນມີອາຍຸແຄ່ 5 ນາທີ ຫຼັງຈາກນັ້ນຈະລ໋ອກຄືນອັດຕະໂນມັດ.
   ທຸກເອກະສານທີ່ບັນທຶກໄວ້ຈະລ໋ອກໄວ້ໂດຍຄ່າເລີ່ມຕົ້ນ (ຕ້ອງແຕະໜ່ວຍກຸນແຈ 2 ຄັ້ງຕິດກັນເພື່ອປົດລ໋ອກ). */
const QUOTE_LOCK_TIMEOUT_MS = 5 * 60 * 1000;
let quoteUnlockedIds = {};   // id -> true ໃນຂະນະທີ່ປົດລ໋ອກຢູ່
let quoteLockTimers = {};    // id -> setTimeout handle ສຳລັບການລ໋ອກຄືນອັດຕະໂນມັດ
let quoteLastTapAt = {};     // id -> timestamp ຂອງການແຕະຄັ້ງກ່ອນ (ສຳລັບກວດ double-tap)

function isQuoteUnlocked(id){ return !!quoteUnlockedIds[id]; }

/* ວາງໜ້າ list ຄືນໃໝ່ ສະເພາະຕອນທີ່ pop up ນັ້ນເປີດຢູ່ຈິງໆ — ຖ້າບໍ່ດັ່ງນັ້ນ ການລ໋ອກຄືນອັດຕະໂນມັດ
   (ຊຶ່ງອາດເກີດຂຶ້ນຫຼັງຈາກຜູ້ໃຊ້ອອກຈາກໜ້ານີ້ໄປແລ້ວ) ຈະໄປເປີດ pop up ຄືນໂດຍບໍ່ຕັ້ງໃຈ. */
function refreshQuoteListIfOpen(){
  if(document.getElementById('quote-list-overlay')) renderQuoteListModal();
}

function scheduleQuoteAutoLock(id){
  if(quoteLockTimers[id]) clearTimeout(quoteLockTimers[id]);
  quoteLockTimers[id] = setTimeout(()=>{
    delete quoteUnlockedIds[id];
    delete quoteLockTimers[id];
    refreshQuoteListIfOpen();
  }, QUOTE_LOCK_TIMEOUT_MS);
}

function unlockQuoteRecord(id){
  quoteUnlockedIds[id] = true;
  scheduleQuoteAutoLock(id);
  showToast('ປົດລ໋ອກແລ້ວ, ສາມາດແກ້ໄຂໄດ້ພາຍໃນ 5 ນາທີ');
  refreshQuoteListIfOpen();
}

function lockQuoteRecord(id){
  delete quoteUnlockedIds[id];
  if(quoteLockTimers[id]){ clearTimeout(quoteLockTimers[id]); delete quoteLockTimers[id]; }
  refreshQuoteListIfOpen();
}

function handleQuoteLockTap(id){
  const now = Date.now();
  const last = quoteLastTapAt[id] || 0;
  if(now - last < 400){
    quoteLastTapAt[id] = 0;
    if(isQuoteUnlocked(id)) lockQuoteRecord(id);
    else unlockQuoteRecord(id);
  } else {
    quoteLastTapAt[id] = now;
  }
}

function numberToLaoWords(num){
  num = Math.round(Number(num) || 0);
  if(num === 0) return 'ສູນ';
  const digitWords = ['ສູນ','ໜຶ່ງ','ສອງ','ສາມ','ສີ່','ຫ້າ','ຫົກ','ເຈັດ','ແປດ','ເກົ້າ'];
  function readUpTo999(n){
    let out = '';
    const h = Math.floor(n/100);
    const rem = n%100;
    const t = Math.floor(rem/10);
    const o = rem%10;
    if(h>0) out += digitWords[h] + 'ຮ້ອຍ';
    if(t>0){
      if(t===1) out += 'ສິບ';
      else if(t===2) out += 'ຊາວ';
      else out += digitWords[t] + 'ສິບ';
    }
    if(o>0){
      out += (t>0 && o===1) ? 'ເອັດ' : digitWords[o];
    }
    return out;
  }
  // ຮູບແບບການອ່ານ: ລ້ານ (1,000,000) → ແສນ (100,000) → [ຕົວເລກ]ພັນ (ຫຼັກພັນ-ໝື່ນ ລວມກັນ ອ່ານເປັນ "...ພັນ")
  // → ຫຼັກຮ້ອຍ/ສິບ/ໜ່ວຍ ປົກກະຕິ. ຕົວຢ່າງ: 2,850,000 → ສອງລ້ານແປດແສນຫ້າສິບພັນ (ບໍ່ແມ່ນ ...ແປດຮ້ອຍຫ້າສິບພັນ)
  function readMillionsPart(m){
    if(m < 1000) return readUpTo999(m);
    const billions = Math.floor(m/1000);
    const rem = m % 1000;
    let out = readUpTo999(billions) + 'ພັນ';
    if(rem > 0) out += readUpTo999(rem);
    return out;
  }
  const n = Math.abs(num);
  const millions = Math.floor(n / 1000000);
  const remainder1 = n % 1000000;
  const hundredThousands = Math.floor(remainder1 / 100000);
  const remainder2 = remainder1 % 100000;
  const thousandsGroup = Math.floor(remainder2 / 1000); // 0-99
  const units = remainder2 % 1000; // 0-999

  let out = '';
  if(millions > 0) out += readMillionsPart(millions) + 'ລ້ານ';
  if(hundredThousands > 0) out += digitWords[hundredThousands] + 'ແສນ';
  if(thousandsGroup > 0) out += readUpTo999(thousandsGroup) + 'ພັນ';
  if(units > 0) out += readUpTo999(units);

  return (num < 0 ? 'ລົບ' : '') + out;
}

let quoteFormState = null;

function openQuoteModal(existingRecord){
  if(existingRecord){
    quoteFormState = {
      id: existingRecord.id,
      docType: existingRecord.docType || 'quote',
      docNumber: existingRecord.docNumber != null ? String(existingRecord.docNumber) : '',
      date: existingRecord.date || new Date().toISOString().slice(0,10),
      shopName: existingRecord.shopName || '',
      shopAddress: existingRecord.shopAddress || '',
      shopPhone: existingRecord.shopPhone || '',
      shopEmail: existingRecord.shopEmail || '',
      logo: existingRecord.logo || null,
      signer: existingRecord.signer || '',
      items: Array.isArray(existingRecord.items) && existingRecord.items.length
        ? existingRecord.items.map(it => ({ name:it.name||'', size:it.size||'', qty:String(it.qty!=null?it.qty:''), price:String(it.price!=null?it.price:'') }))
        : [ blankQuoteItem() ]
    };
    renderQuoteModal();
    return;
  }
  const saved = loadQuoteShopInfo();
  quoteFormState = {
    id: null,
    docType: 'quote',
    docNumber: nextQuoteDocNumber(),
    date: new Date().toISOString().slice(0,10),
    shopName: saved.shopName != null ? saved.shopName : 'MEN SHOP OFFICIAL',
    shopAddress: saved.shopAddress != null ? saved.shopAddress : '',
    shopPhone: saved.shopPhone != null ? saved.shopPhone : '',
    shopEmail: saved.shopEmail != null ? saved.shopEmail : '',
    logo: saved.logo != null ? saved.logo : (logoImg || null),
    signer: saved.signer != null ? saved.signer : '',
    items: [ blankQuoteItem() ]
  };
  renderQuoteModal();
}

            </div>

      const field = e.target.dataset.field;
      if(!quoteFormState.items[idx]) return;
      quoteFormState.items[idx][field] = e.target.value;
      if(field === 'name'){

        }

  });

      const idx = Number(e.currentTarget.dataset.idx);
      if(quoteFormState.items.length <= 1){
        quoteFormState.items[0] = blankQuoteItem();
      } else {
        quoteFormState.items.splice(idx, 1);
      }
      renderQuoteModal();
    });
  });

  document.getElementById('q-generate-btn').addEventListener('click', saveQuoteRecord);
