<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ຄັງເສື້ອຜ້າ - ຈັດການສະຕັອກ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2B33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ຄັງເສື້ອຜ້າ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EF; --dark:#1C2B33; --accent:#E8A33D; --danger:#B94A3D; --success:#4C7A5E;
    --dark-5:rgba(28,43,51,.05); --dark-8:rgba(28,43,51,.08); --dark-10:rgba(28,43,51,.10);
    --dark-15:rgba(28,43,51,.15); --dark-40:rgba(28,43,51,.40); --dark-50:rgba(28,43,51,.50);
    --dark-60:rgba(28,43,51,.60); --danger-10:rgba(185,74,61,.10); --success-10:rgba(76,122,94,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#E7E3D8; font-family:'Noto Sans Lao','Noto Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--dark);
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:150px; box-shadow:0 0 40px rgba(0,0,0,.06);}
  .header{background:var(--dark); color:#fff; padding:28px 20px 20px; border-radius:0 0 24px 24px; box-shadow:0 4px 14px rgba(0,0,0,.15); background-size:cover; background-position:center; transition:background .2s;}
  .header-top{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .logo{width:36px; height:36px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--dark); overflow:hidden;}
  .logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .header h1{font-size:18px; font-weight:700; margin:0; line-height:1.2;}
  .header p{font-size:11px; color:rgba(255,255,255,.6); margin:2px 0 0;}
  .header-actions{display:flex; gap:8px; margin-left:auto; flex-shrink:0;}
  .header-icon-btn{width:36px; height:36px; border-radius:12px; background:rgba(255,255,255,.12); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex-shrink:0;}
  .header-icon-btn svg{width:17px; height:17px;}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .stat{background:rgba(255,255,255,.1); border-radius:12px; padding:8px 6px; text-align:center;}
  .stat.warn{background:var(--accent);}
  .stat-label{font-size:10px; color:rgba(255,255,255,.6);}
  .stat.warn .stat-label{color:rgba(28,43,51,.7);}
  .stat-value{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat.warn .stat-value{color:var(--dark);}
  .tabs{display:flex; gap:8px; padding:16px 20px 0;}
  .tab-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:10px 4px; border-radius:12px; font-size:12.5px; font-weight:600; border:1px solid var(--dark-10); background:#fff; color:var(--dark-60); cursor:pointer; white-space:nowrap;}
  .tab-btn.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .tab-btn svg{width:16px; height:16px;}
  .content{padding:16px 20px 0;}
  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--dark-40);}
  .search-wrap input{width:100%; background:#fff; border:1px solid var(--dark-10); border-radius:12px; padding:10px 40px 10px 34px; font-size:14px; outline:none; font-family:inherit;}
  .search-scan-btn{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:8px; background:var(--dark-5); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .search-scan-btn svg{width:14px; height:14px; color:var(--dark-60);}
  .search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,163,61,.25);}
  .search-row{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .search-row .search-wrap{flex:1; margin-bottom:0;}
  .view-toggle{display:flex; gap:6px; flex-shrink:0;}
  .view-btn{width:38px; height:38px; border-radius:12px; border:1px solid var(--dark-10); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--dark-60);}
  .view-btn.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .view-btn svg{width:16px; height:16px;}
  .grid-container{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid-card{background:#fff; border-radius:16px; border:1px solid var(--dark-8); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; text-align:left; cursor:pointer; padding:0; font-family:inherit; display:block; width:100%; position:relative;}
  .grid-img{width:100%; aspect-ratio:1/1; background:var(--dark-5); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:pointer;}
  .grid-img img{width:100%; height:100%; object-fit:cover;}
  .grid-img svg{width:24px; height:24px; color:var(--dark-15);}
  .grid-low-badge{position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%; background:var(--danger); display:flex; align-items:center; justify-content:center;}
  .grid-dup-btn{position:absolute; left:8px; bottom:8px; top:auto; transform:none; opacity:.85; background:#9AC93B; color:#1B4D2E; border:none; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(0,0,0,.25); display:flex; align-items:center; gap:4px; z-index:2;}
  .grid-dup-btn svg{width:12px; height:12px;}
  .buy-btn, .sell-btn{background:var(--success); color:#fff; border:none; border-radius:999px; padding:8px 13px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 3px 10px rgba(0,0,0,.28); display:flex; align-items:center; gap:5px; white-space:nowrap;}
  .buy-btn{background:var(--accent); color:var(--dark);}
  .buy-btn svg, .sell-btn svg{width:14px; height:14px;}
  .sell-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--dark-5);}
  .sell-row:last-child{border-bottom:none;}
  .sell-row-info{display:flex; flex-direction:column; gap:1px;}
  .sell-size{font-size:13px; font-weight:600; color:var(--dark);}
  .sell-qty-input{width:68px; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:14px; text-align:center; outline:none; font-family:inherit;}
  .sell-qty-input:focus{border-color:var(--success); box-shadow:0 0 0 3px rgba(76,122,94,.2);}
  .grid-low-badge svg{width:11px; height:11px; color:#fff;}
  .grid-body{padding:10px 10px 40px; cursor:pointer;}
  .grid-title{font-size:13px; font-weight:600; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grid-sub{font-size:10px; color:var(--dark-40); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .grid-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; min-height:18px;}
  .grid-qty-badge{position:absolute; right:8px; bottom:8px; background:var(--accent); color:var(--dark); font-weight:700; font-size:13px; font-family:monospace; padding:4px 12px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.18); display:flex; align-items:baseline; gap:3px; z-index:2;}
  .grid-qty-badge small{font-family:'Noto Sans Lao','Noto Sans',system-ui,sans-serif; font-weight:600; font-size:10px;}
  .grid-copy-btn{position:absolute; right:8px; bottom:40px; width:28px; height:28px; border-radius:50%; background:var(--dark); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.25); z-index:2;}
  .grid-copy-btn svg{width:14px; height:14px;}
  .grid-copy-btn:active{filter:brightness(1.2);}
  .grid-cart-btn{position:absolute; left:8px; bottom:8px; width:32px; height:32px; border-radius:50%; background:#2F6FED; color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 10px rgba(47,111,237,.5); z-index:3;}
  .grid-cart-btn svg{width:16px; height:16px;}
  .grid-cart-btn:active{filter:brightness(1.15);}
  .grid-cart-btn.disabled{background:#9AA3AF; box-shadow:none; cursor:not-allowed; opacity:.65;}
  .grid-addcart-btn{position:absolute; left:8px; bottom:8px; width:32px; height:32px; border-radius:50%; background:#9AC93B; opacity:0; color:#1B4D2E; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 10px rgba(154,201,59,.5); z-index:2; pointer-events:none; transition:left .22s ease, opacity .22s ease;}
  .grid-addcart-btn.revealed{left:48px; opacity:.85; pointer-events:auto;}
  .grid-addcart-btn svg{width:16px; height:16px;}
  .grid-addcart-btn:active{filter:brightness(1.1);}
  .grid-addcart-btn.disabled{background:#9AA3AF; box-shadow:none; cursor:not-allowed; pointer-events:none;}
  .input-error{border:1px solid var(--danger) !important; background:rgba(217,83,79,.08);}
  .card-copy-btn{width:32px; height:32px; border-radius:10px; background:var(--dark); color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .card-copy-btn svg{width:15px; height:15px;}
  .icon-btn-sm{width:32px; height:32px; border-radius:10px; background:var(--danger-10); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .order-icon-btn{background:none; border:none; padding:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .order-icon-btn svg{width:20px; height:20px;}
  .icon-btn-sm svg{width:14px; height:14px; color:var(--danger);}
  .detail-img{width:100%; aspect-ratio:1/1; max-height:260px; border-radius:16px; background:var(--dark-5); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .detail-img img{width:100%; height:100%; object-fit:cover;}
  .detail-img svg{width:40px; height:40px; color:var(--dark-15);}
  .empty{text-align:center; padding:60px 0;}
  .empty svg{width:36px; height:36px; color:var(--dark-15); margin-bottom:8px;}
  .empty p{font-size:13px; color:var(--dark-50); margin:0;}
  .card{position:relative; background:#fff; border-radius:16px; border:1px solid var(--dark-8); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; margin-bottom:10px;}
  .card-strip{position:absolute; left:0; top:0; bottom:0; width:6px;}
  .card-row{padding:12px 12px 12px 16px; display:flex; align-items:center; gap:12px;}
  .thumb{width:56px; height:56px; border-radius:12px; background:var(--dark-5); overflow:hidden; flex-shrink:0; border:none; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb svg{width:20px; height:20px; color:var(--dark-15);}
  .card-main{flex:1; min-width:0; text-align:left; background:none; border:none; padding:0; cursor:pointer; font-family:inherit;}
  .card-title{display:flex; align-items:center; gap:6px;}
  .card-title span{font-weight:600; font-size:14px; color:var(--dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-title svg{width:13px; height:13px; color:var(--danger); flex-shrink:0;}
  .card-sub{font-size:11px; color:var(--dark-40); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .cat-card{display:block; width:100%; text-align:left; cursor:pointer;}
  .cat-card:active{background:var(--dark-5);}
  .cat-cover{width:56px; height:56px; border-radius:12px; overflow:hidden; flex-shrink:0; display:grid; gap:2px; background:var(--dark-8);}
  .cat-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .cat-cover-1{grid-template-columns:1fr; grid-template-rows:1fr;}
  .cat-cover-2{grid-template-columns:1fr 1fr; grid-template-rows:1fr;}
  .cat-cover-3{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
  .cat-cover-3 img:first-child{grid-row:1 / 3;}
  .cat-cover-4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
  .cat-chevron{width:18px; height:18px; color:var(--dark-20); flex-shrink:0;}
  .cat-chevron svg{width:100%; height:100%;}
  .cat-detail-header{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cat-back-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--dark-8); background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; color:var(--dark);}
  .cat-back-btn svg{width:18px; height:18px;}
  .cat-detail-title{flex:1; min-width:0;}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .tag{font-size:10px; font-weight:600; font-family:monospace; padding:2px 6px; border-radius:6px; background:var(--success-10); color:var(--success);}
  .tag.low{background:var(--danger-10); color:var(--danger);}
  .card-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  .card-total{font-family:monospace; font-weight:700; font-size:18px; color:var(--dark);}
  .chevron-btn{background:none; border:none; cursor:pointer; padding:2px;}
  .chevron-btn svg{width:16px; height:16px; color:var(--dark-40); transition:transform .2s;}
  .chevron-btn.open svg{transform:rotate(180deg);}
  .expand-panel{padding:2px 16px 12px; border-top:1px solid var(--dark-5);}
  .variant-row{display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:6px 10px; margin-top:6px;}
  .variant-size{font-size:12px; font-weight:600; width:56px;}
  .stepper{display:flex; align-items:center; gap:8px;}
  .step-btn{width:24px; height:24px; border-radius:6px; background:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .step-btn svg{width:12px; height:12px; color:var(--dark);}
  .step-val{font-family:monospace; font-size:13px; width:22px; text-align:center;}
  .row-actions{display:flex; gap:8px; margin-top:10px;}
  .row-actions button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; border-radius:10px; font-size:12px; font-weight:600; border:none; cursor:pointer; font-family:inherit;}
  .row-actions button svg{width:12px; height:12px;}
  .btn-edit{background:var(--dark); color:#fff;}
  .btn-del{background:var(--danger); color:#fff;}
  .report-card{background:#fff; border-radius:16px; border:1px solid var(--dark-8); padding:16px; margin-bottom:12px; overflow:hidden;}
  .report-label{font-size:12px; color:var(--dark-50); margin:0 0 4px;}
  .report-value{font-size:24px; font-weight:700; font-family:monospace; margin:0;}
  .report-value small{font-size:13px; font-weight:400; color:var(--dark-50); font-family:inherit;}
  .report-sub{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--dark-60);}
  .report-head{display:flex; align-items:center; gap:6px; margin-bottom:12px;}
  .report-card-header{margin:-16px -16px 12px; padding:13px 16px; border-radius:15px 15px 0 0; background:var(--dark); display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; row-gap:8px;}
  .report-card-header .report-head{margin-bottom:0; color:#fff; font-weight:600; font-size:14px;}
  .report-card-header .report-head svg{color:var(--accent);}
  .report-card-header p{color:#fff; margin:0; font-size:14px; font-weight:600;}
  .report-card-header .pdf-btn{background:#9AC93B; color:var(--dark);}
  .report-card-header .header-select{background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:4px 4px; font-size:10px; font-weight:600; font-family:inherit; outline:none; max-width:78px; flex-shrink:1;}
  .report-card-header .header-select option{color:var(--dark);}
  .report-card-header-row{display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto;}
  .report-card-header-row span{color:#fff; font-weight:600; font-size:14px; white-space:nowrap; flex-shrink:0;}
  .report-head svg{width:15px; height:15px; color:var(--danger);}
  .report-head span{font-size:14px; font-weight:600;}
  .low-item, .stock-item{display:flex; align-items:center; justify-content:space-between; font-size:13px; border-bottom:1px solid var(--dark-5); padding:8px 0;}
  .low-item:last-child, .stock-item:last-child{border-bottom:none; padding-bottom:0;}
  .muted{color:var(--dark-40); font-size:11px;}
  .fab, .fab-manage, .fab-cat-add{position:fixed; bottom:30px; width:58px; height:58px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 0 0 6px #fff, 0 8px 18px rgba(0,0,0,.28); transition:left .45s cubic-bezier(.34,1.3,.64,1), right .45s cubic-bezier(.34,1.3,.64,1), transform .45s cubic-bezier(.34,1.3,.64,1), box-shadow .3s ease;}
  .fab{left:50%; transform:translateX(-50%); background:var(--accent); z-index:20;}
  .fab:disabled{opacity:.55; cursor:not-allowed;}
  .fab-manage{left:50%; right:auto; transform:translateX(-50%) translate(6px,4px) scale(.92); background:var(--danger); z-index:19; display:none;}
  .fab-cat-add{left:50%; right:auto; transform:translateX(-50%) translate(-6px,4px) scale(.92); background:#9AC93B; z-index:19; display:none;}
  .fab-manage.show, .fab-cat-add.show{display:flex;}
  .fab-anchor.expanded .fab-manage{left:auto; right:24px; transform:none;}
  .fab-anchor.expanded .fab-cat-add{left:24px; right:auto; transform:none;}
  @keyframes fabIdleGlow{
    0%, 100%{ box-shadow:0 6px 16px rgba(0,0,0,.25); }
    50%{ box-shadow:0 9px 22px rgba(0,0,0,.35); }
  }
  .fab-manage:active, .fab-cat-add:active{ filter:brightness(.9); }
  .fab-manage svg, .fab-cat-add svg{width:20px; height:20px; color:#fff;}
  .fab-label{position:fixed; left:-48px; bottom:30px; pointer-events:none; z-index:14; display:none; opacity:0; transition:opacity .25s ease;}
  .fab-manage-label{position:fixed; right:-48px; left:auto; bottom:30px; pointer-events:none; z-index:14; display:none; opacity:0; transition:opacity .25s ease;}
  .fab-label.show, .fab-manage-label.show{display:block;}
  .fab-anchor.expanded .fab-label.show, .fab-anchor.expanded .fab-manage-label.show{opacity:1; transition-delay:.2s;}
  .fab svg{width:26px; height:26px; color:var(--dark);}
  .fab svg{transition:transform .3s ease;}
  .fab.menu-open svg{transform:rotate(45deg);}
  .fab-anchor{max-width:480px; margin:0 auto; position:relative;}

  /* ---------- HOME-TAB RADIAL SPEED-DIAL MENU ---------- */
  .home-fab-menu{display:none;}
  .home-fab-menu.show{display:block;}
  .home-fab-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.15); z-index:18; opacity:0; pointer-events:none; transition:opacity .25s ease;}
  .home-fab-menu.open .home-fab-backdrop{opacity:1; pointer-events:auto;}
  .arc-btn{position:fixed; left:50%; bottom:37px; width:44px; height:44px; border-radius:50%; background:var(--accent); border:none; box-shadow:0 4px 14px rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--dark); z-index:19; opacity:0; pointer-events:none; transform:translate(-50%,0) scale(0); transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;}
  .arc-btn svg{width:19px; height:19px;}
  .home-fab-menu.open .arc-btn{opacity:1; pointer-events:auto;}
  .home-fab-menu.open .arc-btn.arc-1{transform:translate(calc(-50% - 95px), 0) scale(1); transition-delay:.02s;}
  .home-fab-menu.open .arc-btn.arc-2{transform:translate(calc(-50% - 67px), -67px) scale(1); transition-delay:.06s;}
  .home-fab-menu.open .arc-btn.arc-3{transform:translate(-50%, -95px) scale(1); transition-delay:.10s;}
  .home-fab-menu.open .arc-btn.arc-4{transform:translate(calc(-50% + 67px), -67px) scale(1); transition-delay:.06s;}
  .home-fab-menu.open .arc-btn.arc-5{transform:translate(calc(-50% + 95px), 0) scale(1); transition-delay:.02s;}
  .bottom-nav{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:#fff; border-radius:22px 22px 0 0; box-shadow:0 -6px 20px rgba(0,0,0,.10); border-top:2px solid var(--accent); padding:9px 10px calc(9px + env(safe-area-inset-bottom)); display:flex; align-items:flex-start; justify-content:space-between; z-index:17;}
  .bn-item{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 2px; cursor:pointer; color:var(--dark-40); font-family:inherit; flex:1; min-width:0;}

  /* ---------- TABLET (PORTRAIT / MID-WIDTH) LAYOUT ---------- */
  /* Covers the gap between phones and the 860px+ desktop layout below, so tablets of
     any size (portrait iPad/Android tablets typically fall in ~600-859px) use their
     full width instead of showing the narrow 480px phone column with empty margins. */
  @media (min-width: 600px) and (max-width: 859px){
    body{ background:#E5E1D5; }
    #app{ max-width:94vw; padding-bottom:120px; box-shadow:0 0 40px rgba(0,0,0,.06); }
    .header{ padding:26px 28px 20px; }
    .header-top{ max-width:640px; }
    .stats{ max-width:520px; }
    .tabs{ padding:16px 28px 0; }
    .content{ padding:16px 28px 0; }
    .search-row{ max-width:480px; }

    .grid-container{ grid-template-columns:repeat(auto-fill, minmax(170px,1fr)) !important; gap:12px; }
    #list-items:not(.grid-container){ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:10px; align-items:start; }
    #list-items:not(.grid-container) .card{ margin-bottom:0; }

    /* Report tab intentionally stays single-column (same as mobile) at every screen
       size, per explicit request — a stacked list reads cleaner/more professional
       than a 2-up grid, so .report-grid keeps its normal block flow here. */
    .report-grid{ max-width:600px; margin:0 auto; }

    .fab-anchor{ max-width:94vw; margin:0 auto; position:relative; }
    .bottom-nav{ max-width:94vw; }
    .overlay.center{ padding:0 40px; }
    .modal{ max-width:600px; }
  }

  /* ---------- DESKTOP / WIDE SCREEN LAYOUT ---------- */
  @media (min-width: 860px){
    body{ background:#E2DED2; }
    #app{ max-width:1240px; padding-bottom:60px; box-shadow:none; }
    .header{ border-radius:20px; max-width:1240px; margin:20px auto 0; padding:26px 32px 22px; }
    .header-top{ max-width:1000px; }
    .stats{ max-width:640px; }
    .tabs{ max-width:1240px; margin:16px auto 0; padding:0 32px; }
    .content{ max-width:1240px; margin:0 auto; padding:0 32px; }
    .search-row{ max-width:520px; }

    #list-items{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px; align-items:start; }
    #list-items .card{ margin-bottom:0; }
    .grid-container{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)) !important; }

    /* Report tab stays single-column (same as mobile) at every screen size, per
       explicit request — a stacked list reads cleaner/more professional than a
       2-up grid, so .report-grid keeps its normal block flow here too. */
    .report-grid{ max-width:600px; margin:0 auto; }

    .fab-anchor{ max-width:1240px; margin:0 auto; position:relative; height:0; }
    .fab{ position:absolute; left:auto; right:32px; bottom:24px; transform:none; }
    .fab-label{ display:none !important; }
    .fab-manage{ position:absolute; left:auto; right:96px; bottom:24px; }
    .fab-cat-add{ position:absolute; left:auto; right:160px; bottom:24px; }
    .fab-manage-label{ display:none !important; }

    .overlay{ align-items:center; padding:24px; }
    .modal{ border-radius:20px; max-height:85vh; }
    #scanner-overlay{ padding:24px; }
    #scanner-overlay > div{ border-radius:20px; overflow:hidden; max-height:88vh; }

    .install-banner-wide{ text-align:center; }
  }
  @media (min-width: 860px) and (max-width: 1279px){

  }

  /* ---------- PDF EXPORT (print) ---------- */
  .pdf-btn{ display:flex; align-items:center; gap:5px; background:#9AC93B; color:var(--dark); border:none; padding:7px 12px; border-radius:10px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; flex-shrink:0; white-space:nowrap; }
  .pdf-btn svg{ width:13px; height:13px; }
  .print-only{ display:none; }
  .print-header{ display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-bottom:12px; border-bottom:2px solid #1C2B33; }
  .print-logo{ width:56px; height:56px; border-radius:10px; object-fit:cover; }
  .print-header h1{ margin:0; font-size:18px; }
  .print-header p{ margin:2px 0 0; font-size:12px; color:#555; }
  .print-date{ color:#999 !important; }
  .print-summary{ display:flex; gap:24px; margin-bottom:14px; }
  .print-summary span{ display:block; color:#777; font-size:11px; }
  .print-summary b{ font-size:16px; }
  .print-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .print-table th, .print-table td{ border:1px solid #ccc; padding:6px 8px; text-align:left; }
  .print-table th{ background:#f0eee7; }
  .print-table td.num, .print-table th.num{ text-align:right; font-family:monospace; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ position:absolute; left:0; top:0; width:100%; display:block !important; }
  }
</style>

<script>
const STORAGE_KEY = 'khang-sinkha-products-v1';
const SIZE_OPTIONS = ['S','M','L','XL','XXL','3XL','4XL','Free'];
const CATEGORIES_KEY = 'khang-sinkha-categories-v1';
let CATEGORIES = [];
try{ CATEGORIES = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || 'null') || ['ໝວດຊຸດໂຮງງານ', 'ໝວດຊຸດເຊບຕີ້']; }
catch(e){ CATEGORIES = ['ໝວດຊຸດໂຮງງານ', 'ໝວດຊຸດເຊບຕີ້']; }
function saveCategories(){ try{ localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }catch(e){} scheduleAutoSync(); }

const PURCHASE_ORDERS_KEY = 'khang-sinkha-purchase-orders-v1';
let purchaseOrders = [];
try{ purchaseOrders = JSON.parse(localStorage.getItem(PURCHASE_ORDERS_KEY) || '[]'); }catch(e){ purchaseOrders = []; }
function savePurchaseOrders(){ try{ localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }catch(e){} scheduleAutoSync(); }

const CUSTOMER_ORDERS_KEY = 'khang-sinkha-customer-orders-v1';
let customerOrders = [];
try{ customerOrders = JSON.parse(localStorage.getItem(CUSTOMER_ORDERS_KEY) || '[]'); }catch(e){ customerOrders = []; }
function saveCustomerOrders(){ try{ localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }catch(e){} scheduleAutoSync(); }
function findPendingOrder(code, size){
  return purchaseOrders.find(o => o.code === code && o.size === size);
}
/* ຫຼາຍລາຍການສັ່ງຊື້ອາດມີລະຫັດ+ຂະໜາດດຽວກັນໄດ້ (ແຍກກັນສະເໝີ) - ໃຊ້ອັນນີ້ເພື່ອລວມຍອດສະແດງ */
function sumPendingOrderQty(code, size){
  return purchaseOrders.filter(o => o.code === code && o.size === size).reduce((s,o)=>s+o.qty,0);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// One-time migration: old default unit "ໂຕ" renamed to "ລາຍການ"
(function migrateUnitLabel(){
  let changed = false;
  products = products.map(p => {
    if(p.unit === 'ໂຕ'){ changed = true; return { ...p, unit:'ລາຍການ' }; }
    return p;
  });

})();

// One-time migration: old default size "ທົ່ວໄປ" renamed to "ບໍລິການອື່ນ"
(function migrateDefaultSizeLabel(){
  let changed = false;
  products = products.map(p => {
    if(!Array.isArray(p.variants)) return p;
    let vChanged = false;
    const variants = p.variants.map(v => {
      if(v.size === 'ທົ່ວໄປ'){ vChanged = true; return { ...v, size:'ບໍລິການອື່ນ' }; }
      return v;
    });
    if(vChanged){ changed = true; return { ...p, variants }; }
    return p;
  });
  if(changed){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }catch(e){}
  }
})();

function withTotals(p){
  const totalQty = p.variants.reduce((s,v)=>s+v.qty,0);
  const lowVariants = p.variants.filter(v => v.qty <= p.minQty);
  return {...p, totalQty, lowVariants};
}

function showToast(msg){
  const root = document.getElementById('toast-root');
  root.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 1800);
}

/* ---------- CATEGORIES TAB ---------- */
function renderCategoriesTab(){
  const content = document.getElementById('content');
  const withT = products.map(withTotals);
  const map = {};
  withT.forEach(p=>{
    const cat = (p.category && p.category.trim()) ? p.category.trim() : 'ອື່ນໆ';
    if(!map[cat]) map[cat] = {count:0, qty:0, images:[]};
    map[cat].count++;
    map[cat].qty += p.totalQty;
    if(p.image && map[cat].images.length < 4) map[cat].images.push(p.image);
  });
  // Start from the master category list (so empty categories still show), then append any
  // extra categories found on products that aren't in the master list (e.g. legacy data).
  const extra = Object.keys(map).filter(c => !CATEGORIES.includes(c));
  const cats = [...CATEGORIES, ...extra.sort((a,b)=>a.localeCompare(b,'lo'))];
  if(cats.length === 0){
    content.innerHTML = `<div class="empty">${ICONS.grid}<p>ຍັງບໍ່ມີໝວດໝູ່ສິນຄ້າ</p></div>`;
    return;
  }
  content.innerHTML = cats.map(cat => {
    const info = map[cat] || {count:0, qty:0, images:[]};
    const cover = info.images.length > 0
      ? `<div class="cat-cover cat-cover-${info.images.length}">${info.images.map(src=>`<img src="${src}" alt="">`).join('')}</div>`
      : `<div class="thumb">${ICONS.grid}</div>`;
    return `
    <div class="card cat-card" data-action="open-category" data-cat="${esc(cat)}">
      <div class="card-row">
        ${cover}
        <div class="card-main" style="cursor:pointer; background:none; border:none; padding:0; text-align:left; font-family:inherit;">
          <div class="card-title"><span>${esc(cat)}</span></div>
          <div class="card-sub">${info.count} ລາຍການ &middot; ${info.qty} ຈຳນວນ</div>
          ${info.count === 0 ? `<div class="card-sub" style="color:var(--dark-30);">ຍັງບໍ່ມີສິນຄ້າ</div>` : ''}
        </div>
        <span class="cat-chevron">${ICONS.chevronRight}</span>
      </div>
    </div>
  `;
  }).join('');
}

function renderCategoryListItems(cat){
  const container = document.getElementById('list-items');
  if(!container) return;
  const filtered = products.map(withTotals).filter(p => {
    const pc = (p.category && p.category.trim()) ? p.category.trim() : 'ອື່ນໆ';
    return pc === cat;
  });
  if(filtered.length === 0){
    container.className = '';
    container.innerHTML = `<div class="empty">${ICONS.package}<p>ຍັງບໍ່ມີສິນຄ້າໃນໝວດໝູ່ນີ້, ຈະອັບເດດອັດຕະໂນມັດເມື່ອມີການເພີ່ມສິນຄ້າເຂົ້າ</p></div>`;
    return;
  }
  if(viewMode === 'grid'){
    container.className = 'grid-container';
    container.innerHTML = filtered.map(p => gridCardHtml(p)).join('');
  } else {
    container.className = '';
    container.innerHTML = filtered.map(p => cardHtml(p)).join('');
  }
}

function carrierLogoHtml(carrier){
  const src = CARRIER_LOGOS[carrier];
  if(!src) return '';
  return '<img src="' + src + '" alt="' + esc(carrier) + '" title="' + esc(carrier) + '" style="width:22px; height:22px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 1px rgba(0,0,0,.08); flex-shrink:0;">';
}

function branchInputPlaceholder(carrier){
  return BRANCH_DIRECTORIES[carrier] ? ('ຄົ້ນຫາສາຂາ' + carrier + '...') : 'ຊື່ ຫຼື ທີ່ຢູ່ສາຂາຂົນສົ່ງ';
}
function branchLabel(carrier, b){
  const cfg = BRANCH_DIRECTORIES[carrier];
  if(!cfg) return '';
  const [name, sub] = cfg.parts(b);
  return sub ? (name + ' — ' + sub) : name;
}
function searchCarrierBranches(carrier, query){
  const cfg = BRANCH_DIRECTORIES[carrier];
  if(!cfg) return [];
  const q = (query || '').trim().toLowerCase();
  if(!q) return cfg.data.slice(0, 40);
  const matches = cfg.data.filter(b => b.some(f => (f||'').toLowerCase().includes(q)));
  return matches.slice(0, 40);
}
function renderBranchSuggestions(listEl, carrier, query){
  if(!listEl) return;
  const cfg = BRANCH_DIRECTORIES[carrier];
  if(!cfg){ listEl.innerHTML = ''; listEl.style.display = 'none'; return; }
  const results = searchCarrierBranches(carrier, query);
  if(results.length === 0){ listEl.innerHTML = ''; listEl.style.display = 'none'; return; }
  listEl.innerHTML = results.map(b => {
    const [name, sub] = cfg.parts(b);
    return '<div class="branch-suggest-item" data-label="' + esc(branchLabel(carrier, b)) + '">' +
      '<span class="branch-suggest-name">' + esc(name) + '</span>' +
      (sub ? '<span class="branch-suggest-sub">' + esc(sub) + '</span>' : '') +
      '</div>';
  }).join('');
  listEl.style.display = 'block';
}
function setupBranchAutocomplete(inputId, listId, carrierGetter, onPick){
  const input = document.getElementById(inputId);
  const listEl = document.getElementById(listId);
  if(!input || !listEl) return;
  input.addEventListener('input', e=>{
    const carrier = carrierGetter();
    if(!BRANCH_DIRECTORIES[carrier]){ listEl.style.display = 'none'; return; }
    renderBranchSuggestions(listEl, carrier, e.target.value);
  });
  input.addEventListener('focus', e=>{
    const carrier = carrierGetter();
    if(!BRANCH_DIRECTORIES[carrier]){ return; }
    renderBranchSuggestions(listEl, carrier, e.target.value);
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{ listEl.style.display = 'none'; }, 150);
  });
  listEl.addEventListener('mousedown', e=>{
    const item = e.target.closest('.branch-suggest-item');
    if(!item) return;
    e.preventDefault();
    const label = item.dataset.label;
    input.value = label;
    onPick(label);
    listEl.style.display = 'none';
  });
}


/* ---------- STOCK LEDGER HELPER (used by customer-order create/edit/delete) ---------- */
/* delta ຕິດລົບ = ຕັດອອກຈາກສາງ (ຂາຍອອກ), delta ບວກ = ຄືນເຂົ້າສາງ (ຍົກເລີກ/ລຶບ/ແກ້ໄຂ) */
function adjustProductStock(productId, size, delta){
  products = products.map(pr => pr.id === productId
    ? { ...pr, variants: pr.variants.map(v => v.size === size ? { ...v, qty: Math.max(0, v.qty + delta) } : v) }
    : pr
  );
}
let cartState = null;
let revealedCartId = null; /* id ຂອງສິນຄ້າທີ່ປຸ່ມກະຕ່າກຳລັງກາງອອກຢູ່ (ຊ້ອນທັບກັນຕາມປົກກະຕິ) */
function openCartModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const totalQty = p.variants.reduce((s,v)=>s+v.qty,0);
  if(totalQty <= 0){ showToast('ສິນຄ້າໝົດ ບໍ່ສາມາດສັ່ງຊື້ໄດ້'); return; }
  cartState = { productId:id, quantities:{}, customerName:'', phone:'', shippingCarrier:'', shippingBranch:'' };
  p.variants.forEach(v=>{ cartState.quantities[v.id] = ''; });
  renderCartModal();
}
function closeCartModal(){ cartState = null; document.getElementById('cart-root').innerHTML=''; collapseCartReveal(); }
function collapseCartReveal(){
  if(revealedCartId === null) return;
  revealedCartId = null;
  const listEl = document.getElementById('list-items');
  if(listEl) renderListItems();
}
function renderCartModal(){
  const root = document.getElementById('cart-root');
  if(!cartState){ root.innerHTML=''; return; }
  const p = products.find(x=>x.id===cartState.productId);
  if(!p){ closeCartModal(); return; }
  const rows = p.variants.map(v => `
    <div class="sell-row">
      <div class="sell-row-info">
        <span class="sell-size">${esc(p.name)} (${esc(v.size)})</span>
        <span class="muted">ຄົງເຫຼືອ: ${v.qty}</span>
      </div>
      <input type="number" inputmode="numeric" min="0" max="${v.qty}" data-max="${v.qty}" placeholder="0" value="${esc(cartState.quantities[v.id])}" data-vid="${v.id}" class="sell-qty-input cart-qty-input">
    </div>
  `).join('');
  root.innerHTML = `
    <div class="overlay center" id="cart-overlay">
      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ສັ່ງຊື້ໃຫ້ລູກຄ້າ</p>
        <p class="desc" style="margin-bottom:12px;">ຊື່ສິນຄ້າ ແລະ ຂະໜາດຂ້າງລຸ່ມນີ້ບໍ່ສາມາດແກ້ໄຂໄດ້ — ໃສ່ພຽງຈຳນວນທີ່ລູກຄ້າຕ້ອງການ</p>
        <div id="cart-rows">${rows}</div>
        <div class="field" style="margin-top:12px;">
          <label>ຊື່ລູກຄ້າ *</label>
          <input id="cart-customer-name" value="${esc(cartState.customerName)}" placeholder="ຊື່ລູກຄ້າ">
        </div>
        <div class="field">
          <label>ເບີໂທລະສັບ *</label>
          <input id="cart-customer-phone" type="tel" value="${esc(cartState.phone)}" placeholder="020 xxxxxxxx">
        </div>
        <label style="font-size:12px; color:var(--dark-50); display:block; margin-bottom:4px;">ທີ່ຢູ່ຈັດສົ່ງ</label>
        <div class="field">
          <label>ເລືອກຂົນສົ່ງ *</label>
          <select id="cart-shipping-carrier">
            <option value="">-- ເລືອກຂົນສົ່ງ --</option>
            ${SHIPPING_CARRIERS.map(c => `<option value="${esc(c)}" ${cartState.shippingCarrier===c?'selected':''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0; position:relative;">

function confirmCartOrder(){
  const p = products.find(x=>x.id===cartState.productId);
  if(!p) return;
  const errorEl = document.getElementById('cart-error');
  const name = cartState.customerName.trim();
  const phone = cartState.phone.trim();
  const shippingCarrier = (cartState.shippingCarrier || '').trim();
  const shippingBranch = (cartState.shippingBranch || '').trim();
  if(!name){ errorEl.textContent = 'ກະລຸນາໃສ່ຊື່ລູກຄ້າ'; errorEl.style.display = 'block'; return; }
  if(!phone){ errorEl.textContent = 'ກະລຸນາໃສ່ເບີໂທລະສັບ'; errorEl.style.display = 'block'; return; }
  if(!shippingCarrier){ errorEl.textContent = 'ກະລຸນາເລືອກຂົນສົ່ງ'; errorEl.style.display = 'block'; return; }
  if(!shippingBranch){ errorEl.textContent = 'ກະລຸນາລະບຸທີ່ຢູ່ສາຂາ'; errorEl.style.display = 'block'; return; }

  const items = [];
  let insufficient = false;
  for(const v of p.variants){
    const n = parseInt(cartState.quantities[v.id], 10);
    if(!isNaN(n) && n > 0){
      if(n > v.qty){ insufficient = true; }
      items.push({ id:uid(), productId:p.id, productName:p.name, size:v.size, qty:n });
    }
  }
  if(items.length === 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນຢ່າງໜ້ອຍ 1 ຂະໜາດ'; errorEl.style.display = 'block'; return; }
  if(insufficient){ errorEl.textContent = 'ເຄື່ອງໃນສາງມີບໍ່ພໍ'; errorEl.style.display = 'block'; return; }

  /* ຕັດຍອດສິນຄ້າໃນສາງທັນທີ ຕາມຫຼັກການບັນຊີ (ຄົງເຫຼືອຕ້ອງອັບເດດທັນທີທີ່ອອກບິນຂາຍ) */
  items.forEach(it => adjustProductStock(it.productId, it.size, -it.qty));
  save();

  const phoneNorm = phone.toLowerCase();
  const existing = customerOrders.find(o => o.phone.trim().toLowerCase() === phoneNorm && o.status === 'pending');
  if(existing){
    customerOrders = customerOrders.map(o => o === existing
      ? { ...o, customerName:name, shippingCarrier, shippingBranch, items:[...o.items, ...items], updatedAt:new Date().toISOString() }
      : o);
    showToast('ເພີ່ມລາຍການເຂົ້າອໍເດີ້ເກົ່າຂອງ "' + name + '" ແລ້ວ');
  } else {
    customerOrders = [{
      id: uid(), phone, customerName:name, shippingCarrier, shippingBranch, items, status:'pending',
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    }, ...customerOrders];
    showToast('ບັນທຶກອໍເດີ້ຂອງ "' + name + '" ແລ້ວ');
  }
  saveCustomerOrders();
  closeCartModal();
  tab = 'orders';
  renderTabButtons();
  renderBottomNav();
  renderContent();
  updateFabStyle();
}

/* ໃຊ້ເພີ່ມສິນຄ້າໃສ່ບິນທີ່ອອກໄປແລ້ວແຕ່ຍັງຢູ່ສະຖານະ "ລໍຖ້າ" (ຍັງບໍ່ທັນຮັບອໍເດີ້) ໂດຍອີງໃສ່ເບີໂທເປັນ key */
let addCartState = null;
function openAddCartModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const totalQty = p.variants.reduce((s,v)=>s+v.qty,0);
  if(totalQty <= 0){ showToast('ສິນຄ້າໝົດ ບໍ່ສາມາດເພີ່ມໄດ້'); return; }
  addCartState = { productId:id, phone:'', quantities:{} };
  p.variants.forEach(v=>{ addCartState.quantities[v.id] = ''; });
  renderAddCartModal();
}
function closeAddCartModal(){ addCartState = null; document.getElementById('addcart-root').innerHTML=''; collapseCartReveal(); }
function renderAddCartModal(){

  root.innerHTML = `

      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ເພີ່ມເຂົ້າກະຕ່າ: ${esc(p.name)}</p>
        <p class="desc" style="margin-bottom:12px;">ໃສ່ເບີໂທລະສັບລູກຄ້າເພື່ອກວດສອບກັບບິນເກົ່າ (ບິນທີ່ຍັງລໍຖ້າ) ແລ້ວໃສ່ຈຳນວນທີ່ຕ້ອງການເພີ່ມ</p>
        <div class="field">
          <label>ເບີໂທລະສັບ *</label>
          <input id="addcart-phone" type="tel" value="${esc(addCartState.phone)}" placeholder="020 xxxxxxxx">
        </div>
        <div id="addcart-rows">${rows}</div>
        <p id="addcart-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="addcart-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="addcart-save-btn" style="background:var(--dark); color:#fff;">ບັນທຶກ</button>
        </div>

  `;

  document.getElementById('addcart-cancel-btn').addEventListener('click', closeAddCartModal);

  document.querySelectorAll('#addcart-rows .addcart-qty-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      addCartState.quantities[e.target.dataset.vid] = e.target.value;
      const max = parseInt(e.target.dataset.max, 10) || 0;
      const n = parseInt(e.target.value, 10);
      const errorEl = document.getElementById('addcart-error');
      if(!isNaN(n) && n > max){
        e.target.classList.add('input-error');
        errorEl.textContent = 'ສິນຄ້າມີບໍ່ພຽງພໍ';
        errorEl.style.display = 'block';
      } else {
        e.target.classList.remove('input-error');
        if(errorEl.textContent === 'ສິນຄ້າມີບໍ່ພຽງພໍ'){ errorEl.style.display = 'none'; errorEl.textContent = ''; }

  items.forEach(it => adjustProductStock(it.productId, it.size, -it.qty));

/* ---------- ORDER TOTAL CALCULATION ---------- */
/* ອໍເດີ້ທີ່ຍັງບໍ່ຮັບ: ຄິດໄລ່ຕາມລາຄາປັດຈຸບັນຂອງສິນຄ້າ (ປ່ຽນທັນທີຖ້າລາຄາ ຫຼື ຈຳນວນປ່ຽນ)
   ອໍເດີ້ທີ່ຮັບແລ້ວ: ຄິດໄລ່ຕາມລາຄາທີ່ຖືກບັນທຶກໄວ້ ຕອນກົດຮັບອໍເດີ້ (ລ໊ອກໄວ້ຖາວອນ ບໍ່ໃຫ້ບິນເກົ່າປ່ຽນແປງ) */
function getOrderItemPrice(o, it){
  if(o.status === 'accepted'){
    return typeof it.unitPrice === 'number' ? it.unitPrice : 0;
  }
  const p = products.find(x => x.id === it.productId);
  return p ? (Number(p.price) || 0) : (typeof it.unitPrice === 'number' ? it.unitPrice : 0);
}

/* ລາຍການ "ບໍລິການ" (ບໍ່ແມ່ນສິນຄ້າ) - ກຳນົດໂດຍລະຫັດສິນຄ້າ ຫຼື ຊື່ລາຍການ, ຈະບໍ່ຖືກນັບເປັນຈຳນວນສິນຄ້າຂາຍ,
   ບໍ່ນຳໄປຄິດເງື່ອນໄຂສົ່ງຟຣີ ແລະ ບໍ່ນຳໄປຄິດສ່ວນຫຼຸດ */
const SERVICE_ITEM_CODE = 'SPC00001';
const SERVICE_ITEM_NAME = 'ຖ່າສະຫຼິມ/ປັກແສ່ວ';
function isServiceItem(it){
  const p = products.find(pr => pr.id === it.productId);
  const code = p ? (p.code||'').trim() : '';
  return code === SERVICE_ITEM_CODE || (it.productName||'').trim() === SERVICE_ITEM_NAME;
}
/* ຈຳນວນສິນຄ້າແທ້ໆໃນບິນ (ບໍ່ນັບລາຍການບໍລິການ) - ໃຊ້ຄິດເງື່ອນໄຂສົ່ງຟຣີ ແລະ ສ່ວນຫຼຸດ */
function getOrderRealQty(o){
  return o.items.filter(it => !isServiceItem(it)).reduce((s,it)=>s+it.qty, 0);
}
/* ສ່ວນຫຼຸດອັດຕະໂນມັດ: ສິນຄ້າແທ້ 5-9 ລາຍການ = ຫຼຸດ 10,000 ກີບ/ລາຍການ, 10 ລາຍການຂຶ້ນໄປ = ຫຼຸດ 20,000 ກີບ/ລາຍການ */
function getOrderDiscountPerUnit(realQty){
  if(realQty >= 10) return 20000;
  if(realQty >= 5) return 10000;
  return 0;
}
function getOrderDiscount(o){
  const realQty = getOrderRealQty(o);
  return getOrderDiscountPerUnit(realQty) * realQty;
}
function getOrderTotal(o){
  const raw = o.items.reduce((sum, it) => sum + getOrderItemPrice(o, it) * it.qty, 0);
  return Math.max(0, raw - getOrderDiscount(o));
}

function printOrdersReport(ordersList, dateLabel){
  const now = new Date().toLocaleString('lo-LA');
  const rows = [];
  ordersList.forEach(o => {
    const discount = getOrderDiscount(o);
    const rowspan = o.items.length + (discount > 0 ? 1 : 0);
    o.items.forEach((it, i) => {
      const unitPrice = getOrderItemPrice(o, it);
      rows.push(`
        <tr>
          ${i===0 ? `<td rowspan="${rowspan}">${esc(o.customerName)}</td><td rowspan="${rowspan}">${esc(o.phone)}</td><td rowspan="${rowspan}">${esc(o.shippingCarrier || '')}</td><td rowspan="${rowspan}">${esc(o.shippingBranch || '')}</td>` : ''}
          <td>${esc(it.productName)}</td>
          <td>${esc(it.size)}</td>
          <td class="num">${it.qty}</td>
          <td class="num">${unitPrice.toLocaleString()}</td>
          <td class="num">${(unitPrice*it.qty).toLocaleString()}</td>
          ${i===0 ? `<td rowspan="${rowspan}">${o.status==='accepted' ? 'ຮັບອໍເດີ້ແລ້ວ' : 'ລໍຖ້າ'}</td>` : ''}
        </tr>
      `);
    });
    if(discount > 0){
      rows.push(`
        <tr>
          <td colspan="4" style="font-style:italic; color:#7B4B24;">ສ່ວນຫຼຸດ (ໄດ້ຮັບສ່ວນຫຼຸດ)</td>
          <td class="num" style="color:#7B4B24;">-${discount.toLocaleString()} ກີບ</td>
        </tr>
      `);
    }
  });
  const totalItems = ordersList.reduce((s,o)=>s+getOrderRealQty(o), 0);
  const grandTotal = ordersList.reduce((s,o)=>s+getOrderTotal(o), 0);
  const bodyHtml = `
    <div class="print-summary">
      <div><span>ຈຳນວນອໍເດີ້</span><b>${ordersList.length}</b></div>
      <div><span>ຈຳນວນສິນຄ້າລວມ</span><b>${totalItems} ໂຕ</b></div>
      <div><span>ຍອດເງິນລວມ</span><b>${grandTotal.toLocaleString()} ກີບ</b></div>
    </div>
    <table class="print-table">
      <thead><tr><th>ລູກຄ້າ</th><th>ເບີໂທ</th><th>ຂົນສົ່ງ</th><th>ທີ່ຢູ່ສາຂາ</th><th>ສິນຄ້າ</th><th>ຂະໜາດ</th><th class="num">ຈຳນວນ</th><th class="num">ລາຄາ/ໜ່ວຍ</th><th class="num">ລວມ</th><th>ສະຖານະ</th></tr></thead>
      <tbody>${rows.join('') || `<tr><td colspan="10" style="text-align:center; color:#888;">ບໍ່ມີອໍເດີ້ໃນວັນທີນີ້</td></tr>`}</tbody>
    </table>
  `;
  const printArea = document.getElementById('print-area');
  printArea.innerHTML = `
    <div class="print-header">
      ${logoImg ? `<img src="${logoImg}" class="print-logo">` : ''}
      <div>
        <h1>ຄັງເສື້ອຜ້າ</h1>
        <p>ລາຍງານອໍເດີ້ປະຈຳວັນທີ ${esc(dateLabel)}</p>
        <p class="print-date">ສ້າງເມື່ອ: ${esc(now)}</p>
      </div>
    </div>
    ${bodyHtml}
  `;
  setTimeout(() => { window.print(); }, 50);
}

function acceptOrder(id){
  customerOrders = customerOrders.map(o => {
    if(o.id !== id) return o;
    /* ລ໊ອກລາຄາຂອງແຕ່ລະລາຍການໄວ້ຕາມລາຄາ ณ ເວລາທີ່ກົດຮັບອໍເດີ້ - ບິນນີ້ຈະບໍ່ປ່ຽນແປງອີກຕໍ່ໄປ
       ເຖິງແມ່ນວ່າລາຄາສິນຄ້າຈະຖືກແກ້ໄຂພາຍຫຼັງກໍ່ຕາມ */
    const lockedItems = o.items.map(it => ({ ...it, unitPrice: getOrderItemPrice(o, it) }));
    return { ...o, items: lockedItems, status:'accepted', updatedAt:new Date().toISOString() };
  });
  saveCustomerOrders();
  showToast('ຮັບອໍເດີ້ແລ້ວ');
  renderOrdersTab();
}

let confirmDeleteOrderId = null;
function confirmDeleteOrder(id){ confirmDeleteOrderId = id; renderOrderConfirm(); }
function cancelDeleteOrder(){ confirmDeleteOrderId = null; renderOrderConfirm(); }
function doDeleteOrder(){
  /* ຄືນຍອດສິນຄ້າກັບຄືນສາງອັດຕະໂນມັດ ສະເພາະບິນທີ່ຍັງ "ລໍຖ້າ" (ຍັງບໍ່ທັນຮັບອໍເດີ້) ເທົ່ານັ້ນ
     ບິນທີ່ "ຮັບອໍເດີ້ແລ້ວ" ຖືວ່າຈັດສົ່ງສິນຄ້າສຳເລັດແລ້ວ 100% - ລຶບບິນນີ້ຈະບໍ່ຄືນສິນຄ້າເຂົ້າສາງ
     (ຜູ້ໃຊ້ຕ້ອງເພີ່ມສິນຄ້າເຂົ້າຄັງດ້ວຍຕົນເອງເທົ່ານັ້ນຖ້າຕ້ອງການ) */
  const o = customerOrders.find(x => x.id === confirmDeleteOrderId);
  if(o && o.status !== 'accepted'){
    o.items.forEach(it => adjustProductStock(it.productId, it.size, it.qty));
    save();
  }
  customerOrders = customerOrders.filter(o => o.id !== confirmDeleteOrderId);
  saveCustomerOrders();
  confirmDeleteOrderId = null;
  renderOrderConfirm();
  showToast('ລຶບອໍເດີ້ແລ້ວ');
  renderOrdersTab();
}
function renderOrderConfirm(){
  const root = document.getElementById('order-confirm-root');
  if(!confirmDeleteOrderId){ root.innerHTML=''; return; }
  const o = customerOrders.find(x=>x.id===confirmDeleteOrderId);
  if(!o){ root.innerHTML=''; return; }
  root.innerHTML = `
    <div class="overlay center" id="order-confirm-overlay">
      <div class="confirm-box">
        <p class="title">ລຶບອໍເດີ້ຂອງ "${esc(o.customerName)}"?</p>
        <p class="desc">ຂໍ້ມູນຈະຖືກລຶບຖາວອນ ແລະ ບໍ່ສາມາດກູ້ຄືນໄດ້</p>
        <div class="confirm-actions">
          <button class="btn-cancel" id="cancel-del-order-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="do-del-order-btn">ລຶບ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('order-confirm-overlay').addEventListener('click', e=>{ if(e.target.id==='order-confirm-overlay') cancelDeleteOrder(); });
  document.getElementById('cancel-del-order-btn').addEventListener('click', cancelDeleteOrder);
  document.getElementById('do-del-order-btn').addEventListener('click', doDeleteOrder);
}

          </select>

function saveEditedOrder(){
  const errorEl = document.getElementById('edit-order-error');
  const name = editOrderState.customerName.trim();
  const phone = editOrderState.phone.trim();
  const shippingCarrier = (editOrderState.shippingCarrier || '').trim();
  const shippingBranch = (editOrderState.shippingBranch || '').trim();
  if(!name){ errorEl.textContent = 'ກະລຸນາໃສ່ຊື່ລູກຄ້າ'; errorEl.style.display = 'block'; return; }
  if(!phone){ errorEl.textContent = 'ກະລຸນາໃສ່ເບີໂທລະສັບ'; errorEl.style.display = 'block'; return; }
  if(!shippingCarrier){ errorEl.textContent = 'ກະລຸນາເລືອກຂົນສົ່ງ'; errorEl.style.display = 'block'; return; }
  if(!shippingBranch){ errorEl.textContent = 'ກະລຸນາລະບຸທີ່ຢູ່ສາຂາ'; errorEl.style.display = 'block'; return; }
  const newItems = editOrderState.items
    .map(it => ({ ...it, qty: Math.max(0, parseInt(it.qty,10) || 0) }))
    .filter(it => it.qty > 0);
  if(newItems.length === 0){ errorEl.textContent = 'ອໍເດີ້ຕ້ອງມີຢ່າງໜ້ອຍ 1 ລາຍການ'; errorEl.style.display = 'block'; return; }

  /* ປັບຍອດສາງຕາມສ່ວນຕ່າງ (delta): ຄືນຈຳນວນເກົ່າກ່ອນ ແລ້ວຄ່ອຍຕັດຈຳນວນໃໝ່ - ກວດສອບຄົງເຫຼືອພຽງພໍກ່ອນບັນທຶກຈິງ */
  const original = customerOrders.find(o => o.id === editOrderState.id);
  const oldItems = original ? original.items : [];
  let testProducts = products.map(pr => ({ ...pr, variants: pr.variants.map(v => ({ ...v })) }));
  function findTestVariant(productId, size){
    const pr = testProducts.find(p => p.id === productId);
    return pr ? (pr.variants.find(v => v.size === size) || null) : null;
  }
  oldItems.forEach(it => { const v = findTestVariant(it.productId, it.size); if(v) v.qty += it.qty; });
  let stockInsufficient = false;
  newItems.forEach(it => {
    const v = findTestVariant(it.productId, it.size);
    if(!v || it.qty > v.qty){ stockInsufficient = true; }
    else { v.qty -= it.qty; }
  });
  if(stockInsufficient){ errorEl.textContent = 'ເຄື່ອງໃນສາງມີບໍ່ພໍ'; errorEl.style.display = 'block'; return; }
  products = testProducts;
  save();

  customerOrders = customerOrders.map(o => o.id === editOrderState.id
    ? { ...o, customerName:name, phone, shippingCarrier, shippingBranch, items:newItems, updatedAt:new Date().toISOString() }
    : o);
  saveCustomerOrders();
  closeEditOrderModal();
  showToast('ບັນທຶກການແກ້ໄຂອໍເດີ້ແລ້ວ');
  renderOrdersTab();
}

      <button type="button" class="grid-addcart-btn${revealedCartId===p.id?' revealed':''}${outOfStock?' disabled':''}" data-action="open-addcart" data-id="${p.id}" ${outOfStock?'disabled':''} title="${outOfStock?'ສິນຄ້າໝົດ ບໍ່ສາມາດເພີ່ມໄດ້':'ເພີ່ມເຂົ້າກະຕ່າ'}">${ICONS.basket}</button>

  return `

      <div class="card-row">
        <button class="thumb" data-action="toggle-expand" data-id="${p.id}">${imgHtml}</button>
        <button class="card-main" data-action="toggle-expand" data-id="${p.id}">

          <div class="tags">${tagsHtml}</div>
        </button>
        <div class="card-right">
          <span class="card-total">${p.totalQty}</span>
          ${p.code ? `<button type="button" class="card-copy-btn" data-action="copy-code" data-id="${p.id}" title="ກ໋ອບປີ້ລະຫັດສິນຄ້າ">${ICONS.copy}</button>` : ''}
          <button class="chevron-btn ${isOpen?'open':''}" data-action="toggle-expand" data-id="${p.id}">${ICONS.chevron}</button>
        </div>
      </div>
      ${isOpen ? expandHtml(p) : ''}
    </div>
  `;
}

function variantRowsHtml(p){
  return p.variants.map(v => `
    <div class="variant-row">
      <span class="variant-size">${esc(v.size)}</span>
      <div class="stepper">
        <button class="step-btn" data-action="adjust-variant" data-id="${p.id}" data-vid="${v.id}" data-delta="-1">${ICONS.minus}</button>
        <span class="step-val">${v.qty}</span>
        <button class="step-btn" data-action="adjust-variant" data-id="${p.id}" data-vid="${v.id}" data-delta="1">${ICONS.plus}</button>
      </div>

}

function expandHtml(p){
  return `
    <div class="expand-panel">
      ${variantRowsHtml(p)}
      <div class="row-actions">
        <button class="btn-edit" data-action="open-edit" data-id="${p.id}">${ICONS.pencil} ແກ້ໄຂ</button>
        <button class="btn-del" data-action="confirm-delete" data-id="${p.id}">${ICONS.trash} ລຶບ</button>
      </div>

}

/* ---------- SELL OUT (deduct stock) ---------- */
let sellState = null;
let buyState = null;

function openSellModal(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  sellState = { productId:id, quantities:{} };
  p.variants.forEach(v => { sellState.quantities[v.id] = ''; });
  renderSellModal();
}
function closeSellModal(){ sellState = null; document.getElementById('sell-root').innerHTML=''; }

function renderSellModal(){
  const root = document.getElementById('sell-root');
  if(!sellState){ root.innerHTML=''; return; }
  const p = products.find(x=>x.id===sellState.productId);
  if(!p){ closeSellModal(); return; }
  const rows = p.variants.map(v => `
    <div class="sell-row">
      <div class="sell-row-info">
        <span class="sell-size">${esc(v.size)}</span>
        <span class="muted">ຄົງເຫຼືອ: ${v.qty}</span>
      </div>
      <input type="number" inputmode="numeric" min="0" max="${v.qty}" placeholder="0" value="${esc(sellState.quantities[v.id])}" data-vid="${v.id}" class="sell-qty-input">
    </div>
  `).join('');
  root.innerHTML = `
    <div class="overlay center" id="sell-overlay">
      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຂາຍອອກ: ${esc(p.name)}</p>
        <p class="desc" style="margin-bottom:12px;">ໃສ່ຈຳນວນທີ່ຂາຍອອກແຕ່ລະຂະໜາດ (ຫ້າມເກີນຈຳນວນຄົງເຫຼືອ)</p>
        <div id="sell-rows">${rows}</div>
        <p id="sell-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="sell-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="sell-confirm-btn" style="background:var(--success);">ຢືນຢັນຂາຍອອກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('sell-overlay').addEventListener('click', e=>{ if(e.target.id==='sell-overlay') closeSellModal(); });
  document.getElementById('sell-cancel-btn').addEventListener('click', closeSellModal);
  document.querySelectorAll('.sell-qty-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      sellState.quantities[e.target.dataset.vid] = e.target.value;
    });
  });
  document.getElementById('sell-confirm-btn').addEventListener('click', confirmSell);
}

function confirmSell(){
  const p = products.find(x=>x.id===sellState.productId);
  if(!p) return;
  const errorEl = document.getElementById('sell-error');
  let totalSold = 0;
  const updates = {};
  for(const v of p.variants){
    const raw = sellState.quantities[v.id];
    const n = parseInt(raw, 10);
    const qty = isNaN(n) ? 0 : n;
    if(qty < 0){ errorEl.textContent = 'ຈຳນວນຕ້ອງບໍ່ຕິດລົບ'; errorEl.style.display = 'block'; return; }
    if(qty > v.qty){ errorEl.textContent = `ຂາຍອອກ "${v.size}" ເກີນຈຳນວນຄົງເຫຼືອ (ມີ ${v.qty})`; errorEl.style.display = 'block'; return; }
    updates[v.id] = qty;
    totalSold += qty;
  }
  if(totalSold <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນຢ່າງໜ້ອຍ 1 ຂະໜາດ'; errorEl.style.display = 'block'; return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => ({ ...v, qty: Math.max(0, v.qty - (updates[v.id] || 0)) })) }
    : pr
  );
  save();
  closeSellModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  showToast(`ຂາຍອອກສຳເລັດ: ${totalSold} ລາຍການ`);
}

/* ---------- BUY-IN (restock) MODAL — mirrors sell, adds to stock ---------- */
function openBuyModal(id){

  buyState = { productId:id, quantities:{} };

}
function closeBuyModal(){ buyState = null; document.getElementById('buy-root').innerHTML=''; }

function renderBuyModal(){

  const p = products.find(x=>x.id===buyState.productId);
  if(!p){ closeBuyModal(); return; }
  const rows = p.variants.map(v => `
    <div class="sell-row">
      <div class="sell-row-info">
        <span class="sell-size">${esc(v.size)}</span>

      </div>

        <p class="desc" style="margin-bottom:12px;">ໃສ່ຈຳນວນທີ່ຊື້ເຂົ້າແຕ່ລະຂະໜາດ, ຈະບວກເພີ່ມເຂົ້າສະຕັອກທີ່ມີຢູ່ທັນທີ</p>

          <button class="btn-cancel" id="buy-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="buy-confirm-btn" style="background:var(--accent); color:var(--dark);">ຢືນຢັນຊື້ເຂົ້າ</button>
        </div>
      </div>

  document.getElementById('buy-cancel-btn').addEventListener('click', closeBuyModal);

function confirmBuy(){
  const p = products.find(x=>x.id===buyState.productId);
  if(!p) return;
  const errorEl = document.getElementById('buy-error');
  let totalBought = 0;
  const updates = {};
  for(const v of p.variants){
    const raw = buyState.quantities[v.id];
    const n = parseInt(raw, 10);
    const qty = isNaN(n) ? 0 : n;
    if(qty < 0){ errorEl.textContent = 'ຈຳນວນຕ້ອງບໍ່ຕິດລົບ'; errorEl.style.display = 'block'; return; }
    updates[v.id] = qty;
    totalBought += qty;
  }
  if(totalBought <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນຢ່າງໜ້ອຍ 1 ຂະໜາດ'; errorEl.style.display = 'block'; return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => ({ ...v, qty: v.qty + (updates[v.id] || 0) })) }
    : pr
  );
  save();
  closeBuyModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  showToast(`ຊື້ເຂົ້າສຳເລັດ: ${totalBought} ລາຍການ, ອັບເດດສະຕັອກແລ້ວ`);
}

/* ---------- QUICK SCAN ACTION (arc-btn-2: scan barcode -> sell/buy) ---------- */
let quickScanState = null;

function openQuickScanActionModal(product){
  const firstVariant = product.variants[0];
  quickScanState = { productId: product.id, action: null, variantId: firstVariant ? firstVariant.id : '', qty: '' };
  renderQuickScanModal();
}
function closeQuickScanModal(){ quickScanState = null; document.getElementById('quick-scan-root').innerHTML = ''; }

function renderQuickScanModal(){
  const root = document.getElementById('quick-scan-root');
  if(!quickScanState){ root.innerHTML = ''; return; }
  const s = quickScanState;
  const p = products.find(x=>x.id===s.productId);
  if(!p){ closeQuickScanModal(); return; }

  if(!s.action){
    root.innerHTML = `
      <div class="overlay center" id="quick-scan-overlay">
        <div class="confirm-box" style="max-width:340px; text-align:left;">
          <p class="title" style="margin-bottom:2px;">${esc(p.name)}</p>
          <p class="desc" style="margin-bottom:16px;">${p.code?('#'+esc(p.code)+' &middot; '):''}ພົບສິນຄ້າກົງກັນ 100%, ເລືອກການດຳເນີນການ</p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="button" id="quick-scan-sell-btn" style="background:var(--success); color:#fff; border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;"><span style="width:20px; height:20px;">${ICONS.sell}</span> ຂາຍອອກ</button>
            <button type="button" id="quick-scan-buy-btn" style="background:var(--accent); color:var(--dark); border:none; border-radius:12px; padding:14px; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;"><span style="width:20px; height:20px;">${ICONS.buy}</span> ຊື້ເຂົ້າ</button>
          </div>
          <div class="confirm-actions" style="margin-top:16px;">
            <button class="btn-cancel" id="quick-scan-cancel-btn" style="width:100%;">ຍົກເລີກ</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('quick-scan-overlay').addEventListener('click', e=>{ if(e.target.id==='quick-scan-overlay') closeQuickScanModal(); });
    document.getElementById('quick-scan-cancel-btn').addEventListener('click', closeQuickScanModal);
    document.getElementById('quick-scan-sell-btn').addEventListener('click', ()=>{ s.action='sell'; renderQuickScanModal(); });
    document.getElementById('quick-scan-buy-btn').addEventListener('click', ()=>{ s.action='buy'; renderQuickScanModal(); });
    return;
  }

  const isSell = s.action === 'sell';
  const variant = p.variants.find(v=>v.id===s.variantId) || p.variants[0];
  const sizePickerHtml = p.variants.length > 1 ? `
    <div class="field">
      <label>ຂະໜາດ *</label>
      <select id="quick-scan-size-select">
        ${p.variants.map(v=>`<option value="${v.id}" ${v.id===variant.id?'selected':''}>${esc(v.size)} (ຄົງເຫຼືອ ${v.qty})</option>`).join('')}
      </select>
    </div>
  ` : `<p class="muted" style="margin:0 0 12px;">ຂະໜາດ: ${esc(variant ? variant.size : '-')} &middot; ຄົງເຫຼືອ: ${variant ? variant.qty : 0}</p>`;

  root.innerHTML = `
    <div class="overlay center" id="quick-scan-overlay">
      <div class="confirm-box" style="max-width:340px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">${isSell?'ຂາຍອອກ':'ຊື້ເຂົ້າ'}: ${esc(p.name)}</p>
        <p class="desc" style="margin-bottom:12px;">${p.code?('#'+esc(p.code)):''}</p>
        ${sizePickerHtml}
        <div class="field" style="margin-bottom:0;">
          <label>ຈຳນວນ *</label>
          <input id="quick-scan-qty" type="number" inputmode="numeric" min="1" value="${esc(s.qty)}" placeholder="0" autofocus>
        </div>
        <p id="quick-scan-error" style="color:var(--danger); font-size:12px; margin:8px 0 0; display:none;"></p>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="quick-scan-back-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="quick-scan-confirm-btn" style="background:${isSell?'var(--success)':'var(--accent)'}; color:${isSell?'#fff':'var(--dark)'};">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('quick-scan-overlay').addEventListener('click', e=>{ if(e.target.id==='quick-scan-overlay') closeQuickScanModal(); });
  document.getElementById('quick-scan-back-btn').addEventListener('click', closeQuickScanModal);
  const sizeSelect = document.getElementById('quick-scan-size-select');
  if(sizeSelect){
    sizeSelect.addEventListener('change', e=>{ s.variantId = e.target.value; renderQuickScanModal(); });
  }
  document.getElementById('quick-scan-qty').addEventListener('input', e=>{ s.qty = e.target.value; });
  document.getElementById('quick-scan-confirm-btn').addEventListener('click', confirmQuickScanAction);
}

function confirmQuickScanAction(){
  const s = quickScanState;
  if(!s) return;
  const p = products.find(x=>x.id===s.productId);
  const errorEl = document.getElementById('quick-scan-error');
  if(!p){ closeQuickScanModal(); return; }
  const variant = p.variants.find(v=>v.id===s.variantId) || p.variants[0];
  if(!variant){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດສິນຄ້າ'; errorEl.style.display = 'block'; return; }
  const n = parseInt(s.qty, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນເປັນຕົວເລກ'; errorEl.style.display = 'block'; return; }

  if(s.action === 'sell'){
    if(variant.qty <= 0){ errorEl.textContent = 'ສິນຄ້າໝົດ'; errorEl.style.display = 'block'; return; }
    if(n > variant.qty){ errorEl.textContent = 'ເຄື່ອງມີບໍ່ພໍຂາຍ'; errorEl.style.display = 'block'; return; }
    products = products.map(pr => pr.id === p.id
      ? { ...pr, variants: pr.variants.map(v => v.id===variant.id ? { ...v, qty: Math.max(0, v.qty - n) } : v) }
      : pr
    );
    save();
    closeQuickScanModal();
    renderAll();
    if(detailId === p.id) renderDetailSheet();
    showToast(`ຂາຍອອກສຳເລັດ: ${n} (${variant.size}), ອັບເດດສະຕັອກແລ້ວ`);
  } else {
    products = products.map(pr => pr.id === p.id
      ? { ...pr, variants: pr.variants.map(v => v.id===variant.id ? { ...v, qty: v.qty + n } : v) }
      : pr
    );
    save();
    closeQuickScanModal();
    renderAll();
    if(detailId === p.id) renderDetailSheet();
    showToast(`ຊື້ເຂົ້າສຳເລັດ: ${n} (${variant.size}), ອັບເດດສະຕັອກແລ້ວ`);
  }
}

/* ---------- PURCHASE ORDER (arc-btn-4: ສັ່ງຊື້ສິນຄ້າ) ---------- */
let poState = null;

function openPurchaseOrderModal(){
  poState = { code:'', product:null, size:'', qty:'' };
  renderPurchaseOrderModal();
}
function closePurchaseOrderModal(){ poState = null; document.getElementById('po-root').innerHTML = ''; }

// Product name is stored as "Base name (color)" e.g. "ຊຸດເຊບຕີ້ (ສີກົມ)" — extract color for display.
function splitNameColor(name){
  const m = /^(.*?)\s*\(([^)]+)\)\s*$/.exec(name || '');
  if(m) return { base: m[1].trim(), color: m[2].trim() };
  return { base: (name||'').trim(), color: '-' };
}

function poLookupCode(raw){
  const code = raw.trim();
  poState.code = raw;
  if(!code){ poState.product = null; poState.size = ''; renderPurchaseOrderModal(); return; }
  const match = products.find(p => (p.code||'').trim().toLowerCase() === code.toLowerCase() && (p.code||'').trim() !== '');
  poState.product = match || null;
  poState.size = match && match.variants.length ? match.variants[0].size : '';
  renderPurchaseOrderModal();
}

function renderPurchaseOrderModal(){
  const root = document.getElementById('po-root');
  if(!poState){ root.innerHTML = ''; return; }
  const s = poState;
  const codeTyped = s.code.trim() !== '';
  const matched = !!s.product;

  let statusHtml = '';
  if(codeTyped && !matched){
    statusHtml = `<div class="po-lookup-status err">${ICONS.alert}<span>ບໍ່ພົບລະຫັດສິນຄ້ານີ້ໃນຖານຂໍ້ມູນ, ກະລຸນາກວດສອບລະຫັດອີກຄັ້ງ</span></div>`;
  } else if(matched){
    statusHtml = `<div class="po-lookup-status ok">${ICONS.chevronRight}<span>ພົບລະຫັດສິນຄ້າ, ຂໍ້ມູນກົງກັນ 100%</span></div>`;
  }

  let matchCardHtml = '';
  if(matched){
    const { base, color } = splitNameColor(s.product.name);
    const sizeOptions = s.product.variants.map(v => `<option value="${esc(v.size)}" ${v.size===s.size?'selected':''}>${esc(v.size)} (ຄົງເຫຼືອ ${v.qty})</option>`).join('');
    matchCardHtml = `
      <div class="po-match-card">
        <div class="po-match-name">${esc(base)}</div>
        <div class="grid2">
          <div class="po-readonly-field">
            <label>ຂະໜາດ (ດຶງຈາກລະບົບ)</label>
            <select id="po-size-select">${sizeOptions}</select>
          </div>
          <div class="po-readonly-field">
            <label>ສີ (ດຶງຈາກລະບົບ)</label>
            <div class="po-static">${esc(color)}</div>
          </div>
        </div>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="overlay" id="po-overlay">
      <div class="modal" id="po-modal">
        <div class="modal-head">
          <h2>ສ້າງລາຍການຈັດຊື້ສິນຄ້າເຂົ້າສາງ</h2>
          <button class="icon-x" id="po-close">${ICONS.x}</button>
        </div>
        <p class="muted" style="margin:-8px 0 14px; font-size:12px;">ບັນທຶກລາຍການທີ່ຕ້ອງສັ່ງຊື້ເພີ່ມ, ຈະບໍ່ບວກເຂົ້າສະຕັອກທັນທີ</p>
        <div class="field">
          <label>ລະຫັດສິນຄ້າ *</label>
          <input id="po-code" value="${esc(s.code)}" placeholder="ພິມ ຫຼື ວາງລະຫັດສິນຄ້າ" autofocus>
        </div>
        ${statusHtml}
        ${matchCardHtml}
        <div class="field" style="margin-top:12px;">
          <label>ຈຳນວນທີ່ຕ້ອງການສັ່ງຊື້ *</label>
          <input id="po-qty" type="number" inputmode="numeric" min="1" value="${esc(s.qty)}" placeholder="0" ${matched?'':'disabled'}>
        </div>
        <p id="po-error" style="color:var(--danger); font-size:12px; margin:4px 0 0; display:none;"></p>

function confirmPurchaseOrder(){
  const errorEl = document.getElementById('po-error');
  const s = poState;
  if(!s.product){ errorEl.textContent = 'ກະລຸນາໃສ່ລະຫັດສິນຄ້າທີ່ຖືກຕ້ອງ ແລະ ມີໃນຖານຂໍ້ມູນ'; errorEl.style.display='block'; return; }
  if(!s.size){ errorEl.textContent = 'ບໍ່ພົບຂະໜາດຂອງສິນຄ້ານີ້'; errorEl.style.display='block'; return; }
  const n = parseInt(s.qty, 10);
  if(isNaN(n) || n <= 0){ errorEl.textContent = 'ກະລຸນາໃສ່ຈຳນວນສັ່ງຊື້ໃຫ້ຖືກຕ້ອງ (ຫຼາຍກວ່າ 0)'; errorEl.style.display='block'; return; }

  const code = (s.product.code||'').trim();
  const { base, color } = splitNameColor(s.product.name);
  /* ແຕ່ລະຄຳສັ່ງຊື້ ແມ່ນລາຍການແຍກຕ່າງຫາກສະເໝີ (ບໍ່ລວມກັບລາຍການເກົ່າ ເຖິງຈະເປັນລະຫັດ+ຂະໜາດດຽວກັນ)
     ເພື່ອໃຫ້ເຫັນວັນ-ເວລາ ແລະ ຈຳນວນຂອງແຕ່ລະຄັ້ງແຍກກັນ */
  purchaseOrders = [...purchaseOrders, {
    id: uid(), code, productId: s.product.id, productName: base, color, size: s.size,
    qty: n, createdAt: new Date().toISOString()
  }];
  savePurchaseOrders();
  closePurchaseOrderModal();
  showToast(`ບັນທຶກຄຳສັ່ງຊື້ສຳເລັດ: ${esc(base)} (${esc(s.size)}) x${n}`);
  if(tab === 'report') renderReport();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderListModal();
}

function removePendingOrder(code, size){
  purchaseOrders = purchaseOrders.filter(o => !(o.code === code && o.size === size));

  renderReport();

function confirmReceiveIntoWarehouse(id){
  const order = purchaseOrders.find(o => o.id === id);
  if(!order) { closeOrderActionModal(); return; }
  const p = products.find(pr => (pr.code||'').trim() === order.code);
  if(!p){ closeOrderActionModal(); showToast('ບໍ່ພົບສິນຄ້າຕາມລະຫັດນີ້'); return; }
  const variant = p.variants.find(v => v.size === order.size);
  if(!variant){ closeOrderActionModal(); showToast('ບໍ່ພົບຂະໜາດສິນຄ້ານີ້'); return; }

  products = products.map(pr => pr.id === p.id
    ? { ...pr, variants: pr.variants.map(v => v.id === variant.id ? { ...v, qty: v.qty + order.qty } : v) }
    : pr
  );
  save();

  purchaseOrders = purchaseOrders.filter(o => o.id !== id);
  savePurchaseOrders();

  closeOrderActionModal();
  renderAll();
  if(detailId === p.id) renderDetailSheet();
  if(document.getElementById('po-list-overlay')) renderPurchaseOrderListModal();
  showToast('ເພີ່ມສິນຄ້າເຂົ້າສາງຮຽບຮ້ອຍແລ້ວ');
}

let scannerStream = null;
let scannerActive = false;
let scannerRAF = null;
let scannerCooldown = false;
let scannerMode = 'receive';
let scannerNewCount = 0;

function openScanner(mode){

  function submitManualCode(){

  }
  document.getElementById('manual-code-btn').addEventListener('click', submitManualCode);
  document.getElementById('manual-code-input').addEventListener('keydown', e=>{
    if(e.key === 'Enter') submitManualCode();
  });

async function startScanner(){
  if(!('BarcodeDetector' in window)) return;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
  }catch(e1){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:true });
    }catch(e2){
      handleCameraError(e2);
      return;
    }
  }
  scannerStream = stream;
  try{
    const video = document.getElementById('scanner-video');
    if(!video){ stopScanner(); return; }
    video.srcObject = scannerStream;
    await video.play();
    const detector = new BarcodeDetector();
    scannerActive = true;
    scannerCooldown = false;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const loop = async () => {
      if(!scannerActive) return;
      if(!scannerCooldown && video.videoWidth){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        try{
          const codes = await detector.detect(canvas);
          if(codes && codes.length){ handleScanResult(codes[0].rawValue); }
        }catch(e){}
      }
      scannerRAF = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    handleCameraError(e);
  }
}

function handleCameraError(e){
  const name = e && e.name;
  let msg = 'ເປີດກ້ອງບໍ່ສຳເລັດ, ກວດການອະນຸຍາດກ້ອງ';
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    msg = 'ບໍ່ໄດ້ຮັບອະນຸຍາດໃຊ້ກ້ອງ — ໄປອະນຸຍາດກ້ອງໃຫ້ browser ນີ້ໃນການຕັ້ງຄ່າ ແລ້ວກັບມາລອງໃໝ່';
  } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    msg = 'ບໍ່ພົບກ້ອງໃນອຸປະກອນນີ້';
  } else if(name === 'NotReadableError' || name === 'TrackStartError'){
    msg = 'ກ້ອງກຳລັງຖືກໃຊ້ໂດຍແອັບອື່ນຢູ່ — ປິດແອັບກ້ອງ/ວິດີໂອອື່ນແລ້ວລອງໃໝ່';
  } else if(name === 'SecurityError'){
    msg = 'ໜ້ານີ້ຕ້ອງເປີດຜ່ານ https ຈຶ່ງຈະໃຊ້ກ້ອງໄດ້';
  }
  showToast(msg);
  const hint = document.getElementById('scanner-hint');
  if(hint){
    hint.innerHTML = `${esc(msg)}<br><button type="button" id="camera-retry-btn" style="margin-top:8px; background:var(--accent); color:var(--dark); border:none; border-radius:999px; padding:6px 16px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">ລອງໃໝ່</button>`;
    hint.style.color = '#E8926B';
    const retryBtn = document.getElementById('camera-retry-btn');
    if(retryBtn) retryBtn.addEventListener('click', ()=>{
      hint.textContent = scannerMode === 'search' ? 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ຈະສະແກນອັດຕະໂນມັດ' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ';
      hint.style.color = 'rgba(255,255,255,.7)';
      startScanner();
    });
  }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild) frame.firstElementChild.style.borderColor = '#B94A3D';
}

function stopScanner(){
  scannerActive = false;
  scannerCooldown = false;
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}

function isKnownBarcode(codeNorm){ return knownBarcodeSet.has(codeNorm); }

async function refreshKnownBarcodesFromSheet(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
    const ok = await ensureToken();
    if(!ok) return;
    const sheetId = await findOrCreateSheet();
    const res = await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A2:A100000`);
    const data = await res.json();
    (data.values || []).forEach(row => {
      if(row[0]) knownBarcodeSet.add(String(row[0]).trim().toLowerCase());
    });
  }catch(e){ /* best-effort, ignore */ }
}

function setScannerHint(text, colorHex){
  const hint = document.getElementById('scanner-hint');
  if(hint){ hint.textContent = text; hint.style.color = colorHex || 'rgba(255,255,255,.7)'; }
  const frame = document.getElementById('scanner-frame');
  if(frame && frame.firstElementChild){ frame.firstElementChild.style.borderColor = colorHex || 'var(--accent)'; }
}

function scheduleBarcodeSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(barcodeSyncTimer);
  barcodeSyncTimer = setTimeout(()=>{ syncScanLogToSheet(true); }, 1200);
}

function handleScanResult(rawCode){
  const code = (rawCode || '').trim();
  if(!code) return;

  if(scannerMode === 'search'){
    stopScanner();
    if(navigator.vibrate) navigator.vibrate(120);
    closeScanner();
    search = code;
    const si = document.getElementById('search-input');
    if(si) si.value = code;
    renderListItems();
    showToast('ຄົ້ນຫາ: ' + code);
    return;
  }

  if(scannerMode === 'quick'){
    stopScanner();
    closeScanner();
    const norm = code.toLowerCase();
    const product = products.find(p => (p.code||'').trim().toLowerCase() === norm && (p.code||'').trim() !== '');
    if(!product){
      if(navigator.vibrate) navigator.vibrate([80,60,80]);
      showToast('ບໍ່ມີສິນຄ້ານີ້ໃນລະບົບ');
      return;
    }
    if(navigator.vibrate) navigator.vibrate(120);
    openQuickScanActionModal(product);
    return;
  }

  // receive mode: duplicate check + log-to-sheet only — camera stays open for continuous scanning
  const norm = code.toLowerCase();
  const isDup = isKnownBarcode(norm);

  if(navigator.vibrate) navigator.vibrate(isDup ? [80,60,80] : 120);

  if(isDup){
    showToast('ພັດສະດຸໄດ້ຮັບແລ້ວ');
    setScannerHint('⚠ ພັດສະດຸໄດ້ຮັບແລ້ວ: ' + code, '#E8A33D');
  } else {
    knownBarcodeSet.add(norm);
    const entry = { id:uid(), code, scannedAt:new Date().toISOString(), isDuplicate:false, syncedToSheet:false };
    scanLog = [entry, ...scanLog];
    saveScanLog();
    scannerNewCount++;
    showToast('ບັນທຶກແລ້ວ: ' + code);
    setScannerHint('✓ ບັນທຶກແລ້ວ: ' + code, '#4C7A5E');
    scheduleBarcodeSync();
  }

  if(tab === 'barcode') renderBarcodeList();

  scannerCooldown = true;
  setTimeout(()=>{
    scannerCooldown = false;
    setScannerHint(scannerNewCount>0 ? 'ສະແກນແລ້ວ ' + scannerNewCount + ' ພັດສະດຸໃໝ່' : 'ວາງ Barcode ໃຫ້ຢູ່ໃນກອບ, ສະແກນຕໍ່ໄດ້ເລື່ອຍໆ', 'var(--accent)');
  }, 1400);
}

function renderManageCategoriesModal(){
  const root = document.getElementById('manage-categories-root');
  if(!manageCategoriesState){ root.innerHTML=''; return; }
  const visible = manageCategoriesState.filter(c => !c.deleted);
  const rows = visible.length ? visible.map(c => `

      ${c.editing
        ? `<input type="text" class="manage-cat-input" data-cid="${c.id}" value="${esc(c.current)}" style="flex:1; background:#fff; border:1px solid var(--dark-10); border-radius:10px; padding:8px 10px; font-size:14px; outline:none; font-family:inherit;">`
