  root.innerHTML = `
    <div class="overlay center" id="manage-cat-overlay">
      <div class="confirm-box" style="max-width:360px; text-align:left;">
        <p class="title" style="margin-bottom:2px;">ຈັດການໝວດໝູ່ສິນຄ້າ</p>
        <p class="desc" style="margin-bottom:12px;">ແກ້ໄຂຊື່ ຫຼື ລຶບໝວດໝູ່, ແລ້ວກົດບັນທຶກເພື່ອຢືນຢັນ</p>
        <div id="manage-cat-rows">${rows}</div>
        <div class="confirm-actions" style="margin-top:16px;">
          <button class="btn-cancel" id="manage-cat-cancel-btn">ຍົກເລີກ</button>
          <button class="btn-confirm" id="manage-cat-save-btn" style="background:var(--dark); color:#fff;">ບັນທຶກ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('manage-cat-overlay').addEventListener('click', e=>{ if(e.target.id==='manage-cat-overlay') closeManageCategoriesModal(); });
  document.getElementById('manage-cat-cancel-btn').addEventListener('click', closeManageCategoriesModal);
  document.getElementById('manage-cat-save-btn').addEventListener('click', saveManagedCategories);

  document.querySelectorAll('[data-action-cat="edit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = manageCategoriesState.find(c => c.id === btn.dataset.cid);
      if(item){ item.editing = !item.editing; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('[data-action-cat="delete"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = manageCategoriesState.find(c => c.id === btn.dataset.cid);
      if(item){ item.deleted = true; renderManageCategoriesModal(); }
    });
  });
  document.querySelectorAll('.manage-cat-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const item = manageCategoriesState.find(c => c.id === e.target.dataset.cid);
      if(item) item.current = e.target.value;
    });
  });
}

function saveManagedCategories(){
  const kept = manageCategoriesState.filter(c => !c.deleted);
  const names = kept.map(c => c.current.trim()).filter(n => n);
  const dedupCheck = new Set(names.map(n=>n.toLowerCase()));
  if(dedupCheck.size !== names.length){
    showToast('ມີຊື່ໝວດໝູ່ຊ້ຳກັນ, ກະລຸນາແກ້ໄຂ');
    return;
  }
  const removedNames = manageCategoriesState.filter(c => c.deleted).map(c => c.original);
  const renameMap = {};
  kept.forEach(c => { if(c.current.trim() !== c.original) renameMap[c.original] = c.current.trim(); });

  CATEGORIES = names;
  saveCategories();

  if(Object.keys(renameMap).length || removedNames.length){
    products = products.map(p => {
      if(p.category && renameMap[p.category]) return { ...p, category: renameMap[p.category] };
      if(p.category && removedNames.includes(p.category)) return { ...p, category: '' };
      return p;
    });
    save();
  }
  if(removedNames.includes(reportCategoryFilter) || (renameMap[reportCategoryFilter])){
    reportCategoryFilter = renameMap[reportCategoryFilter] || '';
  }

  closeManageCategoriesModal();
  showToast('ບັນທຶກການປ່ຽນແປງໝວດໝູ່ແລ້ວ');
  renderReport();
}

function renderVariants(){
  const container = document.getElementById('variants-container');
  container.innerHTML = formState.variants.map(v => {
    const known = SIZE_OPTIONS.includes(v.size);
    const extraOpt = (v.size && !known) ? `<option value="${esc(v.size)}" selected>${esc(v.size)}</option>` : '';
    const opts = `<option value="">-- ຂະໜາດ --</option>` + extraOpt + SIZE_OPTIONS.map(s => `<option value="${esc(s)}" ${v.size===s?'selected':''}>${esc(s)}</option>`).join('');
    return `
    <div class="vrow" data-vid="${v.id}">
      <select data-vfield="size">${opts}</select>
      <input type="number" inputmode="numeric" value="${esc(v.qty)}" data-vfield="qty" placeholder="ຈຳນວນ">
      <button type="button" data-remove-variant="${v.id}" ${formState.variants.length<=1?'disabled':''}>${ICONS.trash}</button>
    </div>
  `;
  }).join('');

  container.querySelectorAll('.vrow').forEach(row=>{
    const vid = row.dataset.vid;
    row.querySelector('[data-vfield="size"]').addEventListener('change', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.size = e.target.value;
    });
    row.querySelector('[data-vfield="qty"]').addEventListener('input', e=>{
      const v = formState.variants.find(x=>x.id===vid); if(v) v.qty = e.target.value;
    });
  });
  container.querySelectorAll('[data-remove-variant]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(formState.variants.length<=1) return;
      formState.variants = formState.variants.filter(v=>v.id!==btn.dataset.removeVariant);
      renderVariants();
    });
  });
}

function addSizeRow(size){
  if(size && formState.variants.some(v=>v.size.toLowerCase()===size.toLowerCase())) return;
  formState.variants.push({ id:uid(), size, qty:'' });
  renderVariants();
}

function handleImagePick(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  resizeImage(file).then(dataUrl=>{
    formState.image = dataUrl;
    renderModal();
  }).catch(()=>{ showToast('ເລືອກຮູບບໍ່ສຳເລັດ'); });
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 640; quality = quality || 0.75;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function handleSubmit(e){
  e.preventDefault();
  const f = formState;
  const errorEl = document.getElementById('form-error');
  if(errorEl){ errorEl.style.display = 'none'; errorEl.textContent = ''; }
  if(!f.name.trim()) return;
  const price = Math.max(0, parseFloat(f.price) || 0);
  const minQty = Math.max(0, parseInt(f.minQty,10) || 0);
  const variants = f.variants
    .filter(v => v.size.trim() !== '' || f.variants.length === 1)
    .map(v => ({ id:v.id, size: v.size.trim() || 'ບໍລິການອື່ນ', qty: Math.max(0, parseInt(v.qty,10) || 0) }));

  const codeTrim = f.code.trim();
  if(codeTrim){
    const codeClash = products.some(p => p.id !== f.id && (p.code||'').trim().toLowerCase() === codeTrim.toLowerCase());
    if(codeClash){
      if(errorEl){ errorEl.textContent = 'ລະຫັດສິນຄ້າ "' + codeTrim + '" ມີຢູ່ແລ້ວ, ກະລຸນາປ່ຽນ ຫຼື ປ່ອຍຫວ່າງ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const nameTrim = f.name.trim().toLowerCase();
  const relatedProducts = products.filter(p => p.id !== f.id && p.name.trim().toLowerCase() === nameTrim);
  for(const v of variants){
    const sizeTrim = v.size.trim().toLowerCase();
    const clashProduct = relatedProducts.find(p => p.variants.some(rv => rv.size.trim().toLowerCase() === sizeTrim));
    if(clashProduct){
      if(errorEl){ errorEl.textContent = 'ຂະໜາດ "' + v.size + '" ຊ້ຳກັບສິນຄ້າ "' + clashProduct.name + '" ແລ້ວ (ຊື່ດຽວກັນ), ກະລຸນາປ່ຽນເປັນຂະໜາດອື່ນ'; errorEl.style.display = 'block'; }
      return;
    }
  }

  const payload = { name:f.name.trim(), code:codeTrim, unit:f.unit||'ລາຍການ', price, minQty, category:f.category||'', image:f.image, variants };

  if(f.id){
    products = products.map(p => p.id===f.id ? { ...p, ...payload } : p);
    showToast('ແກ້ໄຂສິນຄ້າແລ້ວ');
  } else {
    products = [{ id: Date.now().toString(), ...payload }, ...products];
    showToast('ເພີ່ມສິນຄ້າແລ້ວ');
  }
  save();
  closeModal();
  renderAll();
}

/* ---------- GOOGLE DRIVE SYNC ---------- */
const GDRIVE_CLIENT_ID_KEY = 'khang-sinkha-gdrive-client-id';
const GDRIVE_FILE_ID_KEY = 'khang-sinkha-gdrive-file-id';
const GDRIVE_CONNECTED_KEY = 'khang-sinkha-gdrive-connected';
const GDRIVE_LAST_SYNC_KEY = 'khang-sinkha-gdrive-last-sync';
const DRIVE_FILE_NAME = 'khang-sinkha-backup.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets';
const SHEET_ID_KEY = 'khang-sinkha-sheet-id';
const SHEET_LAST_SYNC_KEY = 'khang-sinkha-sheet-last-sync';
const SHEET_TITLE = 'khang-sinkha-barcode-log';

let tokenClient = null;
let gdriveToken = null;
let syncDebounceTimer = null;

function getClientId(){ return localStorage.getItem(GDRIVE_CLIENT_ID_KEY) || ''; }

function loadGsiScript(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('gsi load failed'));
    document.head.appendChild(s);
  });
}

function connectDrive(promptMode){
  const clientId = getClientId();
  if(!clientId){ showToast('ກະລຸນາໃສ່ Google Client ID ກ່ອນ'); return Promise.resolve(false); }
  return loadGsiScript().then(()=> new Promise((resolve)=>{
    try{
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: (resp) => {
          if(resp && resp.access_token){
            gdriveToken = { access_token: resp.access_token, expires_at: Date.now() + (resp.expires_in*1000 - 60000) };
            localStorage.setItem(GDRIVE_CONNECTED_KEY, '1');
            resolve(true);
          } else resolve(false);
        },
        error_callback: () => resolve(false)
      });
      tokenClient.requestAccessToken({ prompt: promptMode === undefined ? '' : promptMode });
    }catch(e){ resolve(false); }
  })).catch(()=>{ showToast('ໂຫຼດ Google SDK ບໍ່ສຳເລັດ, ກວດອິນເຕີເນັດ'); return false; });
}

function isDriveConnected(){ return !!(gdriveToken && gdriveToken.expires_at > Date.now()); }

async function ensureToken(){
  if(isDriveConnected()) return true;
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return false;
  return await connectDrive('none');
}

async function driveRequest(url, options){
  const ok = await ensureToken();
  if(!ok) throw new Error('no-auth');
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + gdriveToken.access_token });
  const res = await fetch(url, options);
  if(!res.ok){ const t = await res.text(); throw new Error('drive-error: '+res.status+' '+t); }
  return res;
}

async function findDriveFileId(){
  let fileId = localStorage.getItem(GDRIVE_FILE_ID_KEY);
  if(fileId) return fileId;
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const data = await res.json();
  if(data.files && data.files.length){
    fileId = data.files[0].id;
    localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    return fileId;
  }
  return null;
}

async function findOrCreateSheet(){
  let sheetId = localStorage.getItem(SHEET_ID_KEY);
  if(sheetId) return sheetId;
  const q = encodeURIComponent(`name='${SHEET_TITLE}' and trashed=false and mimeType='application/vnd.google-apps.spreadsheet'`);
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const data = await res.json();
  if(data.files && data.files.length){
    sheetId = data.files[0].id;
    localStorage.setItem(SHEET_ID_KEY, sheetId);
    return sheetId;
  }
  const createRes = await driveRequest('https://sheets.googleapis.com/v4/spreadsheets', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ properties:{ title: SHEET_TITLE }, sheets:[{ properties:{ title:'Log' } }] })
  });
  const createData = await createRes.json();
  sheetId = createData.spreadsheetId;
  localStorage.setItem(SHEET_ID_KEY, sheetId);
  await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A1:B1?valueInputOption=RAW`, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ values:[['ລະຫັດ Barcode','ວັນທີ-ເວລາ ຮັບເຂົ້າ']] })
  });
  return sheetId;
}

async function syncScanLogToSheet(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){
      ok = await connectDrive('');
    }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google'); return; }
    const sheetId = await findOrCreateSheet();
    const unsynced = scanLog.filter(r=>!r.syncedToSheet);
    if(unsynced.length === 0){ if(!silent) showToast('ບໍ່ມີລາຍການໃໝ່ໃຫ້ sync'); return; }
    const rows = unsynced.map(r => [r.code, new Date(r.scannedAt).toLocaleString('lo-LA')]);
    await driveRequest(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Log!A:B:append?valueInputOption=RAW`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ values: rows })
    });
    const unsyncedIds = new Set(unsynced.map(r=>r.id));
    scanLog = scanLog.map(r => unsyncedIds.has(r.id) ? { ...r, syncedToSheet:true } : r);
    saveScanLog();
    localStorage.setItem(SHEET_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('ສົ່ງອອກ Log ໄປ Google Sheet ສຳເລັດ (' + unsynced.length + ' ລາຍການ)');
    if(tab === 'barcode') renderBarcodeTab();
  }catch(e){
    if(!silent) showToast('ສົ່ງອອກບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncToDrive(silent){
  try{
    let ok = await ensureToken();
    if(!ok && !silent){ ok = await connectDrive(''); }
    if(!ok){ if(!silent) showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive, ກະລຸນາລອງໃໝ່'); return; }
    let fileId = await findDriveFileId();
    const payload = JSON.stringify({ app:'khang-sinkha', version:2, exportedAt:new Date().toISOString(), products, logo:logoImg, cover:coverImg, categories:CATEGORIES, customerOrders, purchaseOrders, scanLog });
    if(!fileId){
      const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = '-------khangsinkha' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method:'POST',
        headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      const data = await res.json();
      fileId = data.id;
      localStorage.setItem(GDRIVE_FILE_ID_KEY, fileId);
    } else {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method:'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: payload
      });
    }
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, new Date().toISOString());
    if(!silent) showToast('Sync ຂຶ້ນ Google Drive ສຳເລັດ');
    if(document.getElementById('backup-overlay')) renderBackupModal();
  } catch(e){
    if(!silent) showToast('Sync ບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ');
  }
}

async function syncFromDrive(){
  try{
    let ok = await ensureToken();
    if(!ok){ ok = await connectDrive(''); }
    if(!ok){ showToast('ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ Google Drive, ກະລຸນາລອງໃໝ່'); return; }
    const fileId = await findDriveFileId();
    if(!fileId){ showToast('ຍັງບໍ່ມີໄຟລ໌ສຳຮອງໃນ Drive'); return; }
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) throw new Error('bad format');
    pendingImportData = {
      products:list,
      logo: Array.isArray(parsed) ? null : (parsed.logo || null),
      cover: Array.isArray(parsed) ? null : (parsed.cover || null),
      categories: Array.isArray(parsed) ? null : (Array.isArray(parsed.categories) ? parsed.categories : null),
      customerOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.customerOrders) ? parsed.customerOrders : null),
      purchaseOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.purchaseOrders) ? parsed.purchaseOrders : null),
      scanLog: Array.isArray(parsed) ? null : (Array.isArray(parsed.scanLog) ? parsed.scanLog : null)
    };
    renderImportConfirm();
  } catch(e){
    showToast('ດຶງຂໍ້ມູນຈາກ Drive ບໍ່ສຳເລັດ');
  }
}

function disconnectDrive(){
  gdriveToken = null;
  localStorage.removeItem(GDRIVE_CONNECTED_KEY);
  localStorage.removeItem(GDRIVE_FILE_ID_KEY);
  showToast('ຍົກເລີກການເຊື່ອມຕໍ່ Google Drive ແລ້ວ');
  renderBackupModal();
}

function scheduleAutoSync(){
  if(!localStorage.getItem(GDRIVE_CONNECTED_KEY)) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(()=>{ syncToDrive(true); }, 2500);
}

function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const list = Array.isArray(parsed) ? parsed : parsed.products;
      if(!Array.isArray(list)) throw new Error('bad format');
      const valid = list.every(p => p && typeof p.name === 'string');
      if(!valid) throw new Error('bad format');
      pendingImportData = {
        products:list,
        logo: Array.isArray(parsed) ? null : (parsed.logo || null),
        cover: Array.isArray(parsed) ? null : (parsed.cover || null),
        categories: Array.isArray(parsed) ? null : (Array.isArray(parsed.categories) ? parsed.categories : null),
        customerOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.customerOrders) ? parsed.customerOrders : null),
        purchaseOrders: Array.isArray(parsed) ? null : (Array.isArray(parsed.purchaseOrders) ? parsed.purchaseOrders : null),
        scanLog: Array.isArray(parsed) ? null : (Array.isArray(parsed.scanLog) ? parsed.scanLog : null)
      };
      renderImportConfirm();
    }catch(err){
      showToast('ໄຟລ໌ບໍ່ຖືກຕ້ອງ, ບໍ່ສາມາດນຳເຂົ້າໄດ້');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function copyProductCode(id){
  const p = products.find(x => x.id === id);
  if(!p || !p.code) return;
  const code = p.code;
  const done = ()=> showToast('ກ໋ອບປີ້ລະຫັດ ' + code + ' ແລ້ວ');
  const fail = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('ກ໋ອບປີ້ບໍ່ສຳເລັດ'); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(fail);
  } else {
    fail();
  }
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;

  const id = t.dataset.id;
  if(action === 'toggle-expand'){
    expanded[id] = !expanded[id];
    if(tab === 'categories' && categoryDetailName){ renderCategoryListItems(categoryDetailName); }
    else { renderListItems(); }
  } else if(action === 'open-category'){
    openCategoryDetail(t.dataset.cat);
  } else if(action === 'open-detail'){
    openDetail(id);
  } else if(action === 'duplicate-product'){
    openDuplicate(id);
  } else if(action === 'copy-code'){
    e.stopPropagation();
    copyProductCode(id);
  } else if(action === 'open-cart'){
    e.stopPropagation();
    if(revealedCartId !== id){
      /* ຄັ້ງທຳອິດ: ພຽງແຕ່ກາງປຸ່ມກະຕ່າອອກມາ, ຍັງບໍ່ເປີດ popup */
      revealedCartId = id;
      renderListItems();
    } else {
      openCartModal(id);
    }
  } else if(action === 'open-addcart'){
    e.stopPropagation();
    if(revealedCartId === id) openAddCartModal(id);
  } else if(action === 'edit-order'){
    openEditOrderModal(id);
  } else if(action === 'accept-order'){
    acceptOrder(id);
  } else if(action === 'delete-order'){
    confirmDeleteOrder(id);
  } else if(action === 'open-sell'){
    openSellModal(id);
  } else if(action === 'open-buy'){
    openBuyModal(id);
  } else if(action === 'open-edit'){
    openEdit(id);
  } else if(action === 'confirm-delete'){
    confirmDelete(id);
  } else if(action === 'adjust-variant'){
    const vid = t.dataset.vid;
    const delta = parseInt(t.dataset.delta, 10);
    products = products.map(p => p.id===id ? { ...p, variants: p.variants.map(v => v.id===vid ? {...v, qty: Math.max(0, v.qty+delta)} : v) } : p);
    save();
    renderAll();
    if(detailId === id) renderDetailSheet();
  } else if(action === 'delete-scan'){
    const scanId = t.dataset.scanId;
    scanLog = scanLog.filter(r=>r.id!==scanId);
    saveScanLog();
    renderBarcodeList();
  }
});

async function autoPullOnLoad(){
  try{
    if(!localStorage.getItem(GDRIVE_CONNECTED_KEY) || location.protocol === 'file:') return;
    const ok = await ensureToken();
    if(!ok) return;
    const fileId = await findDriveFileId();
    if(!fileId) return;
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const parsed = await res.json();
    const remoteTime = parsed.exportedAt ? new Date(parsed.exportedAt).getTime() : 0;
    const lastSyncStr = localStorage.getItem(GDRIVE_LAST_SYNC_KEY);
    const localSyncTime = lastSyncStr ? new Date(lastSyncStr).getTime() : 0;
    if(!remoteTime || remoteTime <= localSyncTime) return;

    const list = Array.isArray(parsed) ? parsed : parsed.products;
    if(!Array.isArray(list)) return;

    products = list.map(p => ({
      id: p.id || uid(),
      name: p.name || '',
      code: p.code || '',
      unit: p.unit || 'ລາຍການ',
      price: Number(p.price) || 0,
      minQty: Number(p.minQty) || 0,
      category: p.category || '',
      image: p.image || null,
      variants: Array.isArray(p.variants) && p.variants.length
        ? p.variants.map(v => ({ id:v.id || uid(), size:v.size || 'ບໍລິການອື່ນ', qty:Number(v.qty) || 0 }))
        : [{ id:uid(), size:'ບໍລິການອື່ນ', qty:0 }]
    }));
    if(parsed.logo){ logoImg = parsed.logo; localStorage.setItem(LOGO_KEY, logoImg); }
    if(parsed.cover){ coverImg = parsed.cover; localStorage.setItem(COVER_KEY, coverImg); }
    if(Array.isArray(parsed.categories)){ CATEGORIES = parsed.categories; localStorage.setItem(CATEGORIES_KEY, JSON.stringify(CATEGORIES)); }
    if(Array.isArray(parsed.customerOrders)){ customerOrders = parsed.customerOrders; localStorage.setItem(CUSTOMER_ORDERS_KEY, JSON.stringify(customerOrders)); }
    if(Array.isArray(parsed.purchaseOrders)){ purchaseOrders = parsed.purchaseOrders; localStorage.setItem(PURCHASE_ORDERS_KEY, JSON.stringify(purchaseOrders)); }
    if(Array.isArray(parsed.scanLog)){ scanLog = parsed.scanLog; localStorage.setItem(SCANLOG_KEY, JSON.stringify(scanLog)); }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    localStorage.setItem(GDRIVE_LAST_SYNC_KEY, parsed.exportedAt);
    renderAll();
    showToast('ດຶງຂໍ້ມູນລ່າສຸດຈາກ Drive ອັດຕະໂນມັດແລ້ວ');
  }catch(e){ /* best-effort background refresh, ignore failures */ }
}

/* ---------- UNIVERSAL CLEAR (×) BUTTON FOR TEXT/NUMBER INPUT FIELDS ---------- */
/* ອັດຕະໂນມັດເພີ່ມປຸ່ມ × (ວົງມົນສີແດງ) ໃສ່ຊ່ອງພິມທີ່ແກ້ໄຂໄດ້ທົ່ວແອັບ ເພື່ອລຶບຂໍ້ມູນທັງໝົດໃນຊ່ອງນັ້ນທັນທີ */
/* ຍົກເວັ້ນ: ຊ່ອງຈຳນວນແບບ stepper (ຄັບແຄບ, ພິມສັ້ນ), ຊ່ອງວັນທີ, ຊ່ອງໄຟລ໌, ແລະ ຊ່ອງທີ່ຈັດການເອງແລ້ວ (search-input) */
const CLEARABLE_INPUT_TYPES = ['text', 'tel', 'number', 'email', 'search', ''];
const NO_CLEAR_IDS = ['quick-scan-qty', 'po-qty', 'orders-date-input'];
function shouldSkipClearableInput(inp){
  if(inp.dataset.noClear) return true;
  if(NO_CLEAR_IDS.indexOf(inp.id) !== -1) return true;
  if(inp.className && inp.className.indexOf('qty-input') !== -1) return true;
  if(inp.closest('.vrow')) return true;
  const type = (inp.getAttribute('type') || 'text').toLowerCase();
  return CLEARABLE_INPUT_TYPES.indexOf(type) === -1;
}
function initClearableInputs(root){
  const scope = root || document;
  if(!scope.querySelectorAll) return;
  scope.querySelectorAll('input').forEach(inp=>{
    if(inp.dataset.clearInit) return;
    inp.dataset.clearInit = '1';
    if(shouldSkipClearableInput(inp)) return;
    const parent = inp.parentNode;
    if(!parent) return;
    const wrap = document.createElement('span');
    wrap.className = 'clear-input-wrap';
    const parentDisplay = getComputedStyle(parent).display;
    if(parentDisplay.indexOf('flex') !== -1){
      const inpFlex = getComputedStyle(inp).flex;
      wrap.style.display = 'flex';
      wrap.style.alignItems = 'center';
      wrap.style.flex = (inpFlex && inpFlex !== '0 1 auto') ? inpFlex : '1 1 auto';
      wrap.style.minWidth = '0';
    } else {
      wrap.style.display = 'block';
    }
    parent.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'clear-input-btn';
    btn.textContent = '✕';
    btn.setAttribute('aria-label', 'ລຶບຂໍ້ມູນ');
    wrap.appendChild(btn);
    const toggle = () => { btn.style.display = inp.value ? 'flex' : 'none'; };
    toggle();
    inp.addEventListener('input', toggle);
    btn.addEventListener('mousedown', e=>{ e.preventDefault(); });
    btn.addEventListener('click', ()=>{
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles:true }));
      inp.dispatchEvent(new Event('change', { bubbles:true }));
      inp.focus();
      toggle();
    });
  });
}
let clearableInputsScanQueued = false;
function queueClearableInputsScan(){
  if(clearableInputsScanQueued) return;
  clearableInputsScanQueued = true;
  requestAnimationFrame(()=>{ clearableInputsScanQueued = false; initClearableInputs(document); });
}
initClearableInputs(document);
new MutationObserver(queueClearableInputsScan).observe(document.body, { childList:true, subtree:true });
</script>
